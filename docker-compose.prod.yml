# Sciencepedia — chạy public trên một VPS.
#
# Gồm 3 container: Caddy (HTTPS tự động) → web (Next.js) → meilisearch.
# PostgreSQL và Storage vẫn ở Supabase, không chạy ở đây.
#
#   1. Trỏ DNS bản ghi A của domain về IP của VPS
#   2. Tạo file .env.prod (xem README mục Triển khai)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Meilisearch KHÔNG mở cổng ra ngoài: chỉ container web trong cùng network
# gọi được. Nếu publish 7700 ra internet thì master key trở thành mục tiêu tấn công.

services:
  caddy:
    image: caddy:2-alpine
    container_name: sciencepedia-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # chứng chỉ Let's Encrypt — mất là bị rate limit khi cấp lại
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?can dat SITE_DOMAIN trong .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?can dat ACME_EMAIL trong .env.prod}
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

  web:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL:?}
        DIRECT_URL: ${DIRECT_URL:?}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Sciencepedia}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
    container_name: sciencepedia-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?}
      DIRECT_URL: ${DIRECT_URL:?}
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: ${NEXT_PUBLIC_SITE_URL:?}
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-article-images}
      # Tên service trong network nội bộ, không phải localhost
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Sciencepedia}
    depends_on:
      meilisearch:
        condition: service_healthy
    networks: [edge, internal]

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: sciencepedia-search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    # Không có `ports:` — chỉ truy cập được từ trong network internal
    networks: [internal]
    healthcheck:
      # 127.0.0.1 chứ không phải localhost: localhost resolve sang ::1 còn
      # Meilisearch chỉ listen IPv4
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

networks:
  edge:
  internal:
    internal: true

volumes:
  meilidata:
  caddy_data:
  caddy_config:
