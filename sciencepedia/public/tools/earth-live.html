<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trái Đất thời gian thực — Sciencepedia</title>
    <meta
      name="description"
      content="Ảnh vệ tinh Trái Đất gần thời gian thực từ NASA GIBS: GOES-East, GOES-West, Himawari và VIIRS."
    />

    <!--
      Leaflet 1.9.4 từ unpkg. Chọn Leaflet chứ không phải OpenLayers hay Cesium:

      · Leaflet nén gzip khoảng 42 KB và không cần bước build nào. OpenLayers
        gấp khoảng năm lần và phần lớn khối lượng đó là những thứ trang này
        không dùng: chiếu bản đồ tuỳ ý, vector tiles, chỉnh sửa hình học.
      · GIBS phát tile theo WMTS RESTful, tức là một mẫu URL có {z}/{y}/{x}.
        Với dạng đó thì `L.tileLayer` dùng thẳng được; không cần lớp WMTS
        chuyên dụng của OpenLayers.
      · Cesium là quả cầu 3D: khoảng 3 MB script cộng một thư mục tài nguyên
        phải tự phục vụ, và một số tính năng đòi token ion. Đổi lại chỉ là góc
        nhìn cầu — trong khi ảnh vệ tinh khí tượng vốn được đọc trên bản đồ
        phẳng.
    -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://gibs.earthdata.nasa.gov" crossorigin />

    <style>
      :root {
        --bg: #04060e;
        --panel: rgba(15, 23, 42, 0.85);
        --line: rgba(255, 255, 255, 0.08);
        --text: #e8edf7;
        --muted: rgba(232, 237, 247, 0.55);
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #map {
        position: absolute;
        inset: 0;
        background: var(--bg);
      }

      /* Leaflet vẽ nền ô chưa tải bằng màu xám sáng. Giữa một giao diện tối,
         mỗi ô đang tải sẽ là một mảng sáng nhấp nháy. */
      .leaflet-container {
        background: var(--bg);
      }

      .panel {
        position: absolute;
        z-index: 1000;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.8);
      }

      /* ------------------------------------------------- Bộ chọn lớp ảnh */
      #layers {
        top: 12px;
        left: 12px;
        padding: 10px;
        max-width: min(290px, calc(100vw - 24px));
        max-height: calc(100dvh - 24px);
        overflow-y: auto;
      }

      #layers h1 {
        margin: 2px 6px 8px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }

      .group {
        margin: 10px 6px 4px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(232, 237, 247, 0.38);
      }

      .layer-btn {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 8px 10px;
        margin-top: 3px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }

      .layer-btn:hover {
        background: rgba(255, 255, 255, 0.07);
      }

      .layer-btn[aria-pressed="true"] {
        background: rgba(56, 189, 248, 0.14);
        border-color: rgba(56, 189, 248, 0.45);
      }

      .layer-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .layer-btn .emoji {
        font-size: 16px;
        line-height: 1;
      }

      .layer-btn .meta {
        min-width: 0;
      }

      .layer-btn .name {
        display: block;
        font-weight: 500;
      }

      .layer-btn .where {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }

      /* ---------------------------------------------------- Bảng dữ liệu */
      #info {
        right: 12px;
        bottom: 12px;
        padding: 12px 14px;
        max-width: min(310px, calc(100vw - 24px));
      }

      #info dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 14px;
        margin: 0;
        font-size: 12px;
      }

      #info dt {
        color: var(--muted);
      }

      #info dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #info .note {
        margin: 9px 0 0;
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
      }

      /* ------------------------------------------------- Đồng hồ và toạ độ */
      #clock {
        top: 12px;
        right: 12px;
        padding: 8px 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      #cursor {
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        padding: 6px 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* Toạ độ con trỏ vô nghĩa trên thiết bị cảm ứng — ở đó không có con trỏ */
      @media (hover: none) {
        #cursor {
          display: none;
        }
      }

      #banner {
        /* 64px chứ không 12px: ô tìm khu vực nay chiếm giữa mép trên, và
           biểu ngữ hay bật lên đúng lúc vừa chọn khu vực xong. */
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 14px;
        font-size: 12px;
        border-color: rgba(251, 191, 36, 0.35);
        background: rgba(69, 26, 3, 0.9);
        color: #fde68a;
        display: none;
      }

      #banner[data-open="true"] {
        display: block;
      }

      .leaflet-control-attribution {
        background: rgba(15, 23, 42, 0.8) !important;
        color: var(--muted) !important;
        font-size: 10px !important;
      }

      .leaflet-control-attribution a {
        color: var(--accent) !important;
      }

      .leaflet-bar a {
        background: var(--panel) !important;
        color: var(--text) !important;
        border-color: var(--line) !important;
      }

      .leaflet-bar a:hover {
        background: rgba(30, 41, 59, 0.95) !important;
      }

      .leaflet-control-scale-line {
        background: rgba(15, 23, 42, 0.8) !important;
        border-color: var(--line) !important;
        color: var(--text) !important;
      }

      @media (max-width: 640px) {
        #info {
          left: 12px;
          right: 12px;
          max-width: none;
        }
        #clock {
          font-size: 12px;
          padding: 6px 10px;
        }
      }

      /* ------------------------------------------------ Tìm theo khu vực */
      /* Giữa mép trên: chỗ duy nhất còn trống giữa bộ chọn lớp (trái) và
         đồng hồ UTC (phải). Bề rộng chặn trên bằng 360px để ở màn hình rộng
         nó không kéo dài thành một thanh công cụ. */
      #search {
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: min(360px, calc(100vw - 340px));
        padding: 8px;
      }

      #region-input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 11px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(2, 6, 23, 0.65);
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }

      #region-input::placeholder {
        color: var(--muted);
      }

      #region-input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      #region-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
        max-height: min(320px, 50dvh);
        overflow-y: auto;
        display: none;
      }

      #search[data-open="true"] #region-list {
        display: block;
      }

      #region-list li {
        margin: 0;
      }

      #region-list button {
        display: flex;
        width: 100%;
        align-items: baseline;
        gap: 8px;
        padding: 7px 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }

      #region-list button:hover,
      #region-list button[data-active="true"] {
        background: rgba(56, 189, 248, 0.14);
      }

      #region-list button span {
        color: var(--muted);
        font-size: 11px;
        margin-left: auto;
        white-space: nowrap;
      }

      #region-empty {
        padding: 8px 10px;
        color: var(--muted);
        font-size: 12px;
      }

      /* Dưới 860px ô tìm kiếm không còn chỗ ở giữa hai panel kia — cho nó
         xuống hàng riêng bên dưới bộ chọn lớp, vẫn căn giữa. */
      @media (max-width: 860px) {
        #search {
          top: auto;
          bottom: 52px;
          width: min(360px, calc(100vw - 24px));
        }
      }
    </style>
  </head>

  <body>
    <div id="map" role="application" aria-label="Bản đồ ảnh vệ tinh Trái Đất"></div>

    <section class="panel" id="layers" aria-label="Chọn lớp ảnh vệ tinh">
      <h1>Lớp ảnh vệ tinh</h1>
      <div id="layer-buttons"></div>
    </section>

    <div class="panel" id="clock" aria-live="off">
      <span id="utc">--:--:--</span> UTC
    </div>

    <section class="panel" id="info" aria-label="Thông tin dữ liệu">
      <dl>
        <dt>Nguồn</dt>
        <dd id="info-source">NASA GIBS</dd>
        <dt>Lớp</dt>
        <dd id="info-layer">—</dd>
        <dt>Thời điểm dữ liệu</dt>
        <dd id="info-time">—</dd>
        <dt>Cập nhật</dt>
        <dd id="info-age">—</dd>
      </dl>
      <p class="note" id="info-note"></p>
    </section>

    <section class="panel" id="search" aria-label="Tìm theo khu vực">
      <input
        id="region-input"
        type="text"
        role="combobox"
        aria-expanded="false"
        aria-controls="region-list"
        aria-autocomplete="list"
        autocomplete="off"
        placeholder="Tìm khu vực — Việt Nam, Nhật Bản, Bắc Mỹ…"
      />
      <ul id="region-list" role="listbox" aria-label="Khu vực"></ul>
      <p id="region-empty" hidden>Không có khu vực nào khớp.</p>
    </section>

    <div class="panel" id="cursor">—</div>
    <div class="panel" id="banner" role="status"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      "use strict";

      /* ==================================================================
         1. DANH MỤC LỚP ẢNH

         Mọi định danh, TileMatrixSet và định dạng dưới đây đọc thẳng từ
         WMTSCapabilities của GIBS (epsg3857/best), không phải đoán. Sai một
         trong ba thứ đó là ra đúng cái "ảnh trắng" mà trang này phải tránh.

         Hai lớp trong yêu cầu ban đầu KHÔNG tồn tại trên GIBS và không được
         thay bằng lớp khác rồi gắn nhãn của chúng:

         · Day Cloud Phase Distinction
         · Night Microphysics

         GIBS chỉ phát sáu sản phẩm RGB cho GOES (GeoColor, Band 2 Red
         Visible, Band 13 Clean IR, Air Mass, Dust, Fire Temperature) và ba
         cho Himawari. Gắn nhãn "Cloud Phase" lên Air Mass là dán tên một
         sản phẩm lên dữ liệu của sản phẩm khác — người đọc sẽ diễn giải màu
         theo bảng tra sai. Air Mass vẫn có mặt, dưới đúng tên của nó.
         ================================================================== */

      var GIBS = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best";

      var LAYERS = [
        {
          id: "goes-east-geocolor",
          subLon: -75,
          emoji: "🌍",
          name: "GeoColor",
          where: "GOES-East · châu Mỹ, Đại Tây Dương",
          group: "Ảnh mỗi 10 phút",
          layer: "GOES-East_ABI_GeoColor",
          tms: "GoogleMapsCompatible_Level7",
          ext: "png",
          maxNativeZoom: 7,
          cadence: "10min",
          centre: [0, -75],
          zoom: 3,
          note: "Ảnh tổng hợp: ban ngày là màu gần thật, ban đêm chuyển sang hồng ngoại với ánh đèn thành phố. Vệ tinh đứng yên trên kinh tuyến 75°T nên chỉ thấy nửa Trái Đất quanh châu Mỹ.",
        },
        {
          id: "goes-west-geocolor",
          subLon: -137,
          emoji: "🌏",
          name: "GeoColor",
          where: "GOES-West · Thái Bình Dương",
          group: "Ảnh mỗi 10 phút",
          layer: "GOES-West_ABI_GeoColor",
          tms: "GoogleMapsCompatible_Level7",
          ext: "png",
          maxNativeZoom: 7,
          cadence: "10min",
          centre: [0, -137],
          zoom: 3,
          note: "Cùng sản phẩm GeoColor nhưng từ vệ tinh đứng trên kinh tuyến 137°T, phủ Thái Bình Dương và bờ tây nước Mỹ.",
        },
        {
          id: "himawari-visible",
          subLon: 140,
          emoji: "🇻🇳",
          name: "Ảnh nhìn thấy",
          where: "Himawari · châu Á, Việt Nam",
          group: "Ảnh mỗi 10 phút",
          layer: "Himawari_AHI_Band3_Red_Visible_1km",
          tms: "GoogleMapsCompatible_Level7",
          ext: "png",
          maxNativeZoom: 7,
          cadence: "10min",
          centre: [0, 140],
          zoom: 3,
          note: "Kênh đỏ 0,64 µm của vệ tinh Himawari, đứng trên kinh tuyến 140°Đ — đây là vệ tinh phủ Việt Nam. Ảnh nhìn thấy nên nửa đêm của Trái Đất sẽ tối đen, đó là dữ liệu đúng chứ không phải lỗi.",
        },
        {
          id: "himawari-ir",
          subLon: 140,
          emoji: "🌙",
          name: "Hồng ngoại",
          where: "Himawari · châu Á, Việt Nam",
          group: "Ảnh mỗi 10 phút",
          layer: "Himawari_AHI_Band13_Clean_Infrared",
          tms: "GoogleMapsCompatible_Level6",
          ext: "png",
          maxNativeZoom: 6,
          cadence: "10min",
          centre: [0, 140],
          zoom: 3,
          note: "Kênh 10,4 µm đo nhiệt độ đỉnh mây, nên nó nhìn được cả ban đêm. Càng trắng càng lạnh, tức đỉnh mây càng cao — đó là cách nhận ra vùng đối lưu mạnh và mắt bão.",
        },
        {
          id: "goes-east-ir",
          subLon: -75,
          emoji: "🌙",
          name: "Hồng ngoại",
          where: "GOES-East · châu Mỹ",
          group: "Ảnh mỗi 10 phút",
          layer: "GOES-East_ABI_Band13_Clean_Infrared",
          tms: "GoogleMapsCompatible_Level6",
          ext: "png",
          maxNativeZoom: 6,
          cadence: "10min",
          centre: [0, -75],
          zoom: 3,
          note: "Kênh 10,4 µm đo nhiệt độ đỉnh mây. Nhìn được cả ban đêm vì nó đo bức xạ nhiệt chứ không đo ánh sáng phản xạ.",
        },
        {
          id: "himawari-airmass",
          subLon: 140,
          emoji: "🌀",
          name: "Khối khí",
          where: "Himawari · châu Á",
          group: "Ảnh mỗi 10 phút",
          layer: "Himawari_AHI_Air_Mass",
          tms: "GoogleMapsCompatible_Level6",
          ext: "png",
          maxNativeZoom: 6,
          cadence: "10min",
          centre: [0, 140],
          zoom: 3,
          note: "Ảnh tổ hợp RGB từ các kênh hơi nước và ozone, tách các khối khí khác nhau bằng màu. Đây KHÔNG phải Day Cloud Phase — GIBS không phát sản phẩm đó, và bảng màu của hai thứ khác nhau hoàn toàn.",
        },
        {
          id: "viirs-truecolor",
          // Vệ tinh quỹ đạo cực: ảnh ghép phủ toàn cầu, không đứng trên
          // một kinh tuyến cố định nào
          subLon: null,
          emoji: "☀️",
          name: "Màu thật",
          where: "VIIRS NOAA-20 · toàn cầu",
          group: "Ảnh ghép mỗi ngày",
          layer: "VIIRS_NOAA20_CorrectedReflectance_TrueColor",
          tms: "GoogleMapsCompatible_Level9",
          ext: "jpg",
          maxNativeZoom: 9,
          cadence: "daily",
          centre: [16, 106],
          zoom: 3,
          note: "Vệ tinh quỹ đạo cực quét từng dải khi bay qua, và cả ngày mới ghép đủ một vòng Trái Đất. Đổi lại nó phủ toàn cầu và nét hơn nhiều so với vệ tinh địa tĩnh — nhưng mỗi điểm chỉ có một ảnh mỗi ngày, không phải mười phút một lần.",
        },
        {
          id: "modis-truecolor",
          // Vệ tinh quỹ đạo cực: ảnh ghép phủ toàn cầu, không đứng trên
          // một kinh tuyến cố định nào
          subLon: null,
          emoji: "🛰️",
          name: "Màu thật",
          where: "MODIS Terra · toàn cầu",
          group: "Ảnh ghép mỗi ngày",
          layer: "MODIS_Terra_CorrectedReflectance_TrueColor",
          tms: "GoogleMapsCompatible_Level9",
          ext: "jpg",
          maxNativeZoom: 9,
          cadence: "daily",
          centre: [16, 106],
          zoom: 3,
          note: "Cùng loại sản phẩm với VIIRS nhưng từ vệ tinh Terra, hoạt động từ năm 1999. Giữ lại để so hai nguồn độc lập trong cùng một ngày.",
        },
      ];

      /* ==================================================================
         2. THỜI GIAN

         Đây là phần dễ hỏng nhất, và nó hỏng theo ba kiểu khác nhau:

         · Lấy giờ máy người dùng thay vì UTC. Ở Việt Nam, 7 giờ sáng ngày mai
           theo giờ địa phương vẫn là hôm nay theo UTC — hỏi GIBS ngày mai thì
           không có dữ liệu nào cả.
         · Lấy đúng phút hiện tại. GIBS cần thời gian xử lý; ảnh của phút này
           chưa tồn tại, và tile trả về sẽ trong suốt.
         · Làm tròn sai bước. Lớp mười phút chỉ nhận mốc chia hết cho 10 phút.

         Cách xử lý: lùi lại một khoảng an toàn, làm tròn xuống theo đúng bước
         của lớp, rồi THỬ một ô tile thật. Không được thì lùi thêm một bước và
         thử lại. Nhờ vậy trang không phụ thuộc vào giả định về độ trễ của
         NASA — nó đo độ trễ đó mỗi lần chạy.
         ================================================================== */

      /** Lùi bao nhiêu phút trước khi bắt đầu thử, với lớp 10 phút. */
      var LAG_MINUTES = 25;

      /** Số bước lùi tối đa khi dò. 12 bước × 10 phút = hai giờ. */
      var MAX_STEPS = 12;

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      /** Mốc 10 phút gần nhất tính tới thời điểm cho trước, theo UTC. */
      function floorTenMinutes(date) {
        var copy = new Date(date.getTime());
        copy.setUTCSeconds(0, 0);
        copy.setUTCMinutes(Math.floor(copy.getUTCMinutes() / 10) * 10);
        return copy;
      }

      /** "YYYY-MM-DDTHH:MM:SSZ" — dạng GIBS nhận cho lớp dưới ngày. */
      function isoInstant(date) {
        return (
          date.getUTCFullYear() +
          "-" + pad(date.getUTCMonth() + 1) +
          "-" + pad(date.getUTCDate()) +
          "T" + pad(date.getUTCHours()) +
          ":" + pad(date.getUTCMinutes()) +
          ":00Z"
        );
      }

      /** "YYYY-MM-DD" — dạng GIBS nhận cho lớp theo ngày. */
      function isoDate(date) {
        return (
          date.getUTCFullYear() +
          "-" + pad(date.getUTCMonth() + 1) +
          "-" + pad(date.getUTCDate())
        );
      }

      function tileUrl(spec, time, z, y, x) {
        return (
          GIBS + "/" + spec.layer + "/default/" + time + "/" + spec.tms +
          "/" + z + "/" + y + "/" + x + "." + spec.ext
        );
      }

      /**
       * Một ô tile có dữ liệu thật hay không.
       *
       * Dùng `Image` chứ không `fetch`: GIBS không đặt CORS cho mọi đường, mà
       * thẻ ảnh thì không cần CORS để biết tải được hay không. Ảnh lỗi gọi
       * `onerror`, và đó chính là tín hiệu cần.
       */
      function tileExists(url) {
        return new Promise(function (resolve) {
          var image = new Image();
          var settled = false;
          var done = function (ok) {
            if (settled) return;
            settled = true;
            resolve(ok);
          };
          image.onload = function () {
            done(image.naturalWidth > 0);
          };
          image.onerror = function () {
            done(false);
          };
          // Mạng chậm không được treo cả trang
          setTimeout(function () {
            done(false);
          }, 6000);
          image.src = url;
        });
      }

      /**
       * Tìm mốc thời gian mới nhất thật sự có dữ liệu cho một lớp.
       *
       * Ô dò lấy ở zoom 2, ngay trên tâm mặc định của lớp — phải là chỗ vệ
       * tinh đó nhìn thấy. Dò một ô giữa Thái Bình Dương cho GOES-East thì ô
       * nào cũng trống và vòng lặp sẽ chạy hết mà không tìm ra gì.
       */
      async function resolveTime(spec) {
        var step = spec.cadence === "daily" ? 24 * 60 : 10;
        var start =
          spec.cadence === "daily"
            ? new Date()
            : floorTenMinutes(new Date(Date.now() - LAG_MINUTES * 60000));

        var probe = probeTileCoords(spec);

        for (var i = 0; i < MAX_STEPS; i += 1) {
          var candidate = new Date(start.getTime() - i * step * 60000);
          var time =
            spec.cadence === "daily"
              ? isoDate(candidate)
              : isoInstant(floorTenMinutes(candidate));

          var ok = await tileExists(
            tileUrl(spec, time, probe.z, probe.y, probe.x),
          );
          if (ok) return { time: time, at: candidate, probed: true };
        }

        /*
         * Không dò ra thì dùng từ khoá `default` của GIBS, nó tự trả bản mới
         * nhất. Đánh đổi: ta không biết đó là lúc nào, nên bảng thông tin phải
         * nói "không xác định" chứ không được đoán một con số.
         */
        return { time: "default", at: null, probed: false };
      }

      /** Ô tile dùng để dò, tính từ tâm mặc định của lớp ở zoom 2. */
      function probeTileCoords(spec) {
        var z = 2;
        var n = Math.pow(2, z);
        var lat = spec.centre[0];
        var lng = spec.centre[1];
        var x = Math.floor(((lng + 180) / 360) * n);
        var latRad = (lat * Math.PI) / 180;
        var y = Math.floor(
          ((1 -
            Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) /
            2) *
            n,
        );
        return {
          z: z,
          x: Math.min(Math.max(x, 0), n - 1),
          y: Math.min(Math.max(y, 0), n - 1),
        };
      }

      /* ==================================================================
         3. BẢN ĐỒ
         ================================================================== */

      /*
       * `worldCopyJump` và `noWrap` tắt hẳn việc lặp thế giới theo chiều ngang.
       *
       * Mặc định Leaflet vẽ lại bản đồ vô hạn sang trái và phải, và với bản đồ
       * đường phố thì đó là tiện lợi. Với ảnh vệ tinh địa tĩnh thì nó thành ra
       * bốn năm quả Trái Đất cạnh nhau: mỗi bản sao là cùng một đĩa, và người
       * xem không có cách nào biết đâu là bản thật.
       *
       * `minZoom: 2` để không lùi ra được tới mức nhìn thấy nhiều bản sao ngay
       * cả khi Leaflet đổi hành vi, và `maxBounds` giữ khung trong đúng một
       * thế giới.
       */
      var map = L.map("map", {
        center: [0, 60],
        zoom: 2,
        /*
         * "minZoom: 1" chứ không 2, và zoomSnap lẻ.
         *
         * Yêu cầu là mở trang ra thấy CẢ Trái Đất. Ở mức 2 thế giới rộng
         * 1024px và cao 1024px — lọt bề ngang một màn hình laptop nhưng
         * KHÔNG lọt bề cao (cửa sổ thường chỉ cao 600–800px), nên vẫn phải
         * cuộn. Mức 1 là 512px, lọt cả hai chiều trên mọi màn hình.
         *
         * "zoomSnap: 0.25" để fitBounds chọn được mức lẻ (1,75 chẳng hạn)
         * thay vì làm tròn xuống số nguyên. Không có nó thì khung nhìn toàn
         * cầu luôn thừa một viền đen rộng vì phải lùi hẳn một mức.
         *
         * Lùi xa hơn KHÔNG sinh ra nhiều bản sao Trái Đất: thứ chặn việc đó
         * là "noWrap" trên từng lớp ảnh, không phải minZoom.
         */
        minZoom: 1,
        zoomSnap: 0.25,
        maxZoom: 9,
        worldCopyJump: false,
        maxBounds: [
          [-85, -180],
          [85, 180],
        ],
        maxBoundsViscosity: 0.9,
        zoomControl: true,
        attributionControl: true,
      });

      L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);

      /*
       * Lùi khung nhìn về đúng một quả Trái Đất, vừa khít khung cửa sổ.
       *
       * Không dùng map.fitWorld(): nó fit theo [[-90,-180],[90,180]], mà
       * Mercator kéo hai cực ra vô hạn nên Leaflet phải kẹp về ±85 và kết
       * quả là một mức thu phóng nhỏ hơn cần thiết — thừa ra viền đen trên
       * dưới. Kẹp sẵn ở ±80 thì khít hơn, và ±80 vẫn chứa trọn mọi thứ ảnh
       * vệ tinh địa tĩnh nhìn được: đĩa của chúng chỉ tới khoảng ±81 và đã
       * mờ hẳn từ 70 trở ra.
       */
      function showWholeEarth() {
        map.fitBounds(
          [
            [-80, -180],
            [80, 180],
          ],
          { animate: false, padding: [8, 8] },
        );
      }


      /* -------------------------------------------------- Nút toàn màn hình */
      var FullscreenControl = L.Control.extend({
        options: { position: "topleft" },
        onAdd: function () {
          var container = L.DomUtil.create(
            "div",
            "leaflet-bar leaflet-control",
          );
          var link = L.DomUtil.create("a", "", container);
          link.href = "#";
          link.title = "Toàn màn hình";
          link.setAttribute("role", "button");
          link.setAttribute("aria-label", "Toàn màn hình");
          link.innerHTML = "⤢";
          link.style.fontSize = "17px";
          link.style.lineHeight = "26px";

          L.DomEvent.on(link, "click", function (event) {
            L.DomEvent.stop(event);
            if (document.fullscreenElement) {
              document.exitFullscreen();
            } else {
              document.documentElement.requestFullscreen().catch(function () {
                // Trình duyệt từ chối (thường do thiếu cử chỉ người dùng hợp
                // lệ). Không có gì để sửa, và không đáng làm hỏng gì khác.
              });
            }
          });

          return container;
        },
      });
      map.addControl(new FullscreenControl());

      /* ==================================================================
         4. LỚP ẢNH ĐANG HIỂN THỊ
         ================================================================== */

      var current = null; // { spec, layer, time, at, fetchedAt }
      var tileErrors = 0;

      var elements = {
        buttons: document.getElementById("layer-buttons"),
        source: document.getElementById("info-source"),
        layer: document.getElementById("info-layer"),
        time: document.getElementById("info-time"),
        age: document.getElementById("info-age"),
        note: document.getElementById("info-note"),
        cursor: document.getElementById("cursor"),
        utc: document.getElementById("utc"),
        banner: document.getElementById("banner"),
      };

      function showBanner(message) {
        elements.banner.textContent = message;
        elements.banner.setAttribute("data-open", "true");
      }

      function hideBanner() {
        elements.banner.setAttribute("data-open", "false");
      }

      function formatDataTime(result) {
        if (!result.probed) return "không xác định";
        if (result.time.length === 10) return result.time;
        return result.time.replace("T", " ").replace(":00Z", " UTC");
      }

      async function selectLayer(spec, options) {
        var keepView = options && options.keepView;

        elements.time.textContent = "đang dò…";
        hideBanner();

        var result = await resolveTime(spec);

        // Leaflet tự thay {z}/{y}/{x}; ở đây chỉ nối chuỗi nên chúng đi
        // nguyên vẹn vào mẫu URL.
        var url = tileUrl(spec, result.time, "{z}", "{y}", "{x}");

        var layer = L.tileLayer(url, {
          tileSize: 256,
          minZoom: 1,
          maxZoom: 9,
          maxNativeZoom: spec.maxNativeZoom,
          // Xem chú thích ở chỗ khởi tạo map: một thế giới, không bản sao
          noWrap: true,
          bounds: [
            [-85.05, -180],
            [85.05, 180],
          ],
          attribution:
            'Ảnh: <a href="https://worldview.earthdata.nasa.gov/" target="_blank" rel="noreferrer">NASA GIBS</a> · ' +
            spec.where,
        });

        tileErrors = 0;
        layer.on("tileerror", function () {
          tileErrors += 1;
          /*
           * Ngưỡng cao, và đếm lại từ đầu mỗi lần đổi khung nhìn.
           *
           * Vệ tinh địa tĩnh chỉ nhìn thấy một nửa Trái Đất, nên MỌI ô ở nửa
           * kia đều không tồn tại. Lùi ra hết cỡ là hàng trăm ô lỗi cùng lúc
           * — hoàn toàn bình thường, nhưng ngưỡng 40 cũ biến nó thành một
           * cảnh báo sai xuất hiện ngay khi mở trang.
           *
           * Ngưỡng 400 chỉ đạt tới khi cả lớp thật sự không tải được, và
           * `moveend` đặt lại bộ đếm để lỗi của một khung nhìn cũ không cộng
           * dồn sang khung nhìn mới.
           */
          if (tileErrors === 400) {
            showBanner(
              "Nhiều ô ảnh không tải được. Có thể máy chủ NASA đang bận — thử lớp khác hoặc đợi lượt làm mới sau.",
            );
          }
        });

        if (current && current.layer) map.removeLayer(current.layer);
        layer.addTo(map);

        current = {
          spec: spec,
          layer: layer,
          time: result.time,
          at: result.at,
          fetchedAt: Date.now(),
        };

        if (!keepView) {
          /*
           * Đổi lớp thì lùi về CẢ Trái Đất, không nhảy tới khung nhìn riêng
           * của lớp.
           *
           * Bản cũ đặt mỗi lớp một centre/zoom riêng ở mức 3. Ở mức đó thế
           * giới rộng 2048px, tức rộng hơn hẳn cửa sổ — nên mở trang ra chỉ
           * thấy một DẢI DỌC, và đúng lúc Himawari đang chụp ban đêm thì dải
           * đó gần như đen trơn. Người xem không có cách nào biết mình đang
           * nhìn chỗ nào của Trái Đất.
           *
           * Lùi hết ra trước rồi để người dùng tự chọn khu vực mới là thứ tự
           * đúng: thấy toàn cảnh trước, rồi mới đi vào chi tiết.
           */
          showWholeEarth();
        }

        elements.layer.textContent = spec.name + " — " + spec.where;
        elements.time.textContent = formatDataTime(result);
        elements.note.textContent = spec.note;
        updateAge();
        renderButtons();
      }

      function renderButtons() {
        elements.buttons.innerHTML = "";
        var lastGroup = null;

        LAYERS.forEach(function (spec) {
          if (spec.group !== lastGroup) {
            lastGroup = spec.group;
            var heading = document.createElement("div");
            heading.className = "group";
            heading.textContent = spec.group;
            elements.buttons.appendChild(heading);
          }

          var button = document.createElement("button");
          button.type = "button";
          button.className = "layer-btn";
          button.setAttribute(
            "aria-pressed",
            current && current.spec.id === spec.id ? "true" : "false",
          );
          button.innerHTML =
            '<span class="emoji" aria-hidden="true">' + spec.emoji + "</span>" +
            '<span class="meta">' +
            '<span class="name">' + spec.name + "</span>" +
            '<span class="where">' + spec.where + "</span>" +
            "</span>";
          button.addEventListener("click", function () {
            selectLayer(spec);
          });
          elements.buttons.appendChild(button);
        });
      }

      /* ==================================================================
         5. LÀM MỚI

         Chỉ dò lại thời gian rồi đổi URL của lớp đang hiển thị. Không dựng
         lại bản đồ, không đụng tới vị trí và mức phóng — người đang xem một
         cơn bão ở Biển Đông thì sau mười phút vẫn phải đang xem đúng chỗ đó.
         ================================================================== */

      var REFRESH_MS = 10 * 60 * 1000;

      setInterval(async function () {
        if (!current) return;
        if (document.hidden) return; // tab ẩn thì không tốn băng thông

        var spec = current.spec;
        var result = await resolveTime(spec);
        if (!current || current.spec.id !== spec.id) return; // người dùng đã đổi lớp
        if (result.time === current.time) {
          current.fetchedAt = Date.now();
          updateAge();
          return;
        }

        current.layer.setUrl(
          tileUrl(spec, result.time, "{z}", "{y}", "{x}"),
          false,
        );
        current.time = result.time;
        current.at = result.at;
        current.fetchedAt = Date.now();
        elements.time.textContent = formatDataTime(result);
        updateAge();
      }, REFRESH_MS);

      function updateAge() {
        if (!current) return;
        var minutes = Math.round((Date.now() - current.fetchedAt) / 60000);
        elements.age.textContent =
          minutes < 1 ? "vừa xong" : minutes + " phút trước";
      }

      setInterval(updateAge, 30000);

      /* ==================================================================
         6. ĐỒNG HỒ UTC VÀ TOẠ ĐỘ CON TRỎ
         ================================================================== */

      function tickClock() {
        var now = new Date();
        elements.utc.textContent =
          pad(now.getUTCHours()) + ":" +
          pad(now.getUTCMinutes()) + ":" +
          pad(now.getUTCSeconds());
      }
      tickClock();
      setInterval(tickClock, 1000);

      map.on("moveend", function () {
        tileErrors = 0;
        hideBanner();
      });

      map.on("mousemove", function (event) {
        var lat = event.latlng.lat;
        var lng = ((event.latlng.lng + 540) % 360) - 180; // gộp các bản sao thế giới
        elements.cursor.textContent =
          lat.toFixed(2) + "° " + (lat >= 0 ? "B" : "N") + "   " +
          Math.abs(lng).toFixed(2) + "° " + (lng >= 0 ? "Đ" : "T");
      });

      /* ==================================================================
         7. ĐƯỜNG PHÂN GIỚI NGÀY ĐÊM

         Vẽ từ vị trí Mặt Trời chứ không tải thêm thư viện nào.

         Các bước: tính độ xích vĩ của Mặt Trời và kinh độ điểm Mặt Trời ở
         thiên đỉnh, rồi với mỗi kinh độ suy ra vĩ độ nơi Mặt Trời vừa chạm
         chân trời — đó là đường phân giới. Nửa tối là nửa nằm về phía cực
         đang mùa đông.

         Độ chính xác cỡ một phần tư độ, đủ cho một lớp phủ minh hoạ. Muốn
         đúng tới giây cung thì phải tính cả phương trình thời gian đầy đủ và
         nhiễu loạn — không đáng cho việc này.
         ================================================================== */

      function solarPosition(date) {
        var rad = Math.PI / 180;
        // Số ngày Julian tính từ J2000.0
        var days = date.getTime() / 86400000 - 10957.5;

        var meanLongitude = (280.46 + 0.9856474 * days) % 360;
        var meanAnomaly = ((357.528 + 0.9856003 * days) % 360) * rad;
        var eclipticLongitude =
          (meanLongitude +
            1.915 * Math.sin(meanAnomaly) +
            0.02 * Math.sin(2 * meanAnomaly)) *
          rad;

        var obliquity = (23.439 - 0.0000004 * days) * rad;
        var declination = Math.asin(
          Math.sin(obliquity) * Math.sin(eclipticLongitude),
        );

        // Giờ Mặt Trời trung bình Greenwich, đổi ra kinh độ điểm thiên đỉnh
        var utcHours =
          date.getUTCHours() +
          date.getUTCMinutes() / 60 +
          date.getUTCSeconds() / 3600;
        var rightAscension = Math.atan2(
          Math.cos(obliquity) * Math.sin(eclipticLongitude),
          Math.cos(eclipticLongitude),
        );
        var gmst = (18.697374558 + 24.06570982441908 * days) % 24;
        var subsolarLongitude =
          (((rightAscension / rad) - gmst * 15 + 540) % 360) - 180;

        return {
          declination: declination,
          longitude: subsolarLongitude,
          utcHours: utcHours,
        };
      }

      var terminator = null;

      function drawTerminator() {
        var sun = solarPosition(new Date());
        var rad = Math.PI / 180;
        var points = [];

        for (var lng = -180; lng <= 180; lng += 1) {
          var hourAngle = (lng - sun.longitude) * rad;
          // Vĩ độ nơi Mặt Trời ở đúng chân trời với góc giờ này
          var lat =
            Math.atan(-Math.cos(hourAngle) / Math.tan(sun.declination)) / rad;
          points.push([lat, lng]);
        }

        /*
         * Khép đa giác về phía cực đang trong mùa đông — đó là cực đang không
         * được chiếu sáng. Khép nhầm phía thì cả lớp phủ đảo ngược và vùng
         * đang giữa trưa bị tô là đêm.
         */
        var polarLat = sun.declination > 0 ? -90 : 90;
        points.push([polarLat, 180]);
        points.push([polarLat, -180]);

        if (terminator) map.removeLayer(terminator);
        terminator = L.polygon(points, {
          stroke: false,
          fillColor: "#020617",
          fillOpacity: 0.42,
          interactive: false,
        }).addTo(map);
      }

      drawTerminator();
      setInterval(drawTerminator, 5 * 60 * 1000);

      /* ==================================================================
         8. KHỞI ĐỘNG
         ================================================================== */

      renderButtons();

      /*
       * Lớp mở đầu chọn theo GIỜ, không cố định.
       *
       * Vệ tinh phủ Việt Nam là Himawari, nên lớp mở đầu phải là của nó —
       * GOES-East và GOES-West đều không nhìn thấy Đông Nam Á. Nhưng kênh ánh
       * sáng nhìn thấy chỉ có hình khi vùng đó đang là ban ngày: mở trang lúc
       * 12h UTC là 19h giờ Việt Nam, và người xem gặp một đĩa đen tuyền rồi
       * kết luận trang hỏng.
       *
       * Châu Á được Mặt Trời chiếu sáng trong khoảng 22h–10h UTC. Ngoài
       * khoảng đó thì mở bằng hồng ngoại, kênh đo nhiệt độ đỉnh mây nên nhìn
       * được cả ban đêm. Người muốn xem ảnh nhìn thấy vẫn bấm được, và lúc đó
       * chú thích của lớp đã nói trước vì sao nó tối.
       */

      /* ==================================================================
         6. TÌM THEO KHU VỰC

         ## Vì sao là danh sách dựng sẵn chứ không phải geocoder

         Một ô tìm kiếm gõ tự do cần dịch vụ geocoding (Nominatim và tương
         tự). Ba lý do không dùng ở đây: nó thêm một phụ thuộc mạng nữa vào
         một trang vốn đã phụ thuộc GIBS; chính sách dùng của Nominatim giới
         hạn tần suất và đòi User-Agent riêng; và kết quả của nó là ĐỊA CHỈ,
         trong khi thứ cần ở đây là KHU VỰC ở đúng cỡ mà một vệ tinh thấy
         được. Gõ "Hà Nội" vào geocoder trả về một toạ độ nhà; ở ảnh vệ tinh
         độ phân giải 1–2 km thì mức đó vô nghĩa.

         Danh sách dựng sẵn chạy tức thì, chạy được khi mất mạng, và mỗi mục
         đã kèm sẵn mức thu phóng hợp với cỡ của chính khu vực đó.

         ## Vì sao mỗi khu vực phải biết vệ tinh nào nhìn thấy nó

         Đây là phần dễ bỏ sót nhất. Vệ tinh địa tĩnh chỉ thấy nửa Trái Đất
         quanh kinh tuyến nó đứng. Bay tới châu Âu trong khi đang xem lớp
         Himawari thì được một khung đen tuyền — và người dùng sẽ kết luận
         trang hỏng, đúng như lần "không thấy trái đất đâu" trước đây.

         Nên khi khu vực đích nằm ngoài tầm nhìn của lớp đang bật, trang tự
         đổi sang lớp nhìn thấy nó và NÓI RÕ là đã đổi. Tự đổi mà im lặng
         cũng tệ ngang: người dùng vừa chọn một lớp, thấy nó đổi, không hiểu
         vì sao.
         ================================================================== */

      /*
       * Nửa góc nhìn của một vệ tinh địa tĩnh, tính theo kinh độ.
       *
       * Hình học thì đĩa nhìn thấy rộng tới ±81°, nhưng ở rìa đĩa góc nhìn
       * quá xiên: một điểm ở 80° lệch khỏi kinh tuyến vệ tinh bị trải ra
       * thành vệt mờ dài và thực tế không đọc được gì. 70° là mức còn cho ảnh
       * dùng được, và cũng là mức các cơ quan khí tượng dùng khi vẽ vùng phủ
       * "hữu ích" thay vì vùng phủ hình học.
       */
      var USEFUL_HALF_SPAN = 70;

      /** Chênh lệch kinh độ ngắn nhất giữa hai kinh tuyến, luôn trong [0,180]. */
      function lonDelta(a, b) {
        var d = Math.abs(a - b) % 360;
        return d > 180 ? 360 - d : d;
      }

      /** Lớp này có nhìn thấy điểm đó không? Lớp toàn cầu thì luôn có. */
      function covers(spec, lon) {
        if (spec.subLon === null || spec.subLon === undefined) return true;
        return lonDelta(spec.subLon, lon) <= USEFUL_HALF_SPAN;
      }

      /*
       * Lớp hợp nhất để xem một khu vực.
       *
       * Ưu tiên giữ NGUYÊN lớp đang bật nếu nó thấy được khu vực đó — người
       * dùng chọn lớp là có ý, đừng đổi khi không cần.
       *
       * Không thì ưu tiên một lớp địa tĩnh, vì ảnh mười phút một lần mới là
       * điểm khác biệt của trang này. Chỉ khi không vệ tinh địa tĩnh nào phủ
       * — châu Âu, châu Phi, Trung Đông và Ấn Độ Dương đều rơi vào khoảng
       * trống giữa GOES và Himawari, do bộ lớp GIBS dùng ở đây không có
       * Meteosat — mới lùi về ảnh ghép mỗi ngày.
       */
      function bestLayerFor(lon) {
        if (current && current.spec && covers(current.spec, lon)) {
          return current.spec;
        }

        var geo = LAYERS.filter(function (spec) {
          return spec.subLon !== null && spec.subLon !== undefined;
        }).filter(function (spec) {
          return covers(spec, lon);
        });

        if (geo.length > 0) {
          // Gần tâm đĩa nhất thì ảnh ít méo nhất
          geo.sort(function (a, b) {
            return lonDelta(a.subLon, lon) - lonDelta(b.subLon, lon);
          });
          return geo[0];
        }

        return LAYERS.find(function (spec) {
          return spec.subLon === null || spec.subLon === undefined;
        });
      }

      /*
       * Danh mục khu vực.
       *
       * `zoom` chọn theo cỡ thật của khu vực, không theo một con số chung:
       * một thành phố ở mức 7 (ảnh địa tĩnh hết độ phân giải quanh đó), một
       * quốc gia ở 4–5, một châu lục ở 3.
       *
       * Thứ tự là thứ tự gợi ý khi ô còn trống, nên Việt Nam và vùng quanh nó
       * đứng đầu — đây là trang tiếng Việt.
       */
      var REGIONS = [
        { name: "Toàn cầu", lat: 0, lon: 0, zoom: null },
        { name: "Việt Nam", lat: 16.0, lon: 107.5, zoom: 5 },
        { name: "Hà Nội", lat: 21.03, lon: 105.85, zoom: 7 },
        { name: "TP Hồ Chí Minh", lat: 10.82, lon: 106.63, zoom: 7 },
        { name: "Đà Nẵng", lat: 16.05, lon: 108.2, zoom: 7 },
        { name: "Biển Đông", lat: 15, lon: 114, zoom: 4 },
        { name: "Đông Nam Á", lat: 5, lon: 110, zoom: 4 },
        { name: "Thái Lan", lat: 15, lon: 101, zoom: 5 },
        { name: "Philippines", lat: 13, lon: 122, zoom: 5 },
        { name: "Indonesia", lat: -2, lon: 118, zoom: 4 },
        { name: "Trung Quốc", lat: 35, lon: 105, zoom: 4 },
        { name: "Nhật Bản", lat: 36, lon: 138, zoom: 5 },
        { name: "Hàn Quốc", lat: 36, lon: 128, zoom: 6 },
        { name: "Đông Á", lat: 32, lon: 120, zoom: 4 },
        { name: "Ấn Độ", lat: 21, lon: 79, zoom: 4 },
        { name: "Úc", lat: -25, lon: 134, zoom: 4 },
        { name: "New Zealand", lat: -41, lon: 174, zoom: 5 },
        { name: "Thái Bình Dương", lat: 0, lon: -160, zoom: 3 },
        { name: "Hawaii", lat: 20.5, lon: -157, zoom: 6 },
        { name: "Alaska", lat: 64, lon: -152, zoom: 4 },
        { name: "Bắc Mỹ", lat: 45, lon: -100, zoom: 3 },
        { name: "Hoa Kỳ", lat: 39, lon: -98, zoom: 4 },
        { name: "Canada", lat: 58, lon: -100, zoom: 3 },
        { name: "Mexico", lat: 23, lon: -102, zoom: 5 },
        { name: "Trung Mỹ", lat: 13, lon: -85, zoom: 5 },
        { name: "Caribbean", lat: 18, lon: -70, zoom: 5 },
        { name: "Nam Mỹ", lat: -15, lon: -60, zoom: 3 },
        { name: "Brazil", lat: -10, lon: -52, zoom: 4 },
        { name: "Argentina", lat: -35, lon: -65, zoom: 4 },
        { name: "Đại Tây Dương", lat: 10, lon: -40, zoom: 3 },
        { name: "Châu Âu", lat: 50, lon: 15, zoom: 4 },
        { name: "Châu Phi", lat: 2, lon: 20, zoom: 3 },
        { name: "Trung Đông", lat: 28, lon: 45, zoom: 4 },
        { name: "Bắc Cực", lat: 78, lon: 0, zoom: 3 },
        { name: "Nam Cực", lat: -72, lon: 0, zoom: 3 },
      ];

      /*
       * Bỏ dấu tiếng Việt để "viet nam", "Việt Nam" và "VIET NAM" cùng khớp.
       *
       * NFD tách chữ cái khỏi dấu thanh và dấu mũ, rồi lớp ký tự dưới đây xoá
       * phần dấu. Riêng đ/Đ không phải tổ hợp dấu nên NFD không đụng tới —
       * phải thay tay, và bỏ sót nó thì gõ "da nang" sẽ không ra "Đà Nẵng".
       */
      function fold(text) {
        return text
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "")
          .replace(/đ/g, "d")
          .replace(/Đ/g, "D")
          .toLowerCase()
          .trim();
      }

      var searchElements = {
        panel: document.getElementById("search"),
        input: document.getElementById("region-input"),
        list: document.getElementById("region-list"),
        empty: document.getElementById("region-empty"),
      };

      var activeIndex = -1;
      var matches = [];

      function closeList() {
        searchElements.panel.setAttribute("data-open", "false");
        searchElements.input.setAttribute("aria-expanded", "false");
        activeIndex = -1;
      }

      function openList() {
        searchElements.panel.setAttribute("data-open", "true");
        searchElements.input.setAttribute("aria-expanded", "true");
      }

      function renderMatches() {
        var query = fold(searchElements.input.value);
        matches = query
          ? REGIONS.filter(function (region) {
              return fold(region.name).indexOf(query) !== -1;
            })
          : REGIONS.slice();

        searchElements.list.innerHTML = "";
        searchElements.empty.hidden = matches.length > 0;

        matches.forEach(function (region, index) {
          var item = document.createElement("li");
          item.setAttribute("role", "option");
          item.setAttribute(
            "aria-selected",
            index === activeIndex ? "true" : "false",
          );

          var button = document.createElement("button");
          button.type = "button";
          button.textContent = region.name;
          if (index === activeIndex) button.setAttribute("data-active", "true");

          /* Nhãn phụ nói TRƯỚC sẽ xem bằng vệ tinh nào. Biết trước thì việc
             lớp tự đổi sau khi bấm không còn là chuyện bất ngờ. */
          var hint = document.createElement("span");
          var target = bestLayerFor(region.lon);
          hint.textContent =
            region.zoom === null ? "cả Trái Đất" : target.where.split(" · ")[0];
          button.appendChild(hint);

          button.addEventListener("click", function () {
            goToRegion(region);
          });

          item.appendChild(button);
          searchElements.list.appendChild(item);
        });
      }

      async function goToRegion(region) {
        searchElements.input.value = region.name;
        closeList();
        searchElements.input.blur();

        // "Toàn cầu" không có kinh độ đích nào để chọn vệ tinh theo — nó chỉ
        // lùi khung nhìn về cả Trái Đất và giữ nguyên lớp đang bật.
        if (region.zoom === null) {
          showWholeEarth();
          return;
        }

        var target = bestLayerFor(region.lon);
        var switching = !current || current.spec.id !== target.id;

        map.flyTo([region.lat, region.lon], region.zoom, { duration: 0.9 });

        if (switching) {
          await selectLayer(target, { keepView: true });
          showBanner(
            "Đã đổi sang " +
              target.name +
              " — " +
              target.where +
              ", vì vệ tinh trước đó không nhìn thấy " +
              region.name +
              ".",
          );
          setTimeout(hideBanner, 7000);
        }
      }

      searchElements.input.addEventListener("focus", function () {
        renderMatches();
        openList();
      });

      searchElements.input.addEventListener("input", function () {
        activeIndex = -1;
        renderMatches();
        openList();
      });

      searchElements.input.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeList();
          return;
        }
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          if (matches.length === 0) return;
          var step = event.key === "ArrowDown" ? 1 : -1;
          activeIndex = (activeIndex + step + matches.length) % matches.length;
          renderMatches();
          var active = searchElements.list.querySelector("[data-active]");
          if (active) active.scrollIntoView({ block: "nearest" });
          return;
        }
        if (event.key === "Enter") {
          event.preventDefault();
          // Chưa chọn bằng phím thì lấy kết quả đầu tiên — gõ "nhat" rồi Enter
          // phải ra Nhật Bản, không phải không ra gì.
          var pick = matches[activeIndex >= 0 ? activeIndex : 0];
          if (pick) goToRegion(pick);
        }
      });

      /* Đóng khi bấm ra ngoài. Dùng `pointerdown` chứ không `click`: `blur`
         của ô nhập chạy trước `click` của nút trong danh sách, nên nếu đóng
         theo `blur` thì chính cú bấm chọn bị nuốt mất. */
      document.addEventListener("pointerdown", function (event) {
        if (!searchElements.panel.contains(event.target)) closeList();
      });

      /* Leaflet bắt sự kiện chuột trên mọi thứ nằm trên bản đồ; không chặn
         thì kéo chọn chữ trong ô nhập sẽ kéo theo cả bản đồ. */
      L.DomEvent.disableClickPropagation(searchElements.panel);
      L.DomEvent.disableScrollPropagation(searchElements.panel);

      var utcHour = new Date().getUTCHours();
      var asiaInDaylight = utcHour >= 22 || utcHour < 10;
      var startId = asiaInDaylight ? "himawari-visible" : "himawari-ir";

      selectLayer(LAYERS.find(function (spec) {
        return spec.id === startId;
      }));
    </script>
  </body>
</html>
