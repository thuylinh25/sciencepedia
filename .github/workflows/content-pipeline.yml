name: Content pipeline

# Chạy pipeline nội dung 11 bước, liên tục tới khi hết hạn mức tài khoản.
#
# Vì sao ở GitHub Actions chứ không phải Vercel cron:
#   - Hàm Vercel cắt ở 60 giây (gói Hobby). Một bài qua 11 bước mất hàng chục
#     phút, nên đường đó không khả thi bất kể cấu hình thế nào.
#   - `CLAUDE_CODE_OAUTH_TOKEN` xác thực bằng gói đăng ký Claude và chỉ được
#     Claude Code / Agent SDK đọc. `@anthropic-ai/sdk` KHÔNG đọc nó, nên đường
#     cũ qua `src/lib/rewrite.ts` trên Vercel vẫn cần API key riêng.
#
# Lịch đã BẬT (2026-09-05). Nhịp độ và lý do nằm ở khối `schedule` bên dưới.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Số chủ đề (0 = chạy liên tục tới khi hết hạn mức)"
        required: false
        default: "0"
      budget:
        description: "Trần chi phí USD (0 = không đặt trần, chạy tới hết hạn mức)"
        required: false
        default: "0"
      model:
        description: "Model của luồng chính (science-editor luôn là opus)"
        required: false
        default: "sonnet"
      dry_run:
        description: "Chạy thử, không ghi CSDL"
        type: boolean
        required: false
        default: false

  # Chạy mỗi 2 giờ. Không phải để làm 12 lượt một ngày — mà để bắt được lúc
  # hạn mức vừa hồi. Lượt nào gặp quota còn cạn thì chết trong vài giây ở mã
  # 75 và báo xanh; lượt nào có quota thì nhặt bài DRAFT lên làm tiếp. Repo
  # public nên phút Actions miễn phí, một lượt chạy không thì gần như không tốn gì.
  #
  # ĐÁNH ĐỔI phải biết: lượt chạy nay không nhường quota nữa, nên ban ngày nó
  # sẽ giành hạn mức với chính phiên Claude Code tương tác của bạn. Thấy vướng
  # thì thu hẹp về ban đêm giờ Việt Nam bằng cách đổi dòng dưới thành:
  #   - cron: "0 16-23 * * *"     # 23:00–06:00 giờ Việt Nam
  schedule:
    - cron: "0 */2 * * *"

# Hai lượt chạy chồng nhau sẽ cùng lấy một chủ đề ở đầu hàng đợi và sinh hai
# bài trùng. Hàng đợi nằm trong file, không có khoá — nên khoá ở đây.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Trước đây 90 phút là đủ vì mỗi lượt chỉ làm 1 bài. Giờ lượt chạy kéo dài
    # tới khi hết hạn mức tài khoản, nên timeout không còn là hàng rào theo bài
    # nữa — nó là hàng rào chống lặp DUY NHẤT sau khi bỏ trần chi phí. Đặt sát
    # trần 6 giờ của Actions: đủ cho một ngày quota, vẫn chặn được vòng lặp kẹt.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # Secret dán tay dễ dính khoảng trắng hoặc một lần xuống dòng ở hai đầu,
      # và GitHub không cắt hộ. Lúc đó lỗi trả về là 401 y hệt token sai, nên
      # không phân biệt được bằng cách nhìn log. Cắt sạch, rồi nói ra token có
      # bị thừa ký tự hay không — không bao giờ in token.
      #
      # Đặt trước `npm ci` để hỏng thì hỏng trong vài giây, không phải sau khi
      # cài xong cả cây phụ thuộc.
      - name: Kiểm token trước khi chạy
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          # Bản đã cắt là chuỗi KHÁC với secret đã đăng ký, nên bộ che của
          # GitHub không tự nhận ra nó. Đăng ký thêm trước khi đưa đi đâu.
          echo "::add-mask::$TOKEN"

          if [ -z "$TOKEN" ]; then
            echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN rỗng hoặc chưa đặt."
            exit 1
          fi

          if [ "${#RAW}" -ne "${#TOKEN}" ]; then
            echo "::warning::Token dính $(( ${#RAW} - ${#TOKEN} )) ký tự trắng thừa — đã cắt. Nên dán lại secret cho sạch."
          else
            echo "Token không có khoảng trắng thừa."
          fi
          echo "Độ dài sau khi cắt: ${#TOKEN}"

          case "$TOKEN" in
            sk-ant-oat*)
              echo "Đúng dạng token OAuth của gói đăng ký." ;;
            sk-ant-api*)
              echo "::error::Đây là API key, không phải token OAuth. Dự án đã chốt dùng gói đăng ký — sinh token bằng \`claude setup-token\`."
              exit 1 ;;
            *)
              echo "::error::Tiền tố không phải sk-ant-oat — token bị dán nhầm hoặc bị cắt cụt."
              exit 1 ;;
          esac

          echo "CLAUDE_CODE_OAUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sciencepedia/package-lock.json

      # Lock file do npm 12 ở máy phát triển viết ra. setup-node cho Node 22
      # kèm npm 10, mà npm 10 đòi `overrides` phải nằm trong entry gốc của
      # lock — npm 12 không ghi ở đó nữa, nên `npm ci` kết luận lệch và dừng.
      # Ghim cùng một npm cho hai bên; nếu không, mỗi lần `npm install` ở máy
      # lại làm hỏng CI mà lock thì chẳng có gì sai.
      - name: Dùng npm cùng phiên bản với máy phát triển
        run: npm i -g npm@12

      - name: Cài đặt
        working-directory: sciencepedia
        run: npm ci

      - name: Chạy pipeline
        working-directory: sciencepedia
        env:
          # CLAUDE_CODE_OAUTH_TOKEN KHÔNG khai ở đây: bước "Kiểm token" đã đưa
          # bản đã cắt trắng vào GITHUB_ENV. Khai lại ở đây sẽ đè bản sạch đó
          # bằng bản thô, và lỗi khoảng trắng quay về y như cũ.

          # Pooler cổng 6543. CỐ Ý KHÔNG đặt DIRECT_URL: thiếu nó thì
          # `prisma migrate` không chạy được kể cả khi hook trong pipeline.ts
          # bị đi vòng. Một lớp phòng vệ nữa, không phải quên.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

          # `publish.ts` tự gọi reindex sau khi đổi state — nhưng chỉ khi có
          # host. Thiếu hai biến này thì nó nuốt lỗi và đi tiếp: bài lên site
          # mà tìm không ra, hỏng im lặng đúng kiểu khó phát hiện nhất.
          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
        run: |
          set +e
          npm run pipeline -- \
            --count "${{ inputs.count || 0 }}" \
            --budget "${{ inputs.budget || 0 }}" \
            --model "${{ inputs.model || 'sonnet' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
          code=$?
          set -e

          # 75 (EX_TEMPFAIL) = hết hạn mức tài khoản. pipeline.ts cố ý tách mã
          # này khỏi mã 1 để chỗ này phân biệt được "chạy lại sau" với "có thứ
          # hỏng cần người xem". Với gói đăng ký, hết hạn mức là kết cục BÌNH
          # THƯỜNG và sẽ lặp lại; báo đỏ mỗi lần thì sau vài lần không ai đọc
          # nữa, và đúng lúc hỏng thật sẽ không ai nhận ra.
          if [ "$code" -eq 75 ]; then
            echo "::notice::Hết hạn mức tài khoản — không phải lỗi cấu hình. Đợi quota reset rồi chạy lại, không cần sửa gì."
            exit 0
          fi
          exit $code

      - name: Rà lại toàn kho sau lượt chạy
        # Chạy cả khi bước trên hỏng: một lượt bị cắt giữa chừng là đúng lúc
        # cần biết kho còn lại ở trạng thái nào.
        if: always()
        working-directory: sciencepedia
        # Gate trả exit 1 khi có bài bị chặn — ở đây đó là thông tin, không phải
        # sự cố của workflow, nên nuốt mã lỗi và giữ nguyên output.
        #
        # `--draft` là bắt buộc chứ không phải cho đầy đủ: một lượt chạy bị
        # cắt giữa chừng để lại đúng một thứ — bài ở trạng thái DRAFT. Không
        # có cờ này thì bước rà chỉ nhìn bài đã PUBLISHED, tức là mù đúng chỗ
        # cần thấy nhất.
        run: npm run publish:check -- --draft || true

      - name: Lưu báo cáo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run
          # Kèm cả drafts/: khi chạy thử, agent soạn bài ra đó chứ không ghi
          # CSDL — không tải về thì lần chạy thử không còn gì để đọc.
          path: |
            docs/content/pipeline-run-*.md
            docs/content/drafts/
          if-no-files-found: warn
