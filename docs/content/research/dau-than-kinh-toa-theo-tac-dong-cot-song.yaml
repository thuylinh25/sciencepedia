key_facts:
  - claim: "Đau thần kinh tọa là đau, yếu, tê hoặc châm chích ở chân do dây thần kinh tọa bị tổn thương hoặc chèn ép; là triệu chứng của một vấn đề khác, không phải bệnh riêng."
    sources: [s1, s2]
  - claim: "Dây thần kinh tọa bắt đầu từ thắt lưng, chạy dọc mặt sau mỗi chân (NHS: tới bàn chân)."
    sources: [s1, s2]
  - claim: "Nguyên nhân thường gặp nhất là thoát vị đĩa đệm (NHS); ngoài ra hẹp ống sống, trượt đốt sống."
    sources: [s1, s2]
  - claim: "Thường chỉ một bên; thường đỡ trong vài tuần đến vài tháng nhưng hay tái phát."
    sources: [s1, s2]
  - claim: "Cấp cứu khi đau hai bên, tê/yếu hai chân nặng hoặc nặng dần, tê vùng sinh dục–hậu môn, rối loạn tiểu tiện/đại tiện."
    sources: [s1, s2]
  - claim: "Là một ví dụ của đau do thần kinh (neuropathic pain)."
    sources: [s3]
