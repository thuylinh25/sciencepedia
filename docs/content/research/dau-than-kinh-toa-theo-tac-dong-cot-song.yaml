sources:
  - id: s1
    tier: 2
    title: "Sciatica"
    publisher: MedlinePlus Medical Encyclopedia — U.S. National Library of Medicine (NIH)
    url: https://medlineplus.gov/ency/article/000686.htm
    reviewed: 2024-08-27
    passages:
      - "Sciatica refers to pain, weakness, numbness, or tingling in the leg. It is caused by injury to or pressure on the sciatic nerve. Sciatica is a symptom of a medical problem. It is not a medical condition by itself."
      - "This nerve starts in the lower back and runs down the back of each leg."
      - "The pain most often occurs on one side of the body."
      - "As sciatica is a symptom of a more specific medical condition, the underlying cause should be identified and treated."
      - "Often, sciatica gets better on its own. But it is common for it to return."
      - "Sciatica can lead to permanent numbness or weakness of your leg."
      - "Contact your provider right away if you have: Unexplained fever with back pain; Back pain after a severe blow or fall; Redness or swelling on the back or spine; Pain traveling down your legs below the knee; Weakness or numbness in your buttocks, thigh, leg, or pelvis; Burning with urination or blood in your urine; Pain that is worse when you lie down, or awakens you at night; Severe pain and you cannot get comfortable; Loss of control of urine or stool (incontinence)"
  - id: s2
    tier: 2
    title: "Sciatica"
    publisher: NHS (UK)
    url: https://www.nhs.uk/conditions/sciatica/
    reviewed: 2024-12-03
    passages:
      - "Sciatica happens when the sciatic nerve, which runs from your lower back to your feet, is irritated or compressed. It usually gets better in a few weeks to a few months but can last longer."
      - "The symptoms of sciatica usually affect your bottom and the back of one leg, often including your foot and toes."
      - "You probably do not have sciatica if you only have back pain ."
      - "a slipped disc , when a soft cushion of tissue between the bones in your spine pushes out – this is the most common cause of sciatica and is more likely to happen as you get older"
      - "spinal stenosis – narrowing of the part of your spine where nerves pass through"
      - "spondylolisthesis – when one of the bones in your spine slips out of position"
      - "Immediate action required: Go to A&E or call 999 if you: have sciatica on both sides; have weakness or numbness in both legs that's severe or getting worse; have numbness around or under your genitals, or around your bottom (anus); find it hard to start peeing, cannot pee or cannot control when you pee – and this is not normal for you; do not notice when you need to poo or cannot control when you poo – and this is not normal for you"
      - "These could be symptoms of a serious back problem that needs to be treated in hospital as soon as possible."
  - id: s3
    tier: 2
    title: "Pain"
    publisher: National Institute of Neurological Disorders and Stroke (NIH)
    url: https://www.ninds.nih.gov/health-information/disorders/back-pain
    reviewed: 2026-03-13
    passages:
      - "Neuropathic pain describes pain that is caused by nerve damage due to an injury or disease. Neuropathic pain sensations are often described as burning, tingling, shooting, or like electric shocks. Examples of conditions that cause neuropathic pain are diabetic neuropathy, shingles, and sciatica."

  - id: s4
    tier: 1
    title: "Evaluation and Management of Cauda Equina Syndrome"
    publisher: Kuris EO, McDonald CL, Palumbo MA, Daniels AH — The American Journal of Medicine
    doi: 10.1016/j.amjmed.2021.07.021
    citation: "Am J Med. 2021;134(12):1483-1489. PMID 34473966"   # Crossref xác nhận 2026-10-05
    accessed: 2026-10-05
    read: abstract qua Europe PMC REST (NCBI E-utilities bị chặn — trang misuse)
    passages:
      - "Cauda equina syndrome is a potentially devastating spinal condition."
      - "Cauda equina syndrome results from conditions that compress the nerves in the lumbosacral spinal canal."
      - "Once suspected, emergent spinal surgery referral is indicated, along with urgent decompression. Even with expeditious surgery, improvements remain inconsistent. However, early intervention has been shown to portend greater chance of neurologic recovery."
  - id: s5
    tier: 1
    title: "Evaluation and management of cauda equina syndrome in the emergency department"
    publisher: Long B, Koyfman A, Gottlieb M — The American Journal of Emergency Medicine
    doi: 10.1016/j.ajem.2019.158402
    citation: "Am J Emerg Med. 2020;38(1):143-148. PMID 31471075"   # Crossref xác nhận 2026-10-05
    accessed: 2026-10-05
    read: abstract qua Europe PMC REST
    passages:
      - "Cauda equina syndrome is a rare but emergent condition associated with back pain. It can result in severe morbidity and can be due to a variety of causes, most commonly vertebral disc protrusion."
      - "Treatment relies upon surgical consultation and operative intervention for decompression."
