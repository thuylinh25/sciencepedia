    data_url: https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_mm_gl.txt
    accessed: 2026-09-10        # đọc lại lần 2; lần đầu 2026-09-06
    passages:
      # Ba ô liền nhau trong cùng khối "Global Monthly Mean CO 2" của trang.
      # Ghi thành ba chuỗi rời vì chúng là ba nút DOM rời, không phải một câu.
      - "Global Monthly Mean CO 2"
      - "June 2026: 427.62 ppm"      # đọc lại 2026-09-10 — con số bài đang dùng
      - "June 2025: 425.90 ppm"      # đọc lại 2026-09-10
      - "Last updated: Sep 05, 2026" # đọc lại 2026-09-10
      - "The graphs show monthly mean carbon dioxide globally averaged over marine surface sites."
      - "Data are reported as a dry air mole fraction defined as the number of molecules of carbon dioxide divided by the number of all molecules in air, including CO 2 itself, after water vapor has been removed."
      - "The last year of data are still preliminary , pending recalibrations of reference gases and other quality control checks."
    # ── ĐÃ THAY THẾ, GIỮ LẠI CÓ CHỦ Ý ─────────────────────────────────────────
    # Không xoá. Đây là ví dụ tốt nhất trong kho về đúng cái lỗi mà BÀI NÀY nói
    # tới: một con số tách khỏi mốc thời gian là một con số sắp sai.
    superseded_passages:
      - text: "May 2026: 428.73 ppm"
        read_at: 2026-09-06
        superseded_at: 2026-09-10
        what_happened: >
          NOAA hiệu chuẩn lại tháng 5/2026 từ 428.73 xuống 428.59 ppm — kiểm trong
          co2_mm_gl.txt, dòng "2026 5 2026.375 428.59" — đúng như mệnh đề "still
          preliminary" của chính trang đã cảnh báo. Đồng thời ô hiển thị của trang
          html đã lăn sang tháng 6/2026, nên chuỗi "May 2026" KHÔNG còn tìm thấy
          trên trang: trích dẫn cũ không resolve được cho người đọc mở link.
          Tháng 5/2025 thì KHÔNG đổi (vẫn 427.04) — chỉ năm gần nhất bị hiệu chuẩn
          lại. Bản nháp đã sửa sang 427,62 ppm / tháng 6/2026 theo phán quyết S2
          của science-editor vòng 1 (2026-09-10).
      - text: "May 2025: 427.04 ppm"
        read_at: 2026-09-06
        superseded_at: 2026-09-10
        what_happened: "Giá trị không đổi, nhưng ô hiển thị đã lăn sang June 2025: 425.90 ppm."
      - text: "Last updated: Aug 05, 2026"
        read_at: 2026-09-06
        superseded_at: 2026-09-10
        what_happened: "Trang cập nhật lại ngày Sep 05, 2026."
    note: >
      Đây là bản ghi ĐO, không phải bài viết phổ thông — nên nó là chỗ duy
      nhất trong bảng được phép cấp con số CO₂ hiện tại. Nó cũng định nghĩa
      "dry air mole fraction", tức đúng cái đại lượng mà bộ 78,08 / 20,95 /
      0,93 của s2 nói tới. Hai nguồn khớp nhau về ĐỊNH NGHĨA, không chỉ về số.
    caveat: >
      Chính trang ghi số liệu năm gần nhất còn SƠ BỘ. Bài phải nêu tháng và
      năm kèm con số, và không được viết "hiện nay" trống trơn.

  - id: s4
    tier: 2
    title: "Earth Atmosphere Model — Metric Units"
    publisher: "NASA Glenn Research Center — Beginner's Guide to Aeronautics"
    url: https://www.grc.nasa.gov/www/k-12/airplane/atmosmet.html
    modified: 2021-05-13          # dòng "Last Updated" ở chân trang
    accessed: 2026-09-06
    passages:
      - "The pressure of the air can be related to the weight of the air over a given location. As we increase altitude through the atmosphere, there is some air below us and some air above us. But there is always less air above us than was present at a lower altitude. Therefore, air pressure decreases as we increase altitude."
      - "Thus the air temperature is highest near the surface and decreases as altitude increases."
      - "The troposphere runs from the surface of the Earth to 11,000 meters. In the troposphere, the temperature decreases linearly and the pressure decreases exponentially."
      - "T = 15.04 - .00649 * h"
      - "p = 101.29 * [(T + 273.1)/288.08]^5.256"
      - "where the temperature is given in Celsius degrees, the pressure in kilo-Pascals,and h is the altitude in meters."
      - "The model was developed from atmospheric measurements that were averaged and curve fit to produce the given equations. The model assumes that the pressure and temperature change only with altitude."
    note: >
      Nguồn này cấp một CÔNG THỨC, không cấp một con số — nên mọi con số bài
      rút ra từ nó là PHÉP TÍNH CỦA BÀI và phải được gọi đúng tên như vậy.
      Xem numeric_checks trong file checks.
    caveat: >
      Đây là mô hình khí quyển chuẩn (ngày trung bình), tự nói rõ là "averaged
      and curve fit" và "assumes that the pressure and temperature change only
      with altitude". Bài KHÔNG được trình bày con số của nó như số đo tại một
      chỗ cụ thể vào một ngày cụ thể.

  - id: s5
    tier: 2
    title: "Basic Ozone Layer Science"
    publisher: "U.S. Environmental Protection Agency (EPA)"
    url: https://www.epa.gov/ozone-layer-protection/basic-ozone-layer-science
    accessed: 2026-09-06
    passages:
      - "The Earth's atmosphere is composed of several layers."
      - "extends from the Earth's surface up to about 6 miles or 10 kilometers (km) in altitude. Virtually all human activities occur in the troposphere."
      - "The troposphere extends from the surface up to about 10 km in altitude, although this height varies with latitude. Almost all weather takes place in the troposphere."
      - "Mt. Everest, the highest mountain on Earth, is only 8.8 km high."
      - "continues from 6 miles (10 km) to about 31 miles (50 km). Most commercial airplanes fly in the lower part of the stratosphere."
      - "The stratosphere extends from about 10km to about 50km in altitude. Commercial airlines fly in the lower stratosphere."
      - "The stratosphere gets warmer at higher altitudes. In fact, this warming is caused by ozone absorbing ultraviolet radiation."
      - "Most atmospheric ozone is concentrated in a layer in the stratosphere, about 9 to 18 miles (15 to 30 km) above the Earth's surface"
      - "UVA is not absorbed by ozone. UVB is mostly absorbed by ozone, although some reaches the Earth. UVC is completely absorbed by ozone and normal oxygen."
    note: >
      Nguồn ĐỘC LẬP thứ hai cho cơ chế "tầng bình lưu ấm dần lên vì ozon hấp
      thụ tia cực tím" — s1 nói cùng điều bằng chữ khác. Hai cơ quan khác nhau
