sources:
  - id: s1
    tier: 2
    title: "Earth's Atmosphere: A Multi-layered Cake"
    publisher: "NASA Science — Alan Buis, NASA's Global Climate Change website"
    url: https://science.nasa.gov/earth/earth-atmosphere/earths-atmosphere-a-multi-layered-cake/
    published: 2019-10-02
    modified: 2024-10-22          # từ JSON-LD của chính trang
    accessed: 2026-09-06
    passages:
      - "Earth's atmosphere has five major and several secondary layers. From lowest to highest, the major layers are the troposphere, stratosphere, mesosphere, thermosphere and exosphere."
      - "Earth's troposphere extends from Earth's surface to, on average, about 12 kilometers (7.5 miles) in height, with its height lower at Earth's poles and higher at the equator."
      - "this very shallow layer is tasked with holding all the air plants need for photosynthesis and animals need to breathe, and also contains about 99 percent of all water vapor and aerosols"
      - "In the troposphere, temperatures typically go down the higher you go, since most of the heat found in the troposphere is generated by the transfer of energy from Earth's surface."
      - "The troposphere is the densest atmospheric layer, compressed by the weight of the rest of the atmosphere above it. Most of Earth's weather happens here"
      - "Located between approximately 12 and 50 kilometers (7.5 and 31 miles) above Earth's surface, the stratosphere is perhaps best known as home to Earth's ozone layer, which protects us from the Sun's harmful ultraviolet radiation. Because of that UV radiation, the higher up you go into the stratosphere, the warmer temperatures become."
      - "Located between about 50 and 80 kilometers (31 and 50 miles) above Earth's surface, the mesosphere gets progressively colder with altitude. In fact, the top of this layer is the coldest place found within the Earth system, with an average temperature of about minus 85 degrees Celsius (minus 120 degrees Fahrenheit)."
      - "Most meteors burn up in this atmospheric layer."
      - "Located between about 80 and 700 kilometers (50 and 440 miles) above Earth's surface is the thermosphere, whose lowest part contains the ionosphere. In this layer, temperatures increase with altitude due to the very low density of molecules found here. It is both cloud- and water vapor-free. The aurora borealis and aurora australis are sometimes seen here. The International Space Station orbits in the thermosphere."
      - "Located between about 700 and 10,000 kilometers (440 and 6,200 miles) above Earth's surface, the exosphere is the highest layer of Earth's atmosphere and, at its top, merges with the solar wind. Molecules found here are of extremely low density, so this layer doesn't behave like a gas, and particles here escape into space."
      - "While there's really no clear boundary between where Earth's atmosphere ends and outer space begins, most scientists use a delineation known as the Karman line, located 100 kilometers (62 miles) above Earth's surface, to denote the transition point, since 99.99997 percent of Earth's atmosphere lies beneath this point."
    caveat: >
      Lời giải thích của NASA cho tầng nhiệt — "temperatures increase with
      altitude DUE TO the very low density of molecules found here" — là một
      phát biểu nhân quả mà không nguồn nào khác trong bảng lặp lại. Bài chỉ
      dùng SỰ KIỆN (nhiệt độ tăng theo độ cao trong tầng nhiệt), KHÔNG chép
      lại mệnh đề nhân quả đó.

  - id: s2
    tier: 2
    title: "The Atmosphere: Getting a Handle on Carbon Dioxide"
    publisher: "NASA — Alan Buis, Jet Propulsion Laboratory (climate.nasa.gov)"
    url: https://climate.nasa.gov/news/2915/the-atmosphere-getting-a-handle-on-carbon-dioxide/
    published: 2019-10-09
    modified: 2024-10-22          # từ JSON-LD của chính trang
    accessed: 2026-09-06
    passages:
      - "By volume, the dry air in Earth's atmosphere is about 78.08 percent nitrogen, 20.95 percent oxygen, and 0.93 percent argon."
      - "A brew of trace gases accounts for the other approximately 0.04 percent, including the greenhouse gases carbon dioxide, methane, nitrous oxide and ozone."
      - "The concentration of carbon dioxide in Earth's atmosphere is currently at nearly 412 parts per million (ppm) and rising. This represents a 47 percent increase since the beginning of the Industrial Age, when the concentration was near 280 ppm, and an 11 percent increase since 2000, when it was near 370 ppm."
    caveat: >
      Câu CO₂ là claim GẮN NGÀY và trang không tự nêu ngày trong câu — "hiện
      nay gần 412 ppm" là số của khoảng 2019. Dùng lại nó năm 2026 chính là
      lỗi mà docs/content-rules.md gọi tên ở mục "Ước lượng điểm không đặt vào
      tiêu đề": một con số bị tách khỏi năm của nó rồi được trích lại mãi.
      Bài LẤY 280 ppm tiền công nghiệp từ nguồn này, và lấy con số hiện tại
      từ s3 (NOAA GML, có tháng và năm in trên trang). KHÔNG dùng "47%" và
      KHÔNG dùng "412 ppm".

  - id: s3
    tier: 2
    title: "Trends in Atmospheric Carbon Dioxide — Global"
    publisher: "NOAA Global Monitoring Laboratory (GML), Boulder"
    url: https://gml.noaa.gov/ccgg/trends/global.html
    # URL dữ liệu thô, thêm 2026-09-10: trang html chỉ hiển thị THÁNG MỚI NHẤT,
