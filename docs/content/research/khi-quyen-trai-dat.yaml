    caveat: >
      EPA TỰ MÂU THUẪN về dải ozon: phần thân bài ghi "15 to 30 km", còn mục
      từ điển trên cùng trang ghi "approximately 15-40 kilometers". Xem
      conflicts — bài KHÔNG nêu con số nào cho dải ozon.

  - id: s6
    tier: 3
    title: "What's in the Air?"
    publisher: "UCAR Center for Science Education (NCAR/UCAR)"
    url: https://scied.ucar.edu/learning-zone/air-quality/whats-in-the-air
    accessed: 2026-09-06
    passages:
      - "The most abundant naturally occurring gas is nitrogen (N 2 ), which makes up about 78% of air. Oxygen (O 2 ) is the second most abundant gas at about 21%. The inert gas argon (Ar) is the third most abundant gas at 0.93%."
      - "The dry composition of the atmosphere is mostly nitrogen and oxygen."
      - "the amount of water in the air is constantly changing. The lower troposphere can contain up to 4% water vapor (H 2 O) in areas near the tropics, while the poles contain only trace amounts of water vapor."
      - "The concentration of water vapor decreases drastically with altitude. The upper troposphere has less water vapor than air near the surface, the stratosphere and mesosphere have almost no water vapor, and the thermosphere contains none at all."
      - "Carbon dioxide naturally composes about 0.03% of the atmosphere, but the amount is increasing due to the burning of fossil fuels."
    note: >
      BẬC 3 (giáo dục), nên KHÔNG được dùng một mình cho bất kỳ con số nào.
      Vai trò duy nhất của nó trong bài: hơi nước biến thiên tới 4% ở tầng đối
      lưu thấp vùng nhiệt đới — và ngay cả claim đó cũng chỉ đứng được vì nó
      khớp với "99 percent of all water vapor" trong tầng đối lưu của s1
      (bậc 2) và với chính định nghĩa "dry air" của s2/s3.
    caveat: >
      Câu "carbon dioxide naturally composes about 0.03%" là 300 ppm — LỖI
      THỜI so với 428,73 ppm mà NOAA đo tháng 5/2026 (= 0,0429%). Đây là ví dụ
      sống của chuyện một con số bị tách khỏi năm rồi được chép lại. TUYỆT ĐỐI
      không dùng. Xem finding F2 trong file checks.

  - id: s7
    tier: 3
    title: "Change in the Atmosphere with Altitude"
    publisher: "UCAR Center for Science Education (NCAR/UCAR)"
    url: https://scied.ucar.edu/learning-zone/atmosphere/change-atmosphere-altitude
    accessed: 2026-09-06
    passages:
      - "The atmosphere is divided into different layers depending on how temperature changes."
      - "Temperature increases as you gain altitude in the stratosphere and the thermosphere."
      - "Temperature decreases as you gain altitude in the troposphere and mesosphere."
      - "If air temperature is 27° C at sea level as shown, you can expect it to be around 1° C at air altitude of 4000 meters because of the lapse rate."
      - "Air pressure is higher at lower altitudes."
      - "There is more space between air molecules at higher altitudes."
    note: >
      BẬC 3, dùng đúng một việc: ĐỐI CHIẾU ĐỘC LẬP cho suất giảm nhiệt của
      s4. UCAR nói 27 °C ở mực nước biển → khoảng 1 °C ở 4.000 m; công thức
      của NASA Glenn cho 27 − 6,49 × 4 = 1,04 °C. Hai nguồn dựng riêng, khớp
      tới 0,04 °C. Đó là bằng chứng công thức của s4 được dùng đúng, không
      phải một claim mới.
    tier_limit_extension: >
      NỚI 2026-09-11 theo phán quyết science-editor (checks/…yaml, round_3,
      finding F-R3-1, điều kiện C3). Phạm vi nới DUY NHẤT: câu định tính
      "khí quyển được chia tầng theo tiêu chí chiều biến thiên của nhiệt độ
      theo độ cao" — câu s1 (NASA) và s5 (EPA) chỉ LIỆT KÊ năm tầng mà không
      phát biểu tiêu chí phân chia, để lộ một khoảng trống mà s7 lấp bằng
      câu "The atmosphere is divided into different layers depending on how
      temperature changes." Lý do cho phép: đồng thuận giáo khoa, không định
      lượng, không mâu thuẫn với nguồn bậc 1–2 nào trong bảng. KHÔNG nới cho
      bất kỳ con số nào của s7 — mọi con số vẫn giữ nguyên giới hạn "chỉ đối
      chiếu suất giảm nhiệt của s4".
      expires: 2027-03-31 hoặc lần sửa bài kế tiếp, cái nào đến trước. Việc
      lượt sau: dựng nguồn bậc 1–2 thay thế cho đúng claim định tính này
      (AMS Glossary mục "atmospheric shell", NWS JetStream nếu hết bị chặn
      403, hoặc WMO) rồi gỡ khối nới này.

  - id: s8
    tier: 1
    title: "The edge of space: Revisiting the Karman Line"
    publisher: "Jonathan C. McDowell — Acta Astronautica 151, 668–677"
    year: 2018
    doi: 10.1016/j.actaastro.2018.07.003
    url: https://doi.org/10.1016/j.actaastro.2018.07.003
    preprint: https://arxiv.org/abs/1807.07894
    accessed: 2026-09-06
    passages:
      - "In this paper I revisit proposed definitions of the boundary between the Earth's atmosphere and outer space, considering orbital and suborbital trajectories used by space vehicles."
      - "I investigate the inner edge of outer space from historical, physical and technological viewpoints and propose 80 kilometers as a more appropriate boundary than the currently popular 100 km Von Kármán line."
    doi_verified: >
      Crossref 2026-09-06 — khớp tác giả McDowell, tạp chí Acta Astronautica,
      tập 151, trang 668-677, 2018/10. Abstract lấy nguyên văn từ bản preprint
      arXiv:1807.07894 (200), vì science-direct trả trang chặn cho bot.
    note: >
      Bậc 1, và là nguồn DUY NHẤT trong bảng nói ngược lại một con số của
      NASA (s1 dùng 100 km làm mốc quy ước). Đây là lý do bài nói "quy ước",
      không nói "ranh giới".
    caveat: >
      McDowell ĐỀ XUẤT 80 km, không phát biểu rằng 80 km là ranh giới đã được
      công nhận. Bài phải giữ đúng chữ "đề xuất". Nâng nó lên thành "ranh giới
      thật sự là 80 km" là lỗi cấp từ chối.

# Đếm điều kiện gate: 8 nguồn, trong đó 6 bậc 1–2 (s1 s2 s3 s4 s5 bậc 2, s8
# bậc 1). s6 và s7 bậc 3, chỉ dùng để đối chiếu. Ngưỡng là 3.
strong_tier_count: 6

key_facts:
  - claim: "Khí quyển có năm tầng chính, từ dưới lên: đối lưu, bình lưu, trung lưu, nhiệt, ngoài"
    sources: [s1]
    confidence: high
  - claim: "Tầng đối lưu kéo từ mặt đất lên trung bình chừng 12 km, thấp hơn ở hai cực và cao hơn ở xích đạo"
    sources: [s1]
    confidence: high
    cross_check: >
      EPA (s5) ghi "khoảng 10 km" và nói rõ "this height varies with latitude".
      Hai con số không mâu thuẫn — chúng là hai giá trị trung bình của cùng
      một đại lượng vốn biến thiên theo vĩ độ. Xem conflicts.
  - claim: "Tầng đối lưu là tầng đặc nhất, chứa chừng 99% toàn bộ hơi nước và sol khí, và gần như toàn bộ thời tiết diễn ra ở đó"
