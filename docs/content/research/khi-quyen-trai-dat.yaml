conflicts:
  - >
    Đỉnh tầng đối lưu: NASA (s1) ghi trung bình chừng 12 km, EPA (s5) ghi
    chừng 10 km. Xử lý: KHÔNG chọn một con số rồi giấu con số kia, và KHÔNG
    lấy trung bình. Chính s1 và s5 đều nói đại lượng này biến thiên theo vĩ độ
    ("lower at Earth's poles and higher at the equator" / "this height varies
    with latitude") — nên bài nêu bộ số NASA cho toàn bộ năm tầng (để một bộ
    số duy nhất, khép kín) VÀ nói rõ ranh giới là trung bình biến thiên theo
    vĩ độ. Sự lệch giữa hai nguồn chính là bằng chứng cho điều đó, không phải
    một lỗi cần che.
  - >
    Dải ozon: EPA tự đưa hai giá trị trên CÙNG một trang — "15 to 30 km" ở
    thân bài, "approximately 15-40 kilometers" ở mục từ điển. Xử lý: CẮT con
    số. Bài chỉ nói "phần lớn ozon tập trung trong tầng bình lưu", điều mà cả
    s1 lẫn s5 đều nói. Một đại lượng có hai giá trị trong cùng một nguồn thì
    chưa được kiểm.
  - >
    Nồng độ CO₂: s2 (NASA, 2019) "gần 412 ppm"; s6 (UCAR) "khoảng 0,03%" tức
    300 ppm; s3 (NOAA GML) đo 428,73 ppm tháng 5/2026. Xử lý: chỉ dùng s3, kèm
    tháng và năm. Hai con số kia không sai lúc chúng được viết — chúng chỉ
    không mang theo mốc thời gian của mình, và đó đúng là cách chúng trở thành
    sai.
  - >
    Thành phần: s2 cho 78,08 / 20,95 / 0,93; s6 cho 78 / 21 / 0,93. Xử lý:
    dùng bộ của s2 (bậc 2, nhiều chữ số hơn, tự khép kín với phần dư 0,04%).
    Bộ của s6 chỉ là cùng bộ số đã làm tròn, nên đây là đối chiếu chứ không
    phải mâu thuẫn.

open_questions:
  - >
    Vì sao nhiệt độ tăng theo độ cao trong TẦNG NHIỆT: s1 quy cho "the very
    low density of molecules found here", một phát biểu nhân quả không nguồn
    nào khác trong bảng lặp lại và cũng không phải cách sách giáo khoa khí
    tượng thường giải thích (hấp thụ tử ngoại xa và tia X). Không dựng được
    nguồn bậc 1–2 nào cho cơ chế trong lượt này. Xử lý: bài nêu SỰ KIỆN
    (nhiệt độ tăng theo độ cao) và KHÔNG nêu cơ chế.
  - >
    Liên quan: "nhiệt độ cao trong tầng nhiệt không có nghĩa là ở đó nóng"
    (nhiệt độ động học cao nhưng mật độ quá thấp để truyền nhiệt) là một điểm
    hay và hay bị hiểu sai, nhưng KHÔNG dựng được nguồn bậc 1–2 trong lượt
    này. Cắt. Ai muốn thêm thì phải dựng nguồn trước.
  - >
    Khối lượng tổng của khí quyển (~5,15 × 10¹⁸ kg) và tỉ lệ khối lượng nằm
    dưới từng tầng: không lấy được từ nguồn bậc 1–2 trong lượt này (NASA Earth
    Fact Sheet ở nssdc.gsfc.nasa.gov đang "temporarily offline for maintenance"
    — trang trả 200 nhưng nội dung là thông báo bảo trì). Bài không nêu con số
    khối lượng nào; điểm "phần lớn khí quyển nằm rất thấp" dựng bằng tỉ số áp
    suất tính từ s4, vì áp suất chính là trọng lượng cột khí (s4 nói vậy).
  - >
    Nguồn NOAA/NWS JetStream ("Layers of the Atmosphere", "Air Composition")
    là nguồn hợp nhất cho chủ đề này nhưng noaa.gov và weather.gov đều trả 403
    cho môi trường này. Nếu lượt sau có đường truy cập, nên bổ sung để có một
    cơ quan thứ ba độc lập với NASA cho phần cấu trúc tầng.
  - >
    Tầng điện ly (ionosphere) chỉ được nhắc đến ở mức "nằm trong phần thấp của
    tầng nhiệt" (s1). Cơ chế ion hoá, biến thiên ngày đêm và ảnh hưởng tới
    truyền sóng vô tuyến: chưa dựng nguồn, và 600 từ không đủ. Để dành cho một
    bài riêng.

