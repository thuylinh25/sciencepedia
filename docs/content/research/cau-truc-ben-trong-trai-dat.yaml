conflicts:
  - >
    Độ dày lõi: USGS (s1) ghi lõi ngoài 2.200 km và lõi trong 1.250 km; NASA
    (s6) ghi 2.250 km và 1.221 km. Xử lý: dùng bộ NASA vì nó khép kín đúng
    6.371 km và khớp bán kính lõi trong quen dùng trong tài liệu địa chấn,
    và NÊU RÕ đó là số của NASA. Không trộn hai bộ trong cùng một câu, không
    lấy trung bình.
  - >
    Thành phần lõi: s1 nói "hợp kim sắt–niken"; s2 nói "chủ yếu là sắt, kèm
    khoảng 10% hợp kim của oxy hoặc lưu huỳnh hoặc niken". Xử lý: bài dùng
    phát biểu chi tiết hơn của s2 và giữ chữ "được cho là", vì s1 là bản
    giản lược cho người đọc phổ thông của cùng cơ quan.
  - >
    Góc vùng tối sóng P: ba con số khác nhau (103–140, 104–140, 103–142) trong
    ba chỗ. Xử lý: KHÔNG dùng góc vùng tối P trong bài. Chỉ dùng ~103° của
    sóng S — keypoint trên chính trang chuyên về nó (s3).

open_questions:
  - >
    Năm Inge Lehmann phát hiện lõi trong: bài báo "P'" của bà thường được ghi
    là 1936, còn IRIS (s5) ghi "Inge Lehmann (1937)". Không lấy được nguồn
    bậc 1–2 nào phát biểu dứt khoát trong lượt này (aps.org và amnh.org đều
    trả 403/CAPTCHA). Xử lý: KHÔNG nêu Lehmann kèm năm trong bài. Ai muốn
    thêm thì phải dựng nguồn trước.
  - >
    ĐÃ ĐÓNG ở bước 2 (F1). QID là Q1664027, đã tra Wikidata thật. Trái Đất là
    Q2 và đã dùng cho entity `trai-dat`, nên không dùng lại — hai entity khác
    nhau: một là hành tinh, một là cấu trúc bên trong nó.
  - >
    Bảng bán kính chi tiết của PREM (Moho, 2891 km, 5150 km): không lấy được
    trong lượt này (xem caveat của s8). Bài không phát biểu con số nào quy về
    PREM.
  - >
    Tốc độ sóng P và S theo đơn vị km/s ở từng lớp: không lấy được từ nguồn
    bậc 1–2 trong lượt này. Bài chỉ nói tương đối ("nhanh nhất", "giảm
    khoảng 30%"), không nêu con số tuyệt đối.
