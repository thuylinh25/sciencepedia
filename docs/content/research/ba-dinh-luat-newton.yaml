# --- Nguồn nói ngược nhau -------------------------------------------------
conflicts:
  - about: Năm của Principia
    s1: "In 1686, he presented his three laws of motion in the 'Principia Mathematica Philosophiae Naturalis.'"
    s10: 'Hai câu tách nhau: "presented Book 1 … at the end of April 1686" và "the 1687 printed first edition was produced"'
    resolution: >
      Không phải mâu thuẫn thật mà là một câu gộp. Theo s10: TRÌNH 1686, IN
      1687. Bài hoặc nêu cả hai mốc, hoặc không nêu năm nào. Chép câu của NASA
      nguyên xi sẽ sinh ra "Principia xuất bản 1686" — sai, và sai theo kiểu
      không ai kiểm vì nó có một nguồn bậc 2 đứng sau.

open_questions:
  - "Bảng này không có nguồn nào cho phát biểu 'ở gần lỗ đen phải thay Newton bằng thuyết tương đối'. s4 chỉ nêu điều kiện tốc độ và kích thước. Muốn nêu trường hấp dẫn mạnh thì phải đi tìm nguồn khác, hoặc không nêu."
  - "Bảng này không có nguồn nào cho danh sách ứng dụng ('thiết kế cầu đường', 'mô phỏng chuyển động trong kỹ thuật'). s3 có ví dụ máy bay, s8 có quỹ đạo hành tinh — dùng ví dụ CÓ NGUỒN thay cho danh sách không nguồn."
  - "Wikidata QID Q16590 ghi ở trên là suy đoán, CHƯA tra. Bước 5 phải tự xác minh, không tin dòng này."

