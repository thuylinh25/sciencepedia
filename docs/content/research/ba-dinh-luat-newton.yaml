# --- Những gì bài KHÔNG nói, và vì sao ------------------------------------
exclusions:
  - claim: "Newton chứng minh các định luật Kepler là đúng"
    why: >
      Vượt phạm vi s9 (nguồn chỉ nói thuyết hấp dẫn giải thích lực đằng sau
      định luật THỨ BA của Kepler), và không tìm thấy trên s8. Xem `not_found`
      ở s8.
  - claim: "Định luật II là định luật nổi tiếng nhất của Newton"
    why: Không nguồn nào trong bảng xếp hạng mức nổi tiếng. Câu này đang nằm trong bài đã publish.
  - claim: "Gần lỗ đen thì vật lý Newton phải thay bằng thuyết tương đối"
    why: Không có trong bảng nguồn. Xem open_questions.
  - claim: Cơ chế hấp dẫn, độ cong không–thời gian, vì sao hấp dẫn khác lực điện từ
    why: >
      Đã có bài `tu-truong-va-luc-hap-dan-hai-luc-vo-hinh-hai-co-che-khac-nhau`
      (PUBLISHED). Bài này liên kết sang, không kể lại.
  - claim: Ba định luật Kepler phát biểu ra sao
    why: >
      Đã có bài `ba-dinh-luat-kepler-hanh-tinh-chuyen-dong-theo-quy-luat-nao`
      (PUBLISHED). Bài này nêu quan hệ Kepler–Newton rồi liên kết sang.
  - claim: Thời gian giãn, đồng thời tương đối, vì sao tốc độ ánh sáng là trần
    why: >
      Đã có bài `thuyet-tuong-doi-hep-khi-thoi-gian-khong-con-tuyet-doi`
      (PUBLISHED). Bài này chỉ nêu ĐIỀU KIỆN áp dụng rồi liên kết sang.
  - claim: Phân biệt khối lượng / quán tính / trọng lượng
    why: >
      Dòng #3 của hàng đợi, chưa viết; kho đã có `bi-mat-dang-sau-cam-giac-nang-
      va-nhe` (PUBLISHED) chạm tới cảm giác nặng–nhẹ. Bài này nói khối lượng ĐO
      quán tính rồi dừng.
