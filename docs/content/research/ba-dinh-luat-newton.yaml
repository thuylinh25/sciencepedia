    tier: 2
    title: Newton's Laws of Motion
    publisher: NASA Glenn Research Center — Beginner's Guide to Aeronautics
    url: https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/newtons-laws-of-motion/
    accessed: 2026-09-12
    passages:
      - "An object at rest remains at rest, and an object in motion remains in motion at constant speed and in a straight line unless acted on by an unbalanced force."
      - "This tendency to resist changes in a state of motion is inertia."
      - "The acceleration of an object depends on the mass of the object and the amount of force applied."
      - "Momentum is defined to be the mass m of an object times its velocity V."
      - "Whenever one object exerts a force on another object, the second object exerts an equal and opposite force on the first."
      - "In 1686, he presented his three laws of motion in the 'Principia Mathematica Philosophiae Naturalis.'"
    note: >
      Trang này phát biểu định luật II bằng NGÔN NGỮ ĐỘNG LƯỢNG (lực bằng biến
      thiên động lượng trên biến thiên thời gian), và đưa dạng rời rạc
      F = (m1·V1 − m0·V0)/(t1 − t0). Đó là dạng tổng quát hơn F = ma: nó còn
      đúng khi khối lượng thay đổi. Bài KHÔNG được trình bày F = ma như thể đó
      là phát biểu gốc duy nhất.
    warning: >
      BẪY NIÊN ĐẠI. Câu "In 1686, he presented his three laws of motion in the
      Principia" gộp hai mốc khác nhau: trình bày trước Royal Society (1686) và
      IN THÀNH SÁCH (1687). Xem s10. Nếu bài nêu năm thì phải nêu đúng mốc nào,
      không chép nguyên câu của NASA.

