    publisher: NASA Science
    url: https://science.nasa.gov/moon/tidal-locking/
    accessed: 2026-09-12
    passages:
      - "As the Moon bent and fluxed in this tug of war, energy was released in the form of heat. As the energy dissipated, the Moon's rotation slowed until a single spin on its axis took the same amount of time as one trip around Earth."
      - "Each time that the Moon completes a turn, it also orbits the Earth once, keeping its far side perpetually hidden."
