  - id: s6
    tier: 1
    title: Origin of the Moon in a giant impact near the end of the Earth's formation
    publisher: Nature 412, 708–712 — Canup & Asphaug
    url: https://doi.org/10.1038/35089010
    doi: 10.1038/35089010
    year: 2001
    accessed: 2026-09-12
    # SỬA 2026-09-12 bởi science-editor ở vòng 2 (bước 4). Bản trước ghi
    # "TOÀN VĂN VÀ ABSTRACT KHÔNG ĐỌC ĐƯỢC" — sai dữ kiện. Xem E8/E9 ở
    # checks/mat-trang.yaml. Giữ lại lịch sử này vì lượt sau sẽ cần biết vì
    # sao phạm vi dùng của s6 rộng ra.
    abstract_read: true
    abstract_read_at: 2026-09-12
    abstract_read_how: >
      curl doi.org/10.1038/35089010 với User-Agent trình duyệt, theo chuyển
      hướng tới nature.com/articles/35089010. Trả 200. Abstract hiển thị đầy
      đủ ngoài cổng đăng nhập; chỉ TOÀN VĂN mới nằm sau tường phí.
    passages:
      - "The Moon is generally believed to have formed from debris ejected by a large off-centre collision with the early Earth"
      - "This class of impacts involves a smaller—and thus more likely—object than previously considered viable, and suggests that the Moon formed near the very end of Earth's accumulation."
    limitation: >
      ĐỌC ĐƯỢC ABSTRACT, KHÔNG đọc được toàn văn. Metadata đã đối chiếu qua
      Crossref ngày 2026-09-12: đúng tiêu đề, đúng tác giả Canup và Asphaug,
      đúng Nature tập 412 trang 708–712, năm 2001.

      Phạm vi dùng: mọi mệnh đề mà ABSTRACT phát biểu, tức gồm cả cụm
      "generally believed" — đây là chỗ chống lưng bậc 1 cho mức dè dặt
      "Giả thuyết được ủng hộ nhiều nhất" của bài. KHÔNG trích số nào nằm
      trong toàn văn, vì toàn văn vẫn chưa đọc được.

      Ràng buộc này neo vào TÌNH TRẠNG ĐỌC ĐƯỢC, không neo vào một giá trị
      chết. Lượt sau đọc được toàn văn thì nới tiếp; đọc không được nữa thì
      siết lại. Đừng chép lại kết luận của lượt này mà không tự tải.

  - id: s7
    tier: 1
    title: Stabilization of the Earth's obliquity by the Moon
    publisher: Nature 361, 615–617 — Laskar, Joutel & Robutel
    url: https://doi.org/10.1038/361615a0
    doi: 10.1038/361615a0
    year: 1993
    accessed: 2026-09-12
    # SỬA 2026-09-12 bởi science-editor ở vòng 2 (bước 4). Xem E8/E9 ở
    # checks/mat-trang.yaml. Tiền đề của lệnh chặn cũ đã đổ.
    abstract_read: true
    abstract_read_at: 2026-09-12
    abstract_read_how: >
      curl doi.org/10.1038/361615a0 với User-Agent trình duyệt, theo chuyển
      hướng tới nature.com/articles/361615a0. Trả 200. Abstract hiển thị đầy
      đủ ngoài cổng đăng nhập.
    passages:
      - "In its present state, the Earth avoids this chaotic zone and its obliquity is essentially stable, exhibiting only small variations of ± 1.3° around the mean value of 23.3°."
      - "But if the Moon were not present, the torque exerted on the Earth would be smaller, and the chaotic zone would then extend from nearly 0° up to about 85°."
      - "Thus, had the planet not acquired the Moon, large variations in obliquity resulting from its chaotic behaviour might have driven dramatic changes in climate."
      - "In this sense one might consider the Moon to act as a potential climate regulator for the Earth."
    limitation: >
      ĐỌC ĐƯỢC ABSTRACT, KHÔNG đọc được toàn văn. Metadata đã đối chiếu qua
      Crossref ngày 2026-09-12: đúng Laskar, Joutel & Robutel, Nature 361,
      615–617, 1993.

      Con số 0°–85° NAY ĐÃ XÁC MINH TỪ NGUỒN GỐC, nguyên văn ở `passages`.
      Nó không còn là con số "sống sót nhờ được chép lại"; phép so với 10^14
      vi sinh vật ở bản trước KHÔNG còn đúng và đã bỏ.

      Nhưng nó vẫn KHÔNG vào bài lần này, vì lý do biên tập chứ không phải
      lý do xác minh: đó là kết quả PHẢN THỰC của một mô hình ("if the Moon
      were not present"), và Laskar tự phát biểu ở mức "might have" /
      "potential". Trình bày tử tế cần cả mệnh đề điều kiện lẫn mức dè dặt —
      chỗ mà bài 599/600 từ không có. Xem ràng buộc B10 ở checks.

      Khi dùng, phải mang theo NGUYÊN mệnh đề điều kiện. Nêu trần "độ nghiêng
      trục Trái Đất có thể biến thiên 0°–85°" là bỏ mất chữ "nếu không có Mặt
      Trăng" — sai hẳn nghĩa.

      Lưu ý đối chứng: "± 1.3° quanh 23,3°" của Laskar và "22.1–24.5 degrees"
      của s8 là cùng một khoảng, dựng từ hai hướng độc lập.

  - id: s8
    tier: 2
    title: Milankovitch (Orbital) Cycles and Their Role in Earth's Climate
    publisher: NASA Science
    url: https://science.nasa.gov/science-research/earth-science/milankovitch-orbital-cycles-and-their-role-in-earths-climate/
    accessed: 2026-09-12
    passages:
      - "Over the last million years, it has varied between 22.1 and 24.5 degrees with respect to Earth's orbital plane."
      - "Earth's axis is currently tilted 23.4 degrees, or about half way between its extremes, and this angle is very slowly decreasing in a cycle that spans about 41,000 years."
    note: >
      Trang này cho KHOẢNG biến thiên thật của độ nghiêng, nhưng KHÔNG quy nó
      cho Mặt Trăng. Việc quy nhân quả phải dựa vào s7, và s7 chỉ chống lưng
      được mệnh đề định tính. Nên bài nói: độ nghiêng dao động trong khoảng
      hẹp 22,1–24,5° (s8) và Mặt Trăng là thứ giữ nó ổn định (s7) — hai câu,
      hai nguồn, không gộp thành một con số nhân quả.

