  replacement_text:

    R1:
      replaces: >-
        "Tập luyện đều đặn cải thiện chức năng nội mô, và đây được xem là một
        trong những cơ chế trung tâm giải thích vì sao vận động hạ được huyết áp:
        các phân tích tổng hợp cho thấy mức giảm khoảng 5–8 mmHg huyết áp tâm thu
        ở người tăng huyết áp — tương đương một số thuốc đơn trị liệu."
      text: |
        Tập luyện đều đặn cải thiện chức năng nội mô, và đây được xem là một trong
        những cơ chế giải thích vì sao vận động hạ được huyết áp. Phân tích tổng
        hợp 93 thử nghiệm của Cornelissen và Smart (2013) cho thấy ở nhóm người
        **đã tăng huyết áp**, tập bền bỉ hạ huyết áp tâm thu trung bình **8,3
        mmHg** (giới hạn tin cậy 6,0–10,7) và huyết áp tâm trương 5,2 mmHg. Ở
        người huyết áp bình thường, mức giảm nhỏ hơn hẳn — 3,5 mmHg tâm thu.

    R2:
      inserts: >-
        mục mới CÓ TIÊU ĐỀ, đặt sau mục "Khuyến nghị hiện hành" và TRƯỚC dòng
        miễn trừ y tế. Câu chống chỉ định cũ ở cuối mục "Khuyến nghị hiện hành"
        được gỡ khỏi chỗ cũ và thay bằng mục này.
      mandatory: true
      note: >
        Câu về chống chỉ định y tế phải là nguyên văn của editor. Người khác diễn
        đạt lại thì nó không còn là câu đã qua gate.
      text: |
        ## Vận động không thay thế thuốc đang dùng

        Mức hạ huyết áp nhờ tập luyện có thể sánh với một thuốc hạ áp đơn trị, và
        chính điều đó khiến một số người nghĩ tới chuyện bỏ thuốc. **Đừng tự bỏ.**
        Các khuyến cáo điều trị xếp vận động là biện pháp *đi kèm* thuốc, không
        phải biện pháp thay thế; ngừng thuốc hạ áp đột ngột có thể làm huyết áp
        bật lên cao hơn trước và làm tăng nguy cơ đột quỵ. Nếu tập luyện đã đưa
        huyết áp của bạn xuống, đó là lý do để bác sĩ cân nhắc chỉnh liều — và
        việc chỉnh liều là của bác sĩ.

        Hãy đi khám trước khi bắt đầu nếu bạn có bệnh tim mạch đã biết, tăng huyết
        áp chưa kiểm soát, đái tháo đường, hoặc đã lâu không vận động.

        **Ngừng tập và đi khám ngay nếu khi gắng sức bạn thấy:** đau hoặc tức
        ngực, khó thở nhiều hơn hẳn so với mức gắng sức đang làm, choáng váng hoặc
        ngất, tim đập không đều, hoặc đau lan lên hàm, cổ hay cánh tay.

    R3:
      replaces: >-
        "Trong các nghiên cứu đoàn hệ lớn, đây là một trong những yếu tố dự báo tử
        vong do mọi nguyên nhân mạnh nhất — mạnh hơn cả hút thuốc, tăng huyết áp
        hay đái tháo đường trong một số phân tích."
      text: |
        Trong các nghiên cứu đoàn hệ lớn, đây là một trong những yếu tố dự báo tử
        vong do mọi nguyên nhân mạnh nhất. Ở đoàn hệ của Mandsager và cộng sự
        (2018), nguy cơ tử vong của nhóm thể lực kém nhất cao gấp **5,0 lần** nhóm
        thể lực đỉnh cao, trong khi hút thuốc làm tăng nguy cơ 1,4 lần và đái tháo
        đường 1,4 lần. Cần đọc con số ấy cho đúng: 5,0 là khoảng cách giữa hai
        **cực** của thang thể lực, còn 1,4 là mức tăng do **có hay không có** một
        yếu tố nguy cơ — hai phép so khác loại. Kết luận mà nguồn cho phép rút ra
        là thể lực kém "sánh ngang hoặc hơn" các yếu tố nguy cơ kinh điển, không
        phải "quan trọng hơn bỏ thuốc lá".

