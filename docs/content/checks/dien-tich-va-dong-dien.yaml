# Mọi nguồn đều được MỞ TRỰC TIẾP trong lượt này, không đọc qua bản tóm tắt của
# máy tìm kiếm. Hai URL phải sửa: swpc.noaa.gov → spaceweather.gov (301), và
# đoạn "inward current" nằm ở NBK10879 chứ KHÔNG ở NBK11098 như kết quả tìm
# kiếm gợi ý — đã kiểm cả hai trang trước khi ghi.

claims:
  - claim: "Dòng điện là điện tích đang chuyển động; chính chuyển động ấy sinh ra từ trường"
    sources: [s1, "nội-bộ:tu-truong-va-luc-hap-dan"]
    verdict: verified
    severity: null

  - claim: "e là lượng điện tích trong một electron; proton mang cùng độ lớn, dấu ngược"
    sources: [s2]
    verdict: verified
    evidence: "\"the amount of electric charge in a single electron (negative) or proton (positive)\""

  - claim: "e = 1,602176634 × 10⁻¹⁹ C từ 20/5/2019; sai số chuẩn '(exact)'"
    sources: [s1, s2, s4]
    verdict: verified
    evidence: "Trang CODATA 2022 của NIST ghi cả 'Standard uncertainty' lẫn 'Relative standard uncertainty' là '(exact)'."

  - claim: "Một coulomb gom khoảng 6,241 × 10¹⁸ điện tích nguyên tố"
    sources: [s2]
    verdict: verified
    arithmetic: "1 / 1,602176634e-19 = 6,2415090744 × 10¹⁸ — khớp con số NIST và khớp cách bài diễn đạt ('nghịch đảo con số ấy')."

  - claim: "Định nghĩa ampere trước 2019 — hai dây song song dài vô hạn, 2 × 10⁻⁷ N/m"
    sources: [s2]
    verdict: verified
    evidence: "Bản nháp trích dịch, và dấu ba chấm trong bài đúng chỗ lược 'of negligible circular cross-section'. Không lược mất mệnh đề nào làm đổi nghĩa."

  - claim: "Định nghĩa cũ hỏng hai đường: không hiện thực hoá được, và neo đơn vị điện vào chuẩn khối lượng"
    sources: [s2]
    verdict: verified
    severity: null
    note: >
      Vế một trích thẳng ("could not be physically realized according to its own
      definition"). Vế hai là diễn giải của "defining an electrical unit through
      mechanical concepts proved unsatisfactory" — hợp lệ vì newton trên mét
      quy về kilogram, và bài tự đóng vòng lập luận ấy ở mục cân Kibble bằng
      nguồn s6. Không nâng mức chắc chắn quá nguồn.

  - claim: "Định nghĩa BIPM hiện hành của ampere, trích nguyên văn"
    sources: [s1]
    verdict: verified
    evidence: "Đối chiếu từng chữ với trang BIPM, kể cả 'tức A·s' và 'trong đó giây được định nghĩa qua ΔνCs'."

  - claim: "Một ampere = một coulomb qua một điểm trong một giây"
    sources: [s1, s2]
    verdict: verified

  - claim: "Chừng 6 × 10¹⁸ electron qua một điểm mỗi giây"
    sources: [s3]
    verdict: verified
    evidence: "\"about 6 quintillion electrons ... per second\" — 'quintillion' thang ngắn = 10¹⁸; 'tỉ tỉ' tiếng Việt = 10¹⁸."

  - claim: "Chiều quy ước từ điện thế cao sang thấp, ngược chiều electron; Franklin đoán sai"
    sources: [s14]
    verdict: verified
    severity: S4
    note: >
      Nguồn bậc 3. Bài đã nêu tên nguồn ngay trong câu ("như Engineering
      LibreTexts nói thẳng"), đúng cách xử lý nguồn bậc 3 — người đọc thấy được
      trọng lượng của phát biểu. Không cần sửa.

  - claim: "Tia sét điển hình ~300 triệu V, ~30.000 A; điện dân dụng chuẩn Mỹ 120 V, 15 A"
    sources: [s7]
    verdict: verified
    severity: S4
    finding: >
      Con số đúng, cách nói sai nhẹ: bản nháp viết tia sét "MANG chừng 300 triệu
      volt". Volt là hiệu điện thế, không phải thứ được mang theo. NWS viết
      trung tính hơn: "A typical lightning flash IS about 300 million Volts and
      about 30,000 Amps".
    action: 'Đổi "mang chừng" → "vào khoảng", giữ nguyên hai con số và nhãn "chuẩn Mỹ".'

  - claim: "Điện tích tách ra do chuyển động không khí và va chạm giữa các hạt giáng thuỷ; vùng âm giữa mây làm mặt đất nhiễm điện dương"
    sources: [s8]
    verdict: verified
    evidence: >
      Đây là claim suýt mất. Trang weather.gov/safety/lightning-science (s9) chỉ
      có câu về không khí mất tính cách điện, KHÔNG có cơ chế tách điện tích —
      phải sang trang science-overview (s8) mới có: "Air movements and collisions
      between the various types of precipitation in the middle of the cloud cause
      the precipitation particles to become charged."

  - claim: "Sét là lúc khả năng cách điện của không khí sụp đổ"
    sources: [s9]
    verdict: verified

  - claim: "SET: bất định vài phần trăm triệu ở hàng chục triệu electron mỗi giây, kỳ vọng còn cải thiện"
    sources: [s5]
    verdict: partially-supported
    severity: S3
    finding: >
      Hai vế định lượng và vế "expected to improve" đều trích đúng nguyên văn.
      NHƯNG bản nháp gắn thêm mốc "tính tới tháng 9/2026" vào phát biểu của
      NIST, mà trang NIST không mang ngày tháng nào. Đó là một claim date-bound
      với cái ngày do người viết cấp — đúng loại lỗi docs/content-rules.md mô tả
      ở mục "Ước lượng điểm": con số bị tách khỏi năm của nó, hoặc gắn vào một
      năm không phải của nó.
    action: 'Bỏ cụm "tính tới tháng 9/2026". Ngày truy cập thuộc về bảng Source, không thuộc thân bài.'

  - claim: "100 thiết bị SET đồng bộ ở 10⁹ chu kỳ/giây chỉ cho dòng cỡ nanoampere"
    sources: [s5]
    verdict: verified
    arithmetic: "100 × 10⁹ × 1,602e-19 = 1,602 × 10⁻⁸ A = 16 nA — nằm trong 'range of nanoamps'."

  - claim: "Câu picoampere ở 100 triệu chu kỳ/giây của NIST"
    sources: [s5]
    verdict: contradicted
    severity: S2
    finding: >
      NGUỒN tự sai, không phải bài sai. 10⁸ × e = 1,6 × 10⁻¹¹ A = 16 pA, lệch 16
      lần so với "khoảng một picoampere". Bảng nguồn cũ đã loại câu này; lượt
      dựng lại tính độc lập và ra cùng kết luận.
    action: "Tiếp tục KHÔNG dùng. Bản nháp đã không dùng — không phải sửa gì."

  - claim: "Bão Mặt Trời gia tốc hạt tích điện vào không gian; hạt đổ xuống hai vùng cực tạo cực quang"
    sources: [s11, "nội-bộ:cuc-quang"]
    verdict: verified

  - claim: "Biến thiên thông lượng từ sinh dòng trong lưới điện; bão hoà lõi máy biến áp; 13/3/1989 mất điện chín giờ ở Canada, mất một máy biến áp"
    sources: [s10]
    verdict: verified
    evidence: >
      Cả ba vế trích đúng nguyên văn SWPC, kể cả cách SWPC tự đặt ngoặc kép
      quanh "exciting current". Mốc 13/3/1989 lấy từ chính SWPC ("a nine-hour
      blackout in Canada and a transformer loss (13 March 1989)"), không lấy từ
      các con số thiệt hại lưu hành trên báo — nên bài không mang theo con số
      6 triệu người hay 13,2 triệu USD mà SWPC không nói.

  - claim: "Dòng 'vào' tế bào = điện tích dương đi vào, tức cation vào hoặc anion ra; dòng vào nhanh rồi dòng ra chậm hơn, có trễ; Na⁺ khởi phát điện thế hoạt động"
    sources: [s12]
    verdict: verified
    evidence: "Trích đúng nguyên văn NBK10879, kể cả phần trong ngoặc đơn của chính sách giáo trình."

  - claim: "Hodgkin và Huxley mô tả định lượng dòng qua màng, 1952"
    sources: [s13]
    verdict: verified
    note: "Chỉ dùng ở mức tiêu đề + năm, đúng ràng buộc cũ. DOI resolve: 10.1113/jphysiol.1952.sp004764."

  - claim: "Cân Kibble: trọng lượng vật thử bù trừ bởi lực do dòng trong cuộn dây đặt trong từ trường; cuộn dây có dòng thành nam châm điện có cường độ tỉ lệ dòng"
    sources: [s6]
    verdict: verified

