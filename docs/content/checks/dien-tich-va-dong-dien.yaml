editor_pass:
  reviewed_at: 2026-09-06
  verdict: approve-with-fixes-applied
  rounds_used: 1   # trần là 2

  findings:
    - id: E1
      severity: S2
      where: "mục Ampere, câu định nghĩa cũ"
      finding: >
        LỖI DO CHÍNH LƯỢT RÚT GỌN NÀY SINH RA, không có trong bản nháp gốc.
        Khi nén câu định nghĩa cũ, bản rút gọn viết hai dây "HÚT NHAU bằng
        2 × 10⁻⁷ newton trên mỗi mét". Nguồn NIST chỉ nói "would produce
        between these conductors a force" — không nói chiều lực. Hai dây song
        song hút nhau khi dòng cùng chiều và ĐẨY nhau khi ngược chiều, mà định
        nghĩa cũ không quy định chiều dòng. "Hút nhau" vì thế là một claim vật
        lý được thêm vào, sai trong một nửa trường hợp.
      action: 'Sửa thành "sinh giữa chúng \"một lực bằng 2 × 10⁻⁷ newton trên mỗi mét chiều dài\"". ĐÃ SỬA.'
      lesson: >
        Đúng loại lỗi mà docs/content-rules.md cảnh báo ở mục "Rút gọn KHÔNG
        được đụng vào": câu ngắn hơn nghe dứt khoát hơn, và sự dứt khoát đó
        không có trong nguồn. Rút gọn phải đi qua gate accuracy lần nữa, không
        được coi là thao tác biên tập thuần hình thức.

    - id: E2
      severity: S3
      where: "mục Ampere, câu cân Kibble"
      finding: >
        Bài nói khối lượng suy ra từ "dòng và hiệu điện thế", nhưng đoạn nguồn
        s6 ghi ở bước 1 chỉ nói tới dòng. Vế điện áp khi đó là dưới mức dẫn nguồn.
      action: >
        Mở lại trang NIST và lấy thêm hai đoạn: "The resulting induced voltage
        is measured" và "solving for mass, m = IV/gν". Vế điện áp có nguồn.
        Bảng nguồn đã cập nhật. Câu trong bài GIỮ NGUYÊN.

    - id: E3
      severity: null
      where: "lede"
      finding: >
        Đối chiếu kho với chính nó theo docs/content-rules.md ("kho tự mâu
        thuẫn là máy dò lỗi rẻ nhất"): bài `tu-truong-va-luc-hap-dan` đã
        publish ghi trong bảng so sánh "Nguồn sinh ra: Điện tích **đang chuyển
        động**" và "nếu các điện tích bên trong không chuyển động thành dòng,
        sẽ không sinh ra từ trường nào cả". Khớp hoàn toàn với lede bài này.
        Không có mâu thuẫn nội kho.

  # Những gì bị CẮT ở lượt này, và vì sao. Ghi lại để lần refresh sau không
  # tưởng đây là thiếu sót cần "bổ sung lại cho đủ".
  cut_for_length_not_sourcing:
    - claim: "Vận chuyển đơn electron (SET) — bất định vài phần trăm triệu, 100 thiết bị chỉ cho cỡ nanoampere"
      source: s5
      reason: >
        Còn nguồn, còn đúng. Cắt vì trần 600 từ, và vì đây là hiện trạng R&D
        đo lường — thuộc bài về ampere hoặc về chuẩn đo, không thuộc mục từ
        định nghĩa điện tích. s5 vì thế KHÔNG nằm trong bảng Source của bài.
    - claim: "Dòng cảm ứng địa từ trong lưới điện; 13/3/1989 mất điện chín giờ ở Canada"
      source: s10
      reason: >
        Còn nguồn, còn đúng. Cắt vì trần độ dài; thuộc bài về thời tiết không
