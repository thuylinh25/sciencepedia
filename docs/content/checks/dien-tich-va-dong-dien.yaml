# Fact-check — dien-tich-va-dong-dien
#
# DỰNG LẠI ngày 2026-09-06 cùng lượt với bảng nguồn.
#
# Khác với lần chạy gốc: lần đó đây là fact-check TRƯỚC khi viết (pre-draft) và
# verdict là `pass`. Lần này văn xuôi đã tồn tại, nên chạy ở chế độ HỖN HỢP —
# vừa thẩm định bảng nguồn vừa đối chiếu từng câu của bản nháp với nguồn vừa
# dựng. Làm vậy vì thứ tự bước không đảo được nhưng thực tế đã đảo: giả vờ chưa
# có bản nháp rồi "thẩm định nguồn suông" sẽ bỏ lọt đúng loại lỗi mà
# docs/content-rules.md mô tả — citation resolve đúng bài mà bài đó không nói
# điều đang viết.

slug: dien-tich-va-dong-dien
mode: pre-draft + post-draft (bản nháp cứu được từ artifact)
