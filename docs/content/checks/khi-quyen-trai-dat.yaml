  - against: /articles/trai-dat
    claim_there: "**Khí quyển.** 78% nitơ, 21% oxy."
    verdict: consistent
    note: >
      Khớp s2 (78,08 / 20,95) ở mức làm tròn. Bài mới nêu bộ số đầy đủ hơn và
      thêm chữ "khô" — bổ sung, không mâu thuẫn. KHÔNG sửa `trai-dat`: bài đó
      không sai, chỉ nói gọn hơn.

  - against: /articles/cuc-quang
    claim_there: >
      "Cực quang là ánh sáng phát ra từ chính khí quyển Trái Đất, ở độ cao
      khoảng 100–400 km" và "Ở độ cao khoảng 90–150 km, chúng va vào nguyên tử
      oxy và phân tử nitơ".
    verdict: consistent
    note: >
      Cả hai khoảng nằm trọn trong 80–700 km mà s1 gán cho tầng nhiệt. Bài mới
      trả lời đúng câu hỏi mà bài kia bỏ ngỏ ("đó là tầng nào"), nên link giữa
      hai bài có nghĩa thật chứ không chỉ trùng chữ.
    ruling_for_draft: >
      Bài mới KHÔNG được nêu lại khoảng 100–400 km (đó là claim của bài kia,
      có nguồn riêng của nó). Chỉ nói cực quang xảy ra trong tầng nhiệt — điều
      s1 phát biểu — rồi dẫn sang.

  - against: /articles/nguyen-nhan-cua-mua
    claim_there: >
      "đỉnh nhiệt độ đến chậm một tới hai tháng, vì đất và nước biển cần thời
      gian tích nhiệt"
    verdict: consistent
    note: >
      Không giao nhau về claim. Nhưng nó khớp NGHĨA với s1 ("most of the heat
      found in the troposphere is generated by the transfer of energy from
      Earth's surface"): cả hai bài cùng nói khí quyển thấp được sưởi TỪ DƯỚI
      LÊN. Đây là chỗ link có lý do, không phải chỗ nhồi từ khoá.

  - against: /articles/sao-kim
    claim_there: "Khí quyển Sao Kim gồm 96% CO₂"
    verdict: consistent
    note: >
