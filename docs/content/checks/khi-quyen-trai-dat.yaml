findings:
  - id: F1
    severity: S3
    verdict: partially-supported
    claim: "Chín đoạn trích trong bản đầu của bảng nguồn được ghi là nguyên văn"
    evidence: >
      Script dò nguyên văn báo 9/48 đoạn KHÔNG tìm thấy. Cả 9 đều là lỗi chép
      lại, không phải bịa: (a) chữ số dưới bị nuốt — trang in "CO 2", "N 2",
      "H 2 O", bản chép ghi "CO2", "N2", "H2O"; (b) EPA nhúng mục từ điển vào
      GIỮA câu thân bài, nên "The lowest layer, the troposphere, extends from…"
      chưa bao giờ tồn tại thành một câu liền trên trang; (c) ba ô số của NOAA
      ("Global Monthly Mean CO 2", "May 2026: 428.73 ppm") là ba nút DOM rời,
      bản chép nối chúng bằng dấu gạch ngang; (d) hai chỗ sai dấu cách và dấu
      phẩy so với trang.
    ruling: >
      ĐÃ SỬA bảng nguồn: mọi đoạn trích ghi lại đúng dạng trang thật in ra, kể
      cả chữ số dưới rời và lỗi thiếu dấu cách "kilo-Pascals,and h" của NASA
      Glenn. Chạy lại: 48/48 khớp.
      Vì sao đáng ghi thành một finding chứ không sửa lặng lẽ: không con số
      hay mệnh đề nào bị đổi nghĩa trong 9 chỗ đó, nhưng "nguyên văn" là thứ
      lượt sau sẽ TIN mà không kiểm lại. Một bảng nguồn nói dối về mức nguyên
      văn của chính nó thì lần sau không ai biết chỗ nào đã được chỉnh tay.
    applied: true

  - id: F2
    severity: S2
    verdict: contradicted
    claim: 'UCAR (s6): "Carbon dioxide naturally composes about 0.03% of the atmosphere"'
    evidence: >
      0,03% = 300 ppm. NOAA GML (s3) đo trung bình tháng toàn cầu 428,73 ppm
      cho tháng 5/2026, tức 0,0429%. Con số của UCAR thấp hơn thực tế 43%.
      Chính câu đó của UCAR còn nói tiếp "but the amount is increasing due to
      the burning of fossil fuels" — nguồn tự biết con số của mình động, mà
      vẫn in nó không kèm năm.
    ruling: >
      CẤM dùng. Và ghi lại làm ví dụ: đây đúng là cơ chế hỏng mà
      docs/content-rules.md mô tả ở mục "Ước lượng điểm không đặt vào tiêu đề"
      — một con số bị tách khỏi năm của nó rồi sống mãi. Chỉ s3 được cấp con
      số CO₂, và luôn kèm tháng + năm + mệnh đề "sơ bộ" của chính NOAA.
    applied: true

  - id: F3
    severity: S3
    verdict: contradicted
    claim: 'NASA (s2): "currently at nearly 412 parts per million" và "a 47 percent increase"'
    evidence: >
      Trang xuất bản 2019-10-09 (JSON-LD), chữ "currently" trong câu không đi
      kèm năm nào. 412 ppm và 47% đều là số của khoảng 2019; xem N3.
    ruling: >
      CẮT cả hai khỏi bài. Từ s2 chỉ lấy: bộ thành phần khô, cụm 0,04% khí
      vết, và mốc 280 ppm tiền công nghiệp (con số này không gắn ngày theo
      cùng nghĩa — nó là mức của một thời kỳ đã kết thúc, không phải mức "hiện
      nay"). Cùng một trang có thể vừa là nguồn tốt cho câu này vừa là nguồn
      hỏng cho câu kia; phân biệt theo TỪNG CLAIM, không theo trang.
    applied: true

  - id: F4
    severity: S3
    verdict: partially-supported
    claim: "Đỉnh tầng đối lưu ở 12 km (s1) hay 10 km (s5)"
    evidence: >
      s1: "on average, about 12 kilometers … with its height lower at Earth's
      poles and higher at the equator". s5: "about 10 km in altitude, although
      this height varies with latitude". Hai nguồn nêu hai trung bình khác
      nhau, và CẢ HAI đều tự nói đại lượng này biến thiên theo vĩ độ.
    ruling: >
      KHÔNG lấy trung bình, KHÔNG giấu một trong hai. Bài dùng đúng MỘT bộ số
      cho cả năm tầng — bộ của NASA (s1), vì nó khép kín và phủ hết năm tầng
      (N8) — VÀ nói rõ các ranh giới là trung bình, thấp hơn ở cực và cao hơn
      ở xích đạo. Chính sự lệch giữa hai cơ quan là bằng chứng cho mệnh đề
      "ranh giới không cố định", nên nó thuộc về nội dung bài chứ không phải
      một vết bẩn cần lau.
    applied: true

  - id: F5
    severity: S3
    verdict: unverifiable
    claim: "Dải ozon nằm ở độ cao nào"
    evidence: >
      EPA tự đưa hai giá trị trên CÙNG một trang: thân bài "about 9 to 18
      miles (15 to 30 km)", mục từ điển "approximately 15-40 kilometers
      (10-25 miles)". s1 không nêu con số nào.
    ruling: >
      CẮT con số. Bài chỉ nói "phần lớn ozon khí quyển nằm trong tầng bình
      lưu", điều mà cả s1 lẫn s5 đều nói. Theo tiền lệ F5 của
      cau-truc-ben-trong-trai-dat: một đại lượng có hai phiên bản trong cùng
      một nguồn thì chưa được kiểm, không phải "xấp xỉ như nhau".
    applied: true

  - id: F6
    severity: S3
    verdict: unsupported
    claim: 'NASA (s1): nhiệt độ tầng nhiệt tăng "due to the very low density of molecules found here"'
    evidence: >
      Không nguồn nào khác trong bảng phát biểu cơ chế này, và nó không phải
      cách giải thích thông thường (hấp thụ bức xạ tử ngoại xa / tia X). Mật
      độ thấp giải thích được vì sao NHIỆT LƯỢNG ở đó nhỏ, chứ tự nó không
      giải thích vì sao nhiệt độ TĂNG theo độ cao.
    ruling: >
