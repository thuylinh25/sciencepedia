numeric_checks:
  - id: N1
    claim: "78,08 + 20,95 + 0,93 + 0,04 = 100"
    computed: "99,96 + 0,04 = 100,00"
    verdict: verified
    note: >
      Bộ số của NASA tự khép kín. Đó là bằng chứng bốn con số thuộc cùng một
      phép kiểm kê, không phải bốn con số lượm từ bốn chỗ.

  - id: N2
    claim: "428,73 ppm quy ra phần trăm"
    computed: "428,73 / 10.000 = 0,0429%"
    verdict: verified
    severity: S4
    ruling: >
      Hệ quả phải biết: RIÊNG CO₂ tháng 5/2026 (0,0429%) đã LỚN HƠN con số
      0,04% mà s2 gán cho TOÀN BỘ khí vết. Không phải mâu thuẫn — 0,04% là
      cách làm tròn của một trang viết năm 2019 — nhưng bài KHÔNG được viết
      kiểu "CO₂ chỉ chiếm một phần nhỏ trong 0,04% khí vết", vì phát biểu đó
      sai về số học với dữ liệu hiện tại. Nêu 0,04% là "khí vết, theo cách
      NASA làm tròn", rồi nêu CO₂ riêng kèm tháng và năm.

  - id: N3
    claim: "Mức tăng CO₂ so với tiền công nghiệp"
    computed: "428,73 / 280 = 1,531 → +53,1%.  NASA (s2) viết +47%, ứng với 412/280 = 1,471."
    verdict: contradicted
    severity: S3
    ruling: >
      CẤM dùng lại con số "47%" của s2. Nó đúng với 412 ppm và sai với 428,73
      ppm. Bài cũng KHÔNG tự công bố "+53%": đó là phép chia của bài giữa hai
      nguồn khác nhau, và nêu nó thành một tỉ lệ tròn trịa là tạo ra một con
      số chưa ai kiểm. Cách đã duyệt: nêu hai con số kèm mốc của chúng (280
      ppm tiền công nghiệp theo NASA; 428,73 ppm tháng 5/2026 theo NOAA) và
      để người đọc tự thấy. Đúng bài học "tỉ số không nêu rõ tử/mẫu là dấu
      hiệu nó được đoán" trong docs/content-rules.md.

  - id: N4
    claim: "Chênh lệch CO₂ 12 tháng"
    computed: "428,73 − 427,04 = 1,69 ppm"
    verdict: verified
    note: >
      Dùng được, nhưng phải nói rõ đây là hiệu hai giá trị trung bình THÁNG 5
      của hai năm liền nhau, không phải "tốc độ tăng hằng năm" (NOAA có trang
      growth rate riêng mà lượt này không tra).

  - id: N5
    claim: "Áp suất còn một nửa ở độ cao chừng 5,5 km"
    computed: >
      Từ công thức của s4: p(0) = 101,401 kPa; p(5.500 m) = 50,600 kPa;
      tỉ số 0,4990. Dò nhị phân cho mốc đúng 50,00%: 5.485 m.
    verdict: verified
    computed_by_article: true
    ruling: >
      GIỮ, với ba ràng buộc: (a) nói rõ đây là số tính từ MÔ HÌNH khí quyển
      chuẩn của NASA Glenn, không phải số đo tại một chỗ cụ thể; (b) viết
      "chừng 5,5 km" chứ không "5.485 m" — độ chính xác giả tạo trên một mô
      hình trung bình là một dạng làm đẹp số liệu; (c) nêu cả tử lẫn mẫu
      (50,6 kPa so với 101,4 kPa ở mực nước biển).
      Suy ra "một nửa khối lượng khí quyển nằm dưới 5,5 km" thì ĐƯỢC, vì chính
      s4 phát biểu "The pressure of the air can be related to the weight of
      the air over a given location" — nhưng phải trình bày như một suy luận
      từ câu đó, không như một số đo độc lập.

  - id: N6
    claim: "Áp suất ở độ cao đỉnh Everest"
    computed: "p(8.800 m) = 31,75 kPa = 31,3% mức mực nước biển"
    verdict: verified
    severity: S4
    note: >
      EPA nêu Everest hai lần với hai độ chính xác: mục từ điển "8.8 km",
      thân bài "about 5.6 miles (9 km)". Đây là cùng một giá trị ở hai mức làm
      tròn, KHÔNG phải hai giá trị khác nhau — nên không rơi vào luật "một số
      có ba phiên bản thì chưa được kiểm". Nếu dùng thì dùng 8,8 km.
    ruling: >
      Được phép nhưng KHÔNG bắt buộc. Mô hình của s4 chỉ được hiệu chuẩn cho
      tầng đối lưu tới 11.000 m nên 8.800 m vẫn nằm trong miền của nó. Ưu tiên
      cắt nếu chạm trần độ dài: N5 đã nói xong cùng một ý bằng ít chữ hơn.

  - id: N7
    claim: "Suất giảm nhiệt 6,49 °C mỗi km"
    computed: "0,00649 °C/m × 1.000 = 6,49 °C/km. Kiểm chéo: 27 − 6,49 × 4 = 1,04 °C."
    verdict: verified
    note: >
      UCAR (s7, bậc 3, dựng độc lập) nói 27 °C ở mực nước biển cho "khoảng
      1 °C ở 4.000 m". Khớp tới 0,04 °C với công thức NASA. Đây là bằng chứng
      công thức của s4 đang được dùng đúng, KHÔNG phải một claim mới của bài —
      bài không nêu ví dụ 27 °C này.

  - id: N8
    claim: "Năm tầng của NASA có liền nhau không"
    computed: "0–12 · 12–50 · 50–80 · 80–700 · 700–10.000 km"
    verdict: verified
    note: >
      Không hở, không chồng. Một bộ ranh giới khép kín là điều kiện để bài
      dùng đúng MỘT bộ số, và đó là lý do bài lấy bộ NASA thay vì trộn với bộ
      của EPA (xem F4).

  - id: N9
    claim: "Đường Kármán 100 km nằm ở đâu trong chính hệ tầng của NASA"
    computed: "100 km nằm trong khoảng 80–700 km, tức bên trong TẦNG NHIỆT."
    verdict: verified
    severity: S3
    ruling: >
      Đây là chỗ dễ hiểu sai nhất của cả bài, nên phải nói rõ: "mép không
      gian" KHÔNG phải đỉnh khí quyển. Theo chính s1, trên mốc 100 km vẫn còn
      tầng nhiệt và tầng ngoài. Bài phải gọi 100 km là MỐC QUY ƯỚC (s1 dùng
      chữ "delineation … to denote the transition point"), không gọi là ranh
      giới của khí quyển. Và 80 km mà McDowell đề xuất rơi đúng đáy tầng
      nhiệt — trùng hợp đáng nói, nhưng bài KHÔNG được diễn giải nó thành một
      cơ chế vật lý, vì s8 không nói vậy.

  - id: N10
    claim: "99,99997% khí quyển nằm dưới 100 km (s1)"
    verdict: unverifiable-by-us
    severity: S4
    note: >
      Không tái lập được: mô hình của s4 chỉ chạy tới 25 km, và lượt này không
      dựng được nguồn khối lượng khí quyển nào (NASA Earth Fact Sheet đang bảo
      trì — xem open_questions của bảng nguồn).
    ruling: >
      Được dùng, nhưng phải QUY VỀ NASA bằng tên ("NASA nêu…"), không để bài
      tự đứng ra bảo đảm. Đây là con số duy nhất trong bài mà lượt kiểm này
      không tự tính lại được.

