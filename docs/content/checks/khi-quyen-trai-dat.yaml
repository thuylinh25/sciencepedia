      thì phải nêu rõ mỗi con số là của hành tinh nào và đo theo đại lượng gì
      (Sao Kim: nguồn của bài kia; Trái Đất: phần mol không khí KHÔ, s3).
      KHÔNG được viết thành một tỉ số ("gấp hơn 2.000 lần") — đó là phép chia
      giữa hai đại lượng lấy từ hai bảng nguồn khác nhau, chưa ai kiểm.

  - against: /articles/song-buoc-song-tan-so-bien-do
