method: >
  Tải lại từng URL bằng curl trong CHÍNH lượt này, bóc thẻ HTML thành văn bản,
  rồi tìm NGUYÊN VĂN từng chuỗi trong `passages` bằng script — không đọc bảng
  nguồn rồi tin nó. Chuẩn hoá duy nhất được phép: gộp khoảng trắng liên tiếp
  và đổi dấu nháy cong thành nháy thẳng. KHÔNG chuẩn hoá chữ số dưới (CO 2 →
  CO2), vì làm vậy là sửa nguồn cho khớp bản chép chứ không phải ngược lại —
  xem F1.
  Kết quả: 48/48 đoạn trích của s1–s7 tìm thấy nguyên văn. s8 kiểm bằng
  Crossref (metadata) + abstract nguyên văn trên bản preprint arXiv.

