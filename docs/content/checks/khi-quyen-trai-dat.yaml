  residual_risk:
    - id: R1
      status: accepted-with-expiry      # phán quyết của science-editor 2026-09-10
      about: "Con số 'tới 4%' hơi nước ở tầng đối lưu thấp vùng nhiệt đới"
      problem: >
        Chỉ s6 (UCAR, BẬC 3) đỡ trực tiếp, và nó đứng MỘT MÌNH cho một claim định
        lượng — đúng thứ mà tier_limit của chính s6 trong file research cấm. Lập
        luận cũ rằng "khớp với s1 bậc 2" KHÔNG chặt: s1 ("99 percent of all water
        vapor…") nói hơi nước Ở ĐÂU, không nói BAO NHIÊU.
      why_not_blocking: >
        (1) Phát biểu dưới dạng CẬN TRÊN có hedge kèm đủ định ngữ phạm vi — "tới 4%
        ở tầng đối lưu thấp vùng nhiệt đới, chỉ còn dấu vết ở hai cực" — editor đã
        đối chiếu là bản dịch trung thành nguyên văn s6 ("up to", "lower
        troposphere", "near the tropics", "trace amounts"). Cận trên có phạm vi là
        dạng yếu nhất và an toàn nhất của một claim định lượng.
        (2) Không mệnh đề nào khác trong bài rút ra từ nó.
        (3) Cắt nó thì hỏng lý do tồn tại của ràng buộc bắt buộc số 9 — câu này
        giải thích vì sao chữ "khô" không phải chữ thừa.
      expires: 2027-03-31
      expiry_rule: >
        Hết hạn vào 2027-03-31 HOẶC lần sửa bài kế tiếp vì bất kỳ lý do gì — cái
        nào đến trước. Nó không được phép già đi âm thầm thành đồ cố định.
      next_turn_action: >
        Hoặc (a) dựng nguồn bậc 1–2 cho con số 4% — thử lại NOAA/NWS JetStream từ
        môi trường không bị 403, hoặc thay bằng AMS Glossary / IPCC / viện hàn lâm
        quốc gia — hoặc (b) hạ câu xuống định tính: "hơi nước tập trung ở tầng đối
        lưu thấp vùng nhiệt đới, chỉ còn dấu vết ở hai cực".

