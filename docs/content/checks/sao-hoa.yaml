    - id: HOA-4
      severity: S3
      claim: "Băng nước lộ thiên ở hai cực và băng ngầm ở vĩ độ trung bình"
      problem: >
        NASA viết băng nước nằm "just under the surface in the polar regions" — ngay
        DƯỚI bề mặt, không phải lộ thiên. Bài cũng gộp hai cực làm một, trong khi
        chỏm vĩnh cửu ở cực nam chủ yếu là băng CO2 phủ trên băng nước, còn cực bắc
        mới là băng nước lộ ra vào mùa hè. Một đơn giản hoá để lại mô hình sai về
        thứ người ta sẽ thấy nếu đứng ở đó.
      source_checked: "science.nasa.gov/mars/facts — đọc 2026-09-12"
      resolution: "Nói đúng vị trí băng theo nguồn."
    - id: HOA-5
      severity: S3
      claim: "(mục Địa hình cực đoan)"
      problem: >
        Gạch đầu dòng cuối cùng — "Hai vệ tinh nhỏ Phobos và Deimos" — nằm dưới tiêu
        đề "Địa hình cực đoan". Vệ tinh không phải địa hình. Lượt rà cấu trúc
        2026-09-11 đã nhận ra đây là dấu vết bài bị cắt giữa lúc đổi chủ đề; lượt này
        xác nhận từ phía nội dung: bài kết thúc mà không trả lời xong câu hỏi ở tiêu
        đề ("câu hỏi về nước" chưa được khép).
      source_checked: "đọc cột content, 2026-09-12"
      resolution: >
        Tách hai vệ tinh ra khỏi mục địa hình và viết phần khép quay lại câu hỏi về
        nước. Đây là việc của bước 1-3 pipeline, không phải một phép thay chuỗi.
    - id: HOA-6
      severity: S3
      claim: "(cả bài)"
      problem: >
        Một nguồn duy nhất, và nó chống lưng được gần như không claim nào của bài.
