  findings:
    - id: HOA-1
      severity: S2
      claim: "**Olympus Mons** — núi lửa cao 22 km, gần gấp ba đỉnh Everest"
      problem: >
        Tỉ số không khớp chính cặp số mà bài in ra: 22 / 8,848 = 2,49, tức gấp hai
        lần rưỡi, không phải gần gấp ba. Đây đúng mẫu "tỉ số chưa từng được tính"
        đã ghi trong corrections.md ở đợt Sao Mộc — cụm tỉ số được mượn từ một nguồn
        dùng chiều cao khác rồi dán cạnh một chiều cao do bài tự chọn.
        Còn một tầng sai nữa bên dưới, nghiêm trọng hơn con số: hai vế đo theo hai
        mốc khác nhau. 22 km là độ cao so với mốc chuẩn địa hình Sao Hoả, còn 8.848 m
        là độ cao Everest so với mực nước biển — mà Everest chỉ nhô lên khoảng 3-5 km
        so với cao nguyên quanh nó. So "từ chân tới đỉnh" của bên này với "so với mực
        nước biển" của bên kia thì tỉ số nào cũng vô nghĩa. Chính NASA cũng mắc lỗi
        ghép này trên trang của mình, nên chép lại tỉ số của NASA không cứu được.
      source_checked: "science.nasa.gov/mars/facts — đọc 2026-09-12; tự tính lại"
      resolution: "Tính lại tỉ số từ con số bài dùng, và nói rõ hai mốc đo."
    - id: HOA-2
      severity: S2
      claim: "Sao Hoả nhỏ, nên lõi nguội nhanh và từ trường toàn cầu tắt từ sớm. Không còn lá chắn, gió mặt trời bào mòn khí quyển suốt hàng tỉ năm."
      problem: >
        Một chuỗi nhân quả bốn mắt xích, phát biểu như sự thật đã xác lập, không
        nguồn nào gắn với bài nói tới. Trang Mars Facts của NASA chỉ nói Sao Hoả
        không còn từ trường toàn cầu và vỏ nam bán cầu còn từ tính dư — nó KHÔNG nối
        hai chuyện đó lại thành nguyên nhân của việc mất khí quyển.
        Quan trọng hơn: kho đã phán quyết đúng mệnh đề này rồi. Ngày 2026-09-10, khi
        sửa `cau-truc-ben-trong-trai-dat`, `science-editor` gỡ câu "từ trường giúp
        bảo vệ khí quyển" với lý do không passage nào chống lưng và vấn đề còn đang
        tranh cãi — dẫn chính Sao Kim làm phản ví dụ, một hành tinh không có từ
        trường nội tại mà vẫn giữ được khí quyển dày.
        Nên bài này đang phát biểu, ở mức chắc chắn cao hơn, đúng cái mệnh đề mà kho
        đã bỏ ở chỗ khác. Hai bài cùng kho trả lời khác nhau cho cùng một câu hỏi
        vật lý, và bài đứng sai lại là bài nói chắc hơn.
      source_checked: "science.nasa.gov/mars/facts — đọc 2026-09-12; đối chiếu docs/content/corrections.md mục 2026-09-10 và bài sao-kim trong chính lô này"
      resolution: >
        Viết lại thành thứ MAVEN thật sự đo được — tốc độ thoát khí đang diễn ra —
        và hạ mệnh đề nhân quả về từ trường xuống đúng mức một giả thuyết.
