  - claim: "Newton: mật độ trung bình Trái Đất gấp đôi mật độ đá bề mặt"
    computed: "5,513 / 2,7 = 2,04"
    verdict: verified
    note: "Phát biểu 'gấp đôi' của USGS đứng vững."
  - claim: "Lõi đặc gần gấp đôi manti (s1)"
    computed: "≈ 10,9 / 4,5 = 2,42"
    verdict: verified
    note: >
      Con số thật LỚN hơn "gần gấp đôi". Giữ nguyên chữ của USGS chứ không
      nâng lên "gấp 2,4 lần": nâng cấp độ chắc chắn của nguồn là lỗi cùng họ
