    không tồn tại, nhưng nó cũng KHÔNG tương đương một lượt duyệt độc lập.
    Nếu về sau có tiến trình editor thật, bài này nên được rà lại.

  findings:
    - id: E1
      severity: S2
      verdict: contradicted
