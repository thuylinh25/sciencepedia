findings:
  - id: F1
    severity: S3
    verdict: unverifiable
    claim: "wikidata_qid: Q3712 cho entity cấu trúc bên trong Trái Đất"
    evidence: >
      Special:EntityData/Q3712.json không trả về JSON hợp lệ — QID này không
      resolve. Tra wbsearchentities "internal structure of Earth" trả đúng một
      kết quả: Q1664027, nhãn en "internal structure of Earth", nhãn vi
      "Cấu trúc Trái Đất", mô tả "inner structure of the planet Earth,
      consisting of several concentric spherical layers".
    ruling: >
      SỬA bảng nguồn: Q3712 → Q1664027. Đây là một QID được ĐOÁN chứ không
      được tra, và nó lọt tới bảng nguồn — đúng loại lỗi mà bước 2 tồn tại để
      bắt. Q1664027 đã tra thật trong lượt này.
    applied: true
  - id: F2
    severity: S3
    verdict: partially-supported
    claim: "Vỏ chiếm 1% thể tích Trái Đất, manti 84%, lõi 15% (s2)"
    evidence: >
      Bộ ba này không khớp với bán kính trong CÙNG bảng nguồn: bán kính lõi
      3.471 km cho 16,2% thể tích, không phải 15%. Lệch 1,2 điểm phần trăm.
      Riêng "1%" cho vỏ thì tính ra 0,68% — làm tròn chấp nhận được ở bậc đó,
      nhưng nó đi kèm hai số kia trong cùng một câu của nguồn.
    ruling: >
      CẮT cả bộ ba khỏi bài. Không sửa thành 16% (đó là con số của bài, không
      của nguồn), không giữ 15% (không tái lập được từ chính bảng nguồn).
      Điểm "vỏ mỏng đến mức nào" chuyển sang dùng tỉ số Kola 12 km / 6.371 km
      = 0,19%, vì tỉ số đó dựng từ hai con số đã dẫn nguồn và ai cũng tính lại
      được.
    applied: true
  - id: F3
    severity: S3
    verdict: contradicted
    claim: 'NASA: "The inner core, a roughly 759-mile-thick (1,221-kilometer-thick) solid sphere"'
    evidence: >
      Chính NASA gọi nó là "solid sphere". Một quả cầu không có "độ dày"; và
      1.221 + 2.250 + 2.900 chỉ bằng 6.371 km nếu 1.221 là BÁN KÍNH. Chữ
      "thick" trong nguồn là lỗi diễn đạt của nguồn.
    ruling: >
      Bài viết "bán kính khoảng 1.221 km", KHÔNG chép chữ "dày". Chép nguyên
      chữ sai của nguồn không phải trung thực với nguồn — nó tạo ra một Trái
      Đất có bán kính 7.592 km.
    applied: true
  - id: F4
    severity: S4
    verdict: verified
    claim: "Bộ số của USGS (s1): 30 + 2.900 + 2.200 + 1.250"
    evidence: "Tổng 6.380 km, so với 12.750/2 = 6.375 km mà chính s1 nêu."
    ruling: >
      Không hành động. Lệch 5 km là dấu vết làm tròn của một trang phổ thông,
      không phải lỗi sự thật. Đây là lý do bài chọn bộ số NASA cho phần lõi
      (khép kín đúng) và nói rõ nguồn của từng bộ.
  - id: F5
    severity: S3
    verdict: unverifiable
    claim: "Góc của vùng tối sóng P"
    evidence: >
      Ba giá trị khác nhau ở ba chỗ: 103–140, 104–140, 103–142. Trang IRIS
      chuyên về sóng P không tự nêu góc nào.
    ruling: >
      CẮT. Chỉ dùng ~103° của sóng S — keypoint trên chính trang chuyên về
      sóng S. Một con số có ba phiên bản thì chưa được kiểm, không phải "xấp
      xỉ như nhau".
    applied: true
  - id: F6
    severity: S3
    verdict: unverifiable
    claim: "Năm Inge Lehmann phát hiện lõi trong"
    evidence: >
      IRIS (s5) ghi 1937; bài báo "P'" của bà thường được dẫn là 1936.
      aps.org trả 403, amnh.org trả CAPTCHA — không dựng được nguồn bậc 1–2
      trong lượt này.
    ruling: >
      CẮT khỏi bài. Bài vẫn nêu được rằng lõi trong phải phát hiện riêng, dựa
      vào hành vi sóng P và S (s2), mà không cần gán năm cho ai.
    applied: true
  - id: F7
    severity: S3
    verdict: verified
    claim: "6230 ± 500 K ở ranh giới lõi trong"
    evidence: >
      Nguyên văn abstract: "The temperature at the inner core boundary is
      EXPECTED to be close to the melting point of iron at 330 gigapascal";
      "Despite intensive experimental and theoretical efforts, there is LITTLE
      CONSENSUS on the melting behavior of iron at these extreme pressures";
      "WHEN EXTRAPOLATING to higher pressures, we conclude that the melting
      temperature of iron at the inner core boundary is 6230 ± 500 kelvin."
      Thí nghiệm chỉ tới 200 GPa, ranh giới ở 330 GPa.
    ruling: >
      GIỮ, nhưng bài BẮT BUỘC mang theo ba mệnh đề dè dặt: (a) đây là điểm
      nóng chảy của sắt, và nhiệt độ tại ranh giới chỉ được KỲ VỌNG gần bằng
      nó; (b) con số là NGOẠI SUY từ 200 GPa lên 330 GPa; (c) sai số ± 500 K.
      Viết "lõi trong nóng 6.230 K" là lỗi S2, và là đúng cái cách hỏng mà
      docs/content-rules.md gọi là "câu ngắn hơn nghe chắc chắn hơn".
    applied: true

