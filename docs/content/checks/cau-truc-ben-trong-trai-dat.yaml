  - id: s7
    url_status: 403
    verdict: verified
    how: >
      DOI đối chiếu Crossref: khớp tiêu đề, Science, tập 340, trang 464–466,
      2013-04-26, tác giả đầu Anzellini. Abstract lấy từ Europe PMC REST API
      truy vấn theo DOI. Câu "6230 ± 500 kelvin" nằm trong abstract của chính
      tác giả, không phải trong bản tóm tắt của biên tập.
      Đối chiếu độc lập thứ hai: bản tóm tắt biên tập trong metadata Crossref
      ("Hot Enough to Melt Iron") nói cùng một điều — ranh giới lõi trong/ngoài
      "largely controlled by the melting point of iron at ~330 GPa", và thí
      nghiệm nén tới 200 GPa. Hai bản độc lập, cùng con số áp suất.
