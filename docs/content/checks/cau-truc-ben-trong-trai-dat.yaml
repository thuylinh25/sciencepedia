      là bằng chứng chúng thuộc cùng một mô hình chứ không được lượm từ ba chỗ.
  - claim: "Quy đổi dặm sang km trong nguồn NASA"
    computed: "19 mi = 30,6 km · 3 mi = 4,8 km · 1.800 mi = 2.896,8 km · 1.400 mi = 2.253,1 km · 759 mi = 1.221,5 km"
    verdict: verified
    note: >
      Cả năm cặp đều nhất quán với con số km NASA in kèm. Nguồn không tự làm
