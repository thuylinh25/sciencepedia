# --- Vì sao bài đang publish ĐÁNG được làm mới (chứ không phải để yên) ----
# Đọc trang thật ngày 2026-09-12 rồi đối chiếu với bảng nguồn. Đây là các phát
# hiện về BÀI ĐÃ PUBLISH, không phải về bảng nguồn.
findings_on_existing_article:
  - id: E1
    severity: S2
    claim_on_page: 'Hai câu trên trang: "Kepler mô tả hiện tượng. Newton giải thích nguyên nhân." và "Newton chứng minh được vì sao các hành tinh phải chuyển động đúng như Kepler đã quan sát."'
    verdict: partially-supported
    evidence: >
      s9 chỉ nói: "Kepler's laws were instrumental in Isaac Newton's development
      of his theory of universal gravitation, which explained the unknown force
      behind Kepler's third law." Phạm vi hẹp hơn hẳn chữ "chứng minh… đúng như
      Kepler đã quan sát". Trên s8 (Basics of Space Flight ch.3) đã TÌM và
      KHÔNG THẤY câu nào dạng "Kepler mô tả thế nào, Newton giải thích vì sao".
    note: >
      Cùng họ với lỗi Pollack 1996 ghi ở docs/content-rules.md: câu văn tự tin,
      nguồn có thật, nhưng nguồn không nói điều đang viết.
  - id: E2
    severity: S2
    claim_on_page: "ở những điều kiện cực đoan như vận tốc gần bằng tốc độ ánh sáng hoặc gần lỗ đen, vật lý Newton phải được thay thế bằng thuyết tương đối của Einstein"
    verdict: partially-supported
    evidence: >
      Vế tốc độ có nguồn (s4). Vế "gần lỗ đen" KHÔNG có trong bảng nguồn nào —
      và nó lẫn hai lý thuyết khác nhau: trường hấp dẫn mạnh là địa hạt của
      thuyết tương đối RỘNG, không phải thuyết tương đối hẹp mà kho đang có bài.
      Đồng thời bài BỎ MẤT điều kiện thứ hai mà s4 nêu ngay trong cùng câu: vật
      phải lớn hơn cỡ phân tử (~10⁻⁹ m).
  - id: E3
    severity: S3
    claim_on_page: 'Hai phát biểu trên trang: "Một vật sẽ giữ nguyên trạng thái đứng yên hoặc chuyển động thẳng đều nếu không có lực tổng hợp tác dụng lên nó." và "Lực càng lớn, vật càng tăng tốc nhanh."'
    verdict: partially-supported
    evidence: >
      Phát biểu định luật I có chữ "tổng hợp", nhưng phát biểu định luật II thì
      mất — s6 để chữ NET ngay trong câu ("net external force"). Không đồng
      nhất trong cùng một bài, và vế mất chữ là vế dễ hiểu sai.
  - id: E4
    severity: S3
    claim_on_page: "Với mọi lực tác dụng luôn tồn tại một lực phản tác dụng có cùng độ lớn và ngược chiều."
    verdict: partially-supported
    evidence: >
      Thiếu mệnh đề mang toàn bộ giá trị của định luật III: hai lực đặt lên HAI
      vật khác nhau nên không triệt tiêu (s3 "Notice that the forces are exerted
      on different objects"; s7 "they do not cancel each other"). Hai ví dụ của
      bài (chân–mặt đất, tên lửa–khí) thì đúng, nhưng người đọc không có câu
      giúp họ đọc ra điều đúng ấy.
  - id: E5
    severity: S3
    claim_on_page: 'Định luật nổi tiếng nhất của Newton: F = ma'
    verdict: unsupported
    evidence: >
      Không nguồn nào xếp hạng mức nổi tiếng. Nặng hơn: s1 phát biểu định luật
      II bằng động lượng ("force to be equal to change in momentum per change in
      time") và s6 cho F = dp/dt, tức F = ma là TRƯỜNG HỢP RIÊNG khi khối lượng
      không đổi. Trình bày F = ma như phát biểu gốc duy nhất là hạ mức tổng quát
      của nguồn.
  - id: E6
    severity: S3
    claim_on_page: 'Có. Chúng vẫn được sử dụng để: Thiết kế cầu đường và phương tiện giao thông. Tính toán quỹ đạo vệ tinh và tên lửa. Mô phỏng chuyển động trong kỹ thuật.'
    verdict: unsupported
    evidence: >
      Danh sách ứng dụng không truy về nguồn nào trong bảng. Thay được bằng ví
      dụ CÓ nguồn: Wright 1903 Flyer (s3), gia tốc hướng tâm của hành tinh (s8).
  - id: E7
    severity: S4
    claim_on_page: 'Mục nguồn số 7: The fishy blunder that nearly prevented Newton''s masterpiece from being published — The Royal Society (2012)'
    verdict: unverifiable
    evidence: >
      Không đọc trong lượt này. Bảng nguồn mới dùng một bài khác của chính
      Royal Society (s10) có hai mốc 1686/1687 đọc được nguyên văn.

# --- Phát hiện về BẢNG NGUỒN (việc chính của bước 2) ----------------------
findings:
  - id: F1
    severity: S2
    status: chặn-trước
    title: Câu của NASA gộp hai mốc Principia
    detail: >
      s1 viết "In 1686, he presented his three laws of motion in the 'Principia
      Mathematica Philosophiae Naturalis.'" Chép nguyên xi sang tiếng Việt sẽ
      thành "Principia xuất bản năm 1686" — sai. s10 (Royal Society, nơi giữ bản
      thảo) tách rõ: trình Quyển 1 cuối tháng 4 năm 1686, bản in đầu ra 1687.
    resolution: >
      Nếu bài nêu năm thì nêu theo s10 và nói rõ mốc nào là mốc gì; nếu không
      cần năm thì bỏ hẳn. Cấm chép câu của s1.
  - id: F2
    severity: S1
    status: chặn-trước
    title: Mở rộng phạm vi mệnh đề Kepler–Newton
    detail: >
      Bảng nguồn chỉ chống lưng được mệnh đề hẹp của s9. Mọi câu mạnh hơn
      ("Newton chứng minh ba định luật Kepler", "Kepler mô tả — Newton giải
      thích") là claim không nguồn mang dấu kiểm định.
    resolution: >
      Bản làm mới chỉ được viết trong phạm vi s9 + s8: hành tinh đi đường cong
      nhờ gia tốc hướng tâm do hấp dẫn cung cấp (s8), và các định luật Kepler là
      đầu vào cho thuyết hấp dẫn của Newton, thuyết ấy giải thích lực còn thiếu
      đằng sau định luật thứ ba của Kepler (s9).
  - id: F3
    severity: S2
    status: chặn-trước
    title: Giới hạn áp dụng có HAI vế, không phải một
    detail: >
      s4: "speeds much less than the speed of light AND … larger than the size
      of most molecules (about 10−9 m in diameter)". Nêu mỗi vế tốc độ là cắt
      mất nửa mệnh đề — đúng kiểu hỏng mà docs/content-rules.md gọi là "rút gọn
      làm mất mức dè dặt".
    resolution: Bản làm mới nêu cả hai vế, kèm con số 10⁻⁹ m của nguồn.
  - id: F4
    severity: S3
    status: chặn-trước
    title: Chữ "tổng hợp" trong định luật II
    detail: 's6 để chữ "net external force" ngay trong phát biểu; bỏ nó thì hai lực cân bằng cũng thành "có lực nên phải có gia tốc".'
    resolution: Giữ chữ "tổng hợp" ở cả ba định luật, không chỉ định luật I.
  - id: F5
    severity: S3
    status: đã-xử-lý-trước-khi-viết
    title: Wikidata QID chưa tra
    detail: "`wikidata_qid: Q16590` trong bảng nguồn là suy đoán, chưa xác minh — và bước 5 (entity) đang bị chặn vì CSDL chết."
    resolution: Đã ghi vào `open_questions`. Bước 5 phải tự tra, không được tin dòng đó.

