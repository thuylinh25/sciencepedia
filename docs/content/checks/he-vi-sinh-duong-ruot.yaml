        dấu vết của thao tác dán, không phải của một lượt soạn bài.
        (c) KHÔNG CÓ TIÊU ĐỀ. Khối không nằm dưới mục nào; nó chen vào giữa mục
        "Hệ vi sinh có ảnh hưởng tới não bộ không?" và "## Kết luận", nên trên
        trang nó đọc ra như phần đuôi của mục nói về não.
        (d) KHÔNG MỘT NGUỒN NÀO. Bài có ba nguồn: Sender 2016 (đếm vi khuẩn),
        Wastyk 2021 (chế độ ăn và miễn dịch), Sommer & Bäckhed 2013 (tổng quan).
        Không nguồn nào nói về nhịn ăn gián đoạn, Akkermansia, MMC hay SIBO.
        (e) SAI NGƯỢC Ở ĐIỂM QUAN TRỌNG NHẤT. Khối viết Bacteroidetes là nhóm
        "tạo Axit béo chuỗi ngắn" có lợi, còn Firmicutes là "vi khuẩn hảo ngọt và
        cơ hội" cần bỏ đói. Thực tế NGƯỢC LẠI ở vế then chốt: phần lớn vi khuẩn
        sinh butyrate — Faecalibacterium prausnitzii, Roseburia, Eubacterium,
        Anaerostipes, Coprococcus — thuộc ngành **Firmicutes**, cụm Clostridium.
        Chính thân bài ở trên đã gọi butyrate là SCFA quan trọng nhất. Nên khối
        này khuyên người đọc bỏ đói đúng nhóm vi khuẩn mà bài vừa khen.
        Ngoài ra tỉ số Firmicutes/Bacteroidetes như dấu ấn béo phì đã bị Sze &
        Schloss (mBio 2016) bác bằng phân tích gộp lại dữ liệu.
