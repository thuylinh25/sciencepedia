        (g) KHẲNG ĐỊNH QUÁ MỨC: "SIBO – nguyên nhân chính gây đầy hơi, chướng
        bụng". SIBO là một trong nhiều nguyên nhân và bản thân tiêu chuẩn chẩn
        đoán còn đang tranh cãi; gọi nó là nguyên nhân chính là nâng một giả
