  replacement_text:

    R1:
      replaces: >-
        TOÀN BỘ khối nhịn ăn gián đoạn, từ "vì sao nhịn ăn gián đoạn (Intermittent
        Fasting) lại làm thay đổi quần thể vi khuẩn ruột." tới hết "...Giảm trạng
        thái viêm nhiễm hệ thống trong cơ thể." — và khối tiếng Anh tương ứng, từ
        "Why Intermittent Fasting (IF) changes the gut microbial population." tới
        "...Reduce systemic inflammatory states in the body."
      mandatory: true
      note: >
        Cắt, không viết lại. Chủ đề đã có bài riêng đã qua gate chống chỉ định
        ngày 2026-09-11; nhắc lại nó ở đây mà không có mục chống chỉ định là mở
        lại một lỗi S1 đã đóng.
      text: |
        Nhịn ăn gián đoạn cũng làm thay đổi thành phần hệ vi sinh, nhưng đó là một
        chủ đề riêng và có những chống chỉ định riêng — xem bài [Nhịn ăn gián đoạn
        ảnh hưởng tới hệ vi sinh đường ruột như thế nào?](/articles/nhin-an-gian-doan-anh-huong-toi-he-vi-sinh-duong-ruot-nhu-the-nao).
      text_en: |
        Intermittent fasting also shifts the composition of the gut microbiota, but
        that is a separate topic with contraindications of its own — see [How
        intermittent fasting affects the gut microbiota](/articles/nhin-an-gian-doan-anh-huong-toi-he-vi-sinh-duong-ruot-nhu-the-nao).

    R2:
      replaces: '"Khoảng 70% mô miễn dịch của cơ thể liên quan đến đường tiêu hóa."'
      text: |
        Niêm mạc ruột là nơi hệ miễn dịch tiếp xúc thường xuyên nhất với vật chất
        từ bên ngoài, và ruột mang một hệ thống mô lympho riêng gọi là mô lympho
        liên kết với ruột (GALT).
      text_en: |
        The gut lining is where the immune system meets material from outside the
        body most often, and the intestine carries a lymphoid system of its own,
        known as gut-associated lymphoid tissue (GALT).

    R3:
      replaces: >-
        "> **3,8 × 10¹³ đến 4 × 10¹³ vi sinh vật**" và câu "tức khoảng **40 nghìn
        tỉ cá thể**, chủ yếu là vi khuẩn sống trong đại tràng."
      text: |
        > **khoảng 3,8 × 10¹³ vi sinh vật**

        Đó là ước lượng của Sender, Fuchs và Milo (2016), kèm sai số chuẩn khoảng
        25% — tức bậc vài chục nghìn tỉ cá thể, chủ yếu là vi khuẩn sống trong đại
        tràng. Nếu bạn từng gặp con số "100 nghìn tỉ" ở nơi khác: nó truy về một
        ước lượng năm 1972 và đã được hạ xuống.
      text_en: |
        > **about 3.8 × 10¹³ microorganisms**

        That is the estimate of Sender, Fuchs and Milo (2016), carrying a standard
        error of about 25% — an order of tens of trillions of individuals, mostly
        bacteria living in the colon. If you have met the figure "100 trillion"
        elsewhere: it traces back to a 1972 estimate and has since been revised down.

    R4:
      replaces: >-
        phần mở mục "## Hệ vi sinh có ảnh hưởng tới não bộ không?" (chữ "Có." đứng
        riêng và đoạn ngay sau), cùng gạch đầu dòng "Tác động gián tiếp đến quá
        trình sản xuất serotonin và các tín hiệu thần kinh khác."
      text: |
        ## Hệ vi sinh có ảnh hưởng tới não bộ không?

        Có tín hiệu đi từ ruột lên não — điều đó đã rõ. Còn tín hiệu ấy ảnh hưởng
        tới tâm trạng và hành vi tới mức nào thì chưa.

        Ruột và não liên lạc qua **trục ruột–não**, chủ yếu bằng ba đường: dây
        thần kinh phế vị, các chất trung gian miễn dịch, và nội tiết. Vi khuẩn
        đường ruột có thể:

        - Tạo ra các chất chuyển hoá ảnh hưởng tới hệ thần kinh.
        - Ảnh hưởng đến cảm giác đói, no và mức độ căng thẳng.

        Một hiểu lầm phổ biến cần nói rõ ở đây: 90–95% serotonin của cơ thể nằm ở
        đường tiêu hoá, nhưng lượng serotonin đó **không đi qua hàng rào máu–não**
        và không phải nguồn serotonin mà não dùng — nó điều hoà nhu động ruột. Vì
        vậy "ăn thứ này để tăng serotonin cho tâm trạng" không phải là điều con số
        ấy nói.

  correction_note_for_corrections_md: >
    `he-vi-sinh-duong-ruot-hang-chuc-nghin-ti-cu-dan-va-anh-huong-cua-chung`
    (1) S1 — KHỐI VĂN BẢN THÔ CỦA TRỢ LÝ AI TRONG THÂN BÀI. Cũ: khoảng 470 từ về
    nhịn ăn gián đoạn, dán thẳng vào cột `content` ở CẢ HAI ngôn ngữ, mở đầu bằng
    chính câu lệnh ("vì sao nhịn ăn gián đoạn ... lại làm thay đổi quần thể vi
    khuẩn ruột." / "Why Intermittent Fasting (IF) changes the gut microbial
    population."), không tiêu đề Markdown, số thứ tự dính liền chữ ở bản tiếng
    Việt ("sau:1.", "vi khuẩn2."), không một nguồn nào.
    Mới: cắt toàn bộ, thay bằng một câu trỏ sang bài chuyên đề đã qua gate.
    Căn cứ: (a) không nguồn nào trong ba nguồn của bài chạm tới chủ đề; (b) khối
    đảo ngược sự thật then chốt — phần lớn vi khuẩn sinh butyrate
    (Faecalibacterium prausnitzii, Roseburia, Eubacterium) thuộc ngành
    **Firmicutes**, đúng nhóm mà khối bảo "bỏ đói", trong khi khối gán vai trò
    sinh SCFA cho Bacteroidetes; tỉ số Firmicutes/Bacteroidetes như dấu ấn béo
    phì đã bị Sze & Schloss, mBio 2016, 10.1128/mbio.01018-16 bác; (c) khối kê
    phác đồ nhịn ≥16 giờ trong chuyên mục dinh dưỡng mà không có một dòng chống
    chỉ định — tức MỞ LẠI đúng lỗi S1 đã đóng cho `nhin-an-gian-doan` ngày
    2026-09-11; (d) ngôn ngữ thực phẩm chức năng ("thanh lọc", "rò rỉ ruột", "đốt
    cháy mỡ thừa") và một khẳng định quá mức ("SIBO – nguyên nhân chính gây đầy
    hơi, chướng bụng").
    (2) S2 — "Khoảng 70% mô miễn dịch của cơ thể liên quan đến đường tiêu hóa".
    Cũ: giữ nguyên từ lượt 2026-09-05, khi đã được ghi vào mục "Còn nợ" là số
    không nguồn phải GỠ. Mới: phát biểu định tính về GALT, không có số.
    (3) S2 — mục về não mở bằng một chữ "Có." dứt khoát và bỏ trống mệnh đề hàng
    rào máu–não. Mới: nêu rõ serotonin đường tiêu hoá không qua hàng rào máu–não,
    thống nhất với bản đã qua gate của `ruot-he-vi-sinh-vat-va-quyen-luc-cua-bo-nao-thu-hai`.
    Căn cứ: Hwang YK et al., Int J Mol Sci 2025;26(3):1160, 10.3390/ijms26031160.
    (4) S3 — "3,8 × 10¹³ đến 4 × 10¹³". Cũ: một dải hẹp không có trong nguồn. Mới:
    ước lượng điểm 3,8 × 10¹³ kèm sai số chuẩn 25%, kèm tên tác giả và năm tại
    chỗ. Căn cứ: Sender, Fuchs & Milo 2016, 10.1371/journal.pbio.1002533, nguyên
    văn "3.8·10^13 bacteria in the colon with a standard error uncertainty of 25%".

