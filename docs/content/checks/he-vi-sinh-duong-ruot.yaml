    - id: E3
      severity: S2
      claim: >-
        Mục "Hệ vi sinh có ảnh hưởng tới não bộ không?" mở đầu bằng một chữ "Có."
        đứng riêng một dòng, rồi trong danh sách có gạch đầu dòng "Tác động gián
        tiếp đến quá trình sản xuất serotonin và các tín hiệu thần kinh khác."
      problem: >
        Hai vấn đề, cùng gốc.
        (1) TRẬT TỰ SAI. Một chữ "Có." in đậm đứng riêng là câu trả lời dứt khoát
        nhất mà tiếng Việt có, đặt cho một câu hỏi mà chính bài bốn đoạn sau thừa
        nhận là "mới chỉ cho thấy sự tương quan". Người lướt đọc chữ "Có.", không
        đọc phần đính chính phía dưới. Quy tắc 3 và quy tắc 7 của gate đều bị chạm.
        (2) MÂU THUẪN NỘI KHO Ở ĐÚNG CHỖ VỪA SỬA S1. Bài
        `ruot-he-vi-sinh-vat-va-quyen-luc-cua-bo-nao-thu-hai` đã được sửa ngày
        2026-09-11 để nói rõ: 90–95% serotonin nằm ở đường tiêu hoá NHƯNG **không
        đi qua hàng rào máu–não** và không phải nguồn serotonin của não. Bài này
        chỉ viết "tác động gián tiếp đến quá trình sản xuất serotonin", bỏ trống
        đúng chỗ mà lượt sửa kia phải lấp — nên nó tái dựng chính mô hình
        "serotonin của tâm trạng nằm ở ruột" đã bị phán quyết là S1.
      source_checked: >
        Đối chiếu nội kho với bản đã qua gate của `ruot-he-vi-sinh-vat`; đối chiếu
        mục S1 ngày 2026-09-11 trong corrections.md (căn cứ gốc: Hwang YK et al.,
        Int J Mol Sci 2025;26(3):1160, 10.3390/ijms26031160).
      resolution: >
        Thay phần mở và phần serotonin bằng replacement_text R4, dùng đúng mệnh đề
        hàng rào máu–não đã qua gate ở bài kia. Hai bài phải nói cùng một điều.

    - id: E4
      severity: S3
      claim: '"> **3,8 × 10¹³ đến 4 × 10¹³ vi sinh vật** ... tức khoảng **40 nghìn tỉ cá thể**"'
      problem: >
        Sender 2016 KHÔNG đưa ra khoảng "3,8 đến 4". Nguyên văn là một ước lượng
        điểm kèm sai số: "3.8·10^13 bacteria in the colon with a standard error
        uncertainty of 25%". Sai số 25% ứng với khoảng chừng 2,9–4,8 × 10¹³ — rộng
        hơn nhiều. Viết "3,8 × 10¹³ đến 4 × 10¹³" là bịa ra một dải hẹp trông
        chính xác hơn bằng chứng, tức đúng loại lỗi "làm con số trông chắc hơn
        bằng chứng" đã phán quyết ở mục Casgevy ngày 2026-09-05.
        Thêm nữa: phán quyết "Ước lượng điểm không đặt vào tiêu đề" nói rõ tiêu đề
        dùng bậc độ lớn còn "thân bài mới dùng con số kèm nguồn và năm". Tiêu đề
        đã đúng, nhưng thân bài đưa con số mà KHÔNG kèm năm và KHÔNG kèm tên
        nguồn tại chỗ — tức mới làm được một nửa phán quyết.
      source_checked: "10.1371/journal.pbio.1002533 — đọc toàn văn, trích nguyên văn ở mục `fetched`. Khối lượng '200 gram' thì ĐÚNG: nguồn ghi 'about 0.2 kg'."
      resolution: "Thay bằng replacement_text R3 — ước lượng điểm, sai số, tên tác giả và năm ngay tại chỗ."

    - id: E5
      severity: S3
      claim: '"số lượng gene của chúng lớn hơn hàng trăm lần bộ gene người"'
      problem: >
        Không nguồn, và phóng đại. Danh mục gene hệ vi sinh ruột người thường được
        nêu ở mức ~3,3 triệu gene, so với ~20.000 gene mã hoá protein của người —
        tức khoảng 150–170 lần. "Hàng trăm lần" đọc ra thành vài trăm. Đúng họ với
        lỗi làm tròn lên con số của chính mình.
      source_checked: "Ba nguồn của bài — không nguồn nào nêu số gene."
      resolution: >
        Gắn nguồn và ghi đúng bậc ("hơn một trăm lần"), hoặc gỡ hẳn vế này theo
        quy tắc 6. Editor nghiêng về gỡ: nó không đỡ cho lập luận nào trong bài.

    - id: E6
      severity: S3
      claim: "seoTitle = 'Hệ vi sinh đường ruột: hàng chục nghìn tỉ cư dân và ảnh...'"
      problem: >
        Chuỗi đã qua gate bị cắt và nối bằng "...". content-rules.md, mục "Trích
        nội dung": không cắt chuỗi đã duyệt. Ở đây phần bị cắt chỉ là "hưởng của
        chúng" nên không mất mệnh đề dè dặt nào — vì vậy S3, không nặng hơn —
        nhưng cơ chế cắt thì vẫn là cơ chế đã bị cấm.
      source_checked: "Đối chiếu `title` với `seoTitle` trong CSDL."
      resolution: "Viết seoTitle riêng, đủ nghĩa, trong giới hạn độ dài — không cắt title rồi chấm lửng."

    - id: E7
      severity: null
      claim: "Mục 'Thực phẩm lên men' và mục 'Ăn nhiều loại thực vật khác nhau'"
      problem: >
        KHÔNG phải lỗi — ghi lại để lượt sau không "sửa cho chặt hơn". Hai mục này
        giữ đúng mức dè dặt ("có thể giúp làm tăng", "một trong những yếu tố") và
        được Wastyk 2021 (s1) chống lưng thật. Khung nhắc phân biệt tương quan với
        nhân quả ở cuối mục về não cũng đúng và nên giữ nguyên văn.
      source_checked: "10.1016/j.cell.2021.06.019"
      resolution: "Giữ nguyên."

