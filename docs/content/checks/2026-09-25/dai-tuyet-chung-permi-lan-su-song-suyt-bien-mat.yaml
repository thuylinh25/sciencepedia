    claim: "Bọ ba thuỳ tồn tại 270 triệu năm; therapsid 'đang trên đường tiến hoá thành động vật có vú'; archosaur rồi khủng long thống trị 165 triệu năm; động vật có vú 'chờ tới lượt mình sau vụ tuyệt chủng kế tiếp'"
