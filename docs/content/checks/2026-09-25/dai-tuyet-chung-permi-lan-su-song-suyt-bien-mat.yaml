    note: "Kraft 2023: 'their 270-million-year-long history from the early Cambrian period to the end Permian period' — giữ. Ezcurra & Butler 2018: 'the previously obscure archosauromorphs (which include crocodylians, dinosaurs and birds) become the dominant terrestrial vertebrates' — giữ theo đúng tên nhóm. 'Vụ tuyệt chủng kế tiếp' là cuối Trias, còn động vật có vú lên ngôi sau Creta–Paleogene — sai, cắt. 'Therapsid trên đường thành động vật có vú' (mục đích luận, không nguồn) và '165 triệu năm' (không nguồn) — cắt."
  - id: C-18
