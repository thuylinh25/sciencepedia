summary: "Duyệt lại toàn bài sau lượt vá S1/S2 ngày 17/09. Bản vi đã nhận bốn đính chính, nhưng contentEn và summaryEn thì CHƯA: bản tiếng Anh đang xuất bản vẫn ghi 252 triệu năm, 80%, 'lần duy nhất côn trùng', '540 triệu năm' (S1). Mở nguồn thật cho từng claim thì thêm sáu lỗi S2: tiêu đề và câu mở bài nói sự sống 'suýt biến mất' — đúng điều mà chính nguồn Stanley 2016 của bài bác bỏ; 'phun trào lịch sử hiếm khi vượt vài km³' sai; than + halogen phá tầng ozone được nói như sự thật trong khi nguồn đặt than làm phần nhỏ và Dal Corso 2024 trái chiều về ozone; 'nhiều phòng thí nghiệm độc lập không thấy tín hiệu' sai (một nhóm phân tích lại, và Onoue 2019 lại thấy tín hiệu ³He); 'nhanh hơn nhiều bậc' bị Cui 2021 bác (tốc độ cuối Permi cỡ một nửa hôm nay); 'động vật có vú chờ tới lượt sau vụ tuyệt chủng kế tiếp' sai (vụ kế tiếp là cuối Trias). Mười tám claim S3 thiếu nguồn hoặc dựng quan hệ nhân quả (mục Pangaea, 'bốn cơ chế nối tiếp', 8–10 °C, 1–4 triệu km³, 70% động vật có xương sống). Tất cả đã có bản sửa theo nguồn bậc 1 đã mở trong lượt này, hoặc bị cắt; thêm 17 nguồn bình duyệt. Sau khi áp kế hoạch sửa chỉ còn một ghi chú S4."
