summary: >
  Bài mang dấu PASSED nhưng lượt thẩm định nguồn 12/09 (checks/ba-dinh-luat-newton.yaml,
  findings_on_existing_article E1–E6, F2–F4) đã ghi hai S2 và bốn S3 trên chính bài
  này và chưa lượt nào áp. Lượt này mở lại năm nguồn NASA và Royal Society, áp đủ:
  Kepler–Newton viết trong phạm vi NASA nói (thuyết hấp dẫn giải thích lực còn thiếu
  sau định luật thứ ba, dạng tổng quát dùng đo khối lượng); giới hạn áp dụng bỏ
  "gần lỗ đen" (không nguồn), thêm việc GPS/quỹ đạo tàu vũ trụ đã cần hiệu chỉnh
  tương đối; thêm "tổng hợp" ở định luật I và II (câu "không cần lực để duy trì
  chuyển động" dựng mô hình sai — chính ví dụ máy bay của NASA cần lực đẩy để bay
  đều); F = ma là trường hợp khối lượng không đổi của dạng động lượng; định luật III
  nêu hai vật khác nhau; danh sách ứng dụng thay bằng ứng dụng có nguồn; câu kết và
  summary bỏ "mọi vật thể … toàn bộ nền vật lý hiện đại". 9 sửa vi, 9 sửa en,
  summary + summaryEn. Không thêm nguồn. Sau sửa không còn S1–S3; 7 nguồn bậc 2.
  Giữ dấu duyệt.
