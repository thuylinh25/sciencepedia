verdict: pass
summary: "Đưa bản vi về cùng claim với bản en đã sửa: bỏ 99,86%/1%/'đặc biệt là Sao Mộc', tách di cư hành tinh khỏi lời giải bài toán động lượng góc (S2), bỏ James Webb, 'hàng triệu năm', 'hành tinh bị hất ra', 'quy luật phổ quát', thêm mốc 9/2026, khôi phục ghi công VACA. Lỗi chung cả hai bản (đường tuyết gộp ba chất, câu 'mô hình cổ điển', định nghĩa siêu Trái Đất) sửa cả vi và en. Mọi claim còn lại có nguồn bậc 1–2 mở trong lượt; không còn S1–S3."
claims:
  - id: C-1
    claim: "Hệ Mặt Trời hình thành cách đây khoảng 4,57 tỷ năm."
    verdict: "verified"
    severity: "none"
    evidence: "https://doi.org/10.1126/science.1226919 (PubMed 23118187) ; https://science.nasa.gov/solar-system/solar-system-facts/"
    note: "Connelly et al. 2012: tuổi CAI 4567,30 ± 0,16 triệu năm (tóm tắt PubMed mở 25/09); NASA: about 4.6 billion years."
  - id: C-2
    claim: "Mặt Trời chứa hơn 99% khối lượng của cả hệ nhưng chỉ giữ một phần rất nhỏ động lượng góc."
    verdict: "verified"
    severity: "none"
    evidence: "https://science.nasa.gov/solar-system/solar-system-facts/ ; https://nssdc.gsfc.nasa.gov/planetary/factsheet/ ; https://nssdc.gsfc.nasa.gov/planetary/factsheet/sunfact.html"
    note: "Đã sửa từ 99,86% / 'khoảng 1%'. Tính từ Fact Sheet: khối lượng Mặt Trời ~99,87% (Mặt Trời + 8 hành tinh); động lượng góc tự quay ~0,6% (xấp xỉ quay đều, I/MR²=0,070)."
