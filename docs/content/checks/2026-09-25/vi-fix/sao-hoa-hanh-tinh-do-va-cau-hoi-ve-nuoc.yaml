    claim: "Hai vệ tinh nhỏ Phobos và Deimos (NASA, 9/2026); nguồn gốc chưa ngã ngũ — quang phổ giống tiểu hành tinh loại D gợi ý bắt giữ, quỹ đạo gần tròn xích đạo hợp với bồi tụ sau va chạm."
