    evidence: "https://science.nasa.gov/dwarf-planets/ ; https://science.nasa.gov/dwarf-planets/pluto/facts/ ; https://doi.org/10.1126/science.aad1815 (Stern et al. 2015, PubMed 26472913)"
    note: "Năm và người: NASA. Địa điểm: NASA (tên chuyển tới Lowell Observatory) + địa chỉ Lowell Observatory, Flagstaff, AZ trong Stern 2015. Đã cắt chi tiết so ảnh."
