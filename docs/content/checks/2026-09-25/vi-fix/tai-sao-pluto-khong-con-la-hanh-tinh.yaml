slug: tai-sao-pluto-khong-con-la-hanh-tinh
checkedAt: 2026-09-25
checkedBy: science-editor
priorFactCheck: REVISE
verdict: pass
summary: "Bản vi đã khớp en ở các lỗi en-parity (định nghĩa IAU, hành tinh lùn, 5,9 tỉ km); lượt này đóng mọi fix còn mở của check 17/09 ở CẢ HAI bản và một lỗi mới: núi 3.500 m sai theo NASA (2–3 km). Cắt/sửa các claim không nguồn (1.000 km, 'hàng chục lớp mù', ví dụ Trái Đất ở quỹ đạo Pluto — ngược với tiêu chí Margot 2015, 'danh sách vô hạn định', chi tiết so ảnh, 'ở đúng vùng trời'), Eris không còn gọi là thiên thể vành đai Kuiper, thêm mốc 9/2026, gắn nguồn bậc 1 cho mọi claim. Không còn S1–S3."
claims:
  - id: C-0
    claim: "Tới giữa 2006 sách dạy chín hành tinh; từ 8/2006 là tám; Hệ Mặt Trời không mất thiên thể nào, chỉ định nghĩa thay đổi."
    verdict: "verified"
    severity: "none"
    evidence: "https://iauarchive.eso.org/news/pressreleases/detail/iau0603/ ; https://science.nasa.gov/dwarf-planets/pluto/facts/"
    note: "IAU 24/8/2006 Praha: 'the Solar System consists of eight planets'; NASA: 'long considered our solar system's ninth planet'."
  - id: C-1
    claim: "Pluto đi hết một vòng quanh Mặt Trời trong 248 năm."
