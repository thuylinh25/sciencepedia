    evidence: "https://science.nasa.gov/dwarf-planets/pluto/facts/"
    note: "'248-year-long, oval-shaped orbit'."
  - id: C-2
    claim: "Tombaugh phát hiện Pluto năm 1930 tại đài Lowell, Arizona."
