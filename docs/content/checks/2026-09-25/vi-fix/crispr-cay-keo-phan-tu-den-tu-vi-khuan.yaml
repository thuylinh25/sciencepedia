  - id: C-11
    claim: "Cuối 2018 He Jiankui tuyên bố cặp song sinh có CCR5 chỉnh sửa khi còn là phôi (nhằm ngăn HIV từ cha), thai kỳ thứ ba đang tiến triển, em bé thứ ba ra đời 2019; bị lên án trong và ngoài nước; 12/2019 bị kết tội hành nghề y trái phép, 3 năm tù"
    verdict: verified
    severity: none
    evidence: "https://doi.org/10.1111/bioe.12878 ; https://doi.org/10.1093/jlb/lsaf007"
    note: "Alonso & Savulescu 2021 (Bioethics): Lulu và Nana, \"a third pregnancy underway\", \"birth of a third gene-edited baby during 2019\". Zou 2025 (J Law Biosci): CCR5 \"to prevent the inheritance of HIV from an infected father\", \"widely condemned domestically and globally\", \"In December 2019 … convicted of illegal medical practices and sentenced to prison for 3 years\". Hai nguồn bình duyệt thay cho báo chí (check 17/09)."
  - id: C-12
    claim: "Khảo sát 106 nước (2020): 75 nước cấm dùng phôi chỉnh sửa để mang thai (5 có ngoại lệ), không nước nào cho phép rõ ràng chỉnh sửa di truyền được; nghiên cứu dòng mầm trong phòng thí nghiệm: đa số chưa có quy định riêng, 23 cấm, 11 cho phép"
    verdict: verified
    severity: none
