    note: "Khớp tóm tắt Baylis 2020. Claim có mốc năm; ghi chú kiểm lại: khảo sát mới hơn có thể đổi số. Zou 2025 dẫn cùng khảo sát với con số 70 nước — lệch do cách đếm của bài thứ cấp; dùng số của bài gốc."
