checkedAt: 2026-09-25
checkedBy: science-editor
priorFactCheck: REVISE
verdict: pass
summary: "Lỗi S2 \"chỉ cần tổng hợp RNA 20 nucleotide là cắt được chỗ muốn\" đã sửa ở cả hai bản: Cas9 chỉ cắt khi cạnh đích có PAM (NGG với SpCas9), theo đúng Jinek 2012. Mọi claim còn lại nay có nguồn bậc 1–2 đã mở: spacer (Barrangou 2007), NHEJ/HDR (Ran 2013, kèm vế đối trọng của HDR), Nobel (NobelPrize.org), Casgevy với điều kiện chỉ định và mốc FDA 16/01/2024, He Jiankui (hai bài bình duyệt thay báo chí), khung pháp lý dòng mầm có mốc năm 2020 (Baylis). Nguồn Jinek 2012 bổ sung doi đã resolve Crossref. Đọc lại toàn bài vi: không còn S1–S3; 10 nguồn bậc 1–2."
claims:
  - id: C-1
    claim: "CRISPR là hệ miễn dịch thích ứng của vi khuẩn và vi khuẩn cổ; sau khi bị virus tấn công, vi khuẩn chèn đoạn DNA ngắn của virus vào vùng CRISPR, các đoạn này quyết định tính kháng"
    verdict: verified
    severity: none
    evidence: "https://doi.org/10.1126/science.1225829 ; https://doi.org/10.1126/science.1138140"
    note: "Jinek (tóm tắt): \"provide bacteria and archaea with adaptive immunity\". Barrangou: \"bacteria integrated new spacers derived from phage genomic sequences … resistance specificity is determined by spacer-phage sequence similarity\"."
  - id: C-2
    claim: "RNA dẫn đường ~20 nucleotide khớp bổ sung với đích; Cas9 cắt cả hai mạch"
    verdict: verified
    severity: none
    evidence: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6286148/"
    note: "\"the 5′-terminal 20 nucleotides of the crRNA … are available for target DNA binding\"; HNH cắt mạch bổ sung, RuvC cắt mạch không bổ sung."
  - id: C-3
    claim: "Cas9 lập trình được bằng một RNA thiết kế sẵn; nhưng chỉ cắt khi cạnh đích có PAM (NGG với SpCas9, cả hai G đều cần); về nguyên tắc nhắm được gần như mọi trình tự có PAM bên cạnh"
    verdict: verified
    severity: none
    evidence: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6286148/"
    note: "\"a short motif (… PAM) juxtaposed to the complementary region\"; \"the PAM conforms to an NGG consensus sequence\"; \"both G nucleotides of the PAM were required\"; \"could in principle enable targeting of any DNA sequence of interest with few constraints beyond the presence of a GG dinucleotide adjacent\". Trước đây contradicted S2."
  - id: C-4
    claim: "Đột phá 2012 là của nhóm do Doudna và Charpentier dẫn dắt (Jinek và cộng sự)"
    verdict: verified
    severity: none
    evidence: "https://doi.org/10.1126/science.1225829"
    note: "Crossref: tác giả Jinek, Chylinski, Fonfara, Hauer, Doudna, Charpentier; Science 337:816–821."
  - id: C-5
    claim: "Charpentier và Doudna nhận Nobel Hoá học 2020 \"vì đã phát triển một phương pháp chỉnh sửa hệ gene\""
    verdict: verified
    severity: none
    evidence: "https://www.nobelprize.org/prizes/chemistry/2020/press-release/"
    note: "\"The Royal Swedish Academy of Sciences has decided to award the Nobel Prize in Chemistry 2020 to Emmanuelle Charpentier … Jennifer A. Doudna … for the development of a method for genome editing\"."
  - id: C-6
    claim: "NHEJ dễ sai, để lại indel có thể làm hỏng gene, dùng để tắt gene; HDR chính xác khi có khuôn, nhưng tần suất thấp và thất thường hơn, chủ yếu ở tế bào phân chia"
    verdict: verified
    severity: none
    evidence: "https://doi.org/10.1038/nprot.2013.143"
    note: "Ran 2013: \"error-prone NHEJ … high-fidelity HDR\"; indel; \"NHEJ can be harnessed to mediate gene knockouts\"; \"HDR typically occurs at lower and substantially more variable frequencies\"; \"generally active only in dividing cells\". Bỏ \"nhanh\" (không nguồn)."
