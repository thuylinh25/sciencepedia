  - id: C-8
    claim: "Gương ~6,5 m rộng hơn chụp mũi Ariane 5 (~5,4 m) nên kính được thiết kế để gấp; 18 mảnh lục giác beryllium phủ vàng, mở ra và căn chỉnh trong không gian."
