    severity: none
    evidence: "https://science.nasa.gov/mission/webb/early-universe/ (truy cập 25/09/2026) — 'JADES-GS-z14-0, which was the record holder at a redshift of 14.32 until June of 2025, when MoM-z14 was confirmed to have a redshift of z = 14.44 placing the galaxy as existing about 280 million years after the big bang'; https://doi.org/10.33232/001c.156033 — 'a mere 280 million years after the Big Bang'"
    note: "Claim kỷ lục, có mốc; kiểm lại 03/2027."
