    note: "Cắt 'độ chính xác cỡ nanomet' (không nguồn) và 'không tên lửa nào' (tuyệt đối, không nguồn)."
  - id: C-9
    claim: "Tính đến 09/2026, theo NASA, thiên hà xa nhất xác nhận bằng quang phổ là MoM-z14 (z = 14,44, xác nhận 2025), thấy như ở ~280 triệu năm sau Big Bang."
