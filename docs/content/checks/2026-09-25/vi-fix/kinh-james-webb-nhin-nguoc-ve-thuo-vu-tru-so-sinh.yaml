    severity: none
    evidence: "https://webb.nasa.gov/content/about/comparisonWebbVsHubble.html — 'it was optimized to see shorter ultraviolet and visible light'; fact sheet — 'Wavelength Coverage 0.6 - 28.5 microns'; FAQ — '0.6 micrometer (gold light) for Webb'"
