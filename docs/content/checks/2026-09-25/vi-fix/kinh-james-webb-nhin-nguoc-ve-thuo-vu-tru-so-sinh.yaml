    claim: "Dịch chuyển đỏ đưa ánh sáng khả kiến của các thiên hà đầu tiên (sau hơn 13 tỉ năm) sang hồng ngoại; hồng ngoại cho phép nhìn vào bên trong các đám mây bụi nơi sao hình thành."
