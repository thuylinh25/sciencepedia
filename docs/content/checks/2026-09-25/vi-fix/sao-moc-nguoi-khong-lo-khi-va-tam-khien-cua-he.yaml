  - id: C-16
    claim: "Hấp dẫn Sao Mộc định hình vành đai tiểu hành tinh, ảnh hưởng quỹ đạo sao chổi; 'tấm khiên' là giả thuyết còn tranh cãi — Horner & Jones 2008: có thể làm tăng đáng kể tốc độ va chạm."
    verdict: "verified"
