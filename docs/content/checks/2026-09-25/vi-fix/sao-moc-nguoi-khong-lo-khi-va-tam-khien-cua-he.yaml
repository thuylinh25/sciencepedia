    severity: "S3"
    evidence: "https://doi.org/10.1017/s1473550408004187 ; https://doi.org/10.1017/s1473550408004357"
    note: "Tiêu đề khẳng định vai trò khiên chắn như sự thật, trong khi nguồn của chính bài cho thấy Sao Mộc có thể làm TĂNG va chạm. Không sửa trong lượt này theo chỉ đạo — việc duy nhất còn mở."
  - id: C-17
    claim: "Summary và seoDescription: khối lượng 2,5 lần; Vết Đỏ Lớn theo dõi từ khoảng 1831."
