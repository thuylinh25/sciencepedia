summary: "Bản vi vốn đã đi trước en ở các lỗi 17/09; lượt này đóng các mục còn mở ở CẢ HAI bản: phát hiện mới S3 — phả hệ Saturn–Uranus không phải 'trùng hợp' (Bode chọn tên năm 1782), Uranus là thần Hy Lạp; sự khớp tên–đặc điểm của Mars/Jupiter/Mercury là có chủ ý theo NASA; bỏ 'thiên thể dưới cấp sao', diễn giải điều kiện c không nguồn, 'không phải trùng hợp' về đường tuyết; thêm mốc và nguồn cho tranh cãi Hành tinh thứ chín; xác nhận 128 vệ tinh Sao Thổ (MPEC 2025-E) qua bảng NASA. Không còn S1–S3."
