errorPatterns:
  - "Bản sửa chỉ áp cho vi, bỏ quên en: bản vá S1 ngày 17/09 không có enEdits. Quy trình áp fixes phải từ chối kế hoạch sửa bài song ngữ nếu thiếu enEdits."
  - "Con số trích lại từ giáo trình cũ không kèm năm (10¹¹ 'ít nhất' → 'khoảng 10¹¹'): cùng họ với lỗi 10¹⁴ vi khuẩn đường ruột — con số tách khỏi năm đo và mất chữ 'ít nhất'."
  - "Mốc thời gian 'trông như giáo trình' (5–10 ngày, 1–3 ngày) không có nguồn — chi tiết cụ thể nhất là chỗ dễ bịa nhất."
