        Chỗ thật sự chống lưng con số 117 là Planetary Fact Sheet, "Length of Day
        2802,0 hours" = 116,75 ngày — một dòng không được nhắc tới trong đính chính.
        Nên bản sửa đi tới số đúng bằng một câu trích không phát biểu số đó. Đây
