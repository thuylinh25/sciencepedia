      claim: "ngày mặt trời ở đó — từ bình minh này tới bình minh kế tiếp — chỉ khoảng 117 ngày Trái Đất"
      problem: >
        Kết luận ĐÚNG, nhưng đoạn trích được dẫn để chống lưng nó thì không nói điều
        đó. corrections.md ghi căn cứ là NASA Venus Facts, "sunrise to sunset would
