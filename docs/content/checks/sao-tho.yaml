  recomputed:
    - "Tỉ lệ rộng trên dày của vành đai: 280.000 km = 2,8e8 m; chia cho 10 m = 2,8e7. Vành đai mỏng hơn chiều rộng của nó khoảng 28 TRIỆU lần."
    - "Tỉ lệ của phép so sánh trong bài: một tờ giấy dày 0,1 mm trên một sân bóng đá rộng 100 m cho tỉ lệ 1e6 — tức 1 triệu lần. Phép so sánh SAI 28 lần, và sai về phía làm vành đai trông DÀY hơn thực tế."
    - "Muốn tờ giấy đúng tỉ lệ thì nó phải rộng 2,8 km, tức gần ba chục sân bóng đá nối nhau."
