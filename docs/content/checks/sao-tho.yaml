  findings:
    - id: THO-1
      severity: S2
      claim: "tỉ lệ tương đương một tờ giấy rộng bằng sân bóng đá"
      problem: >
        Phép so sánh này mang một mệnh đề kiểm chứng được, và tính ra thì nó sai 28
        lần. Vành đai mỏng hơn chiều rộng của nó khoảng 28 triệu lần; tờ giấy trên
        sân bóng đá chỉ cho tỉ lệ 1 triệu lần. Muốn đúng, tờ giấy ấy phải rộng 2,8 km.
        Sai về phía nào cũng đáng sửa, nhưng ở đây nó sai về phía làm vành đai trông
        DÀY hơn thực tế — tức nó phá đúng cái điều mà cả mục đang muốn nói, và phá
        đúng cái điều nằm trong tiêu đề bài ("vành đai mỏng manh").
        Đây là bản văn xuôi của phán quyết đã chốt ngày 2026-09-06 cho hình Kepler:
        nếu một phép minh hoạ mang mệnh đề định lượng thì tham số của nó là dữ liệu,
        không phải lựa chọn thẩm mỹ. Một phép ví chọn vì nghe xuôi tai cũng là chọn
        bằng mắt.
      source_checked: "science.nasa.gov/saturn/facts — đọc 2026-09-12; tự tính lại"
      resolution: "Nêu thẳng tỉ số đã tính, rồi mới đưa phép ví đã được tính cho khớp."
    - id: THO-2
      severity: S3
      claim: "Chúng trải rộng khoảng 280.000 km"
      problem: >
        Nguồn NASA viết vành đai trải "up to 282,000 kilometers FROM THE PLANET" —
        đó là một BÁN KÍNH, tính từ hành tinh ra. Đọc thành chiều rộng toàn hệ vành
        đai thì phải nhân đôi, tức khoảng 564.000 km.
        Con số 280.000 km tình cờ lại xấp xỉ đúng đường kính của vành đai CHÍNH (mép
        ngoài vành A cách tâm chừng 136.800 km), nên nó không hẳn sai — nhưng bài
        không nói nó đang đo cái nào, và nó không phải con số mà nguồn phát biểu.
        Một số đúng vì trùng hợp vẫn là một số chưa được kiểm.
      source_checked: "science.nasa.gov/saturn/facts — đọc 2026-09-12"
      resolution: "Nói rõ đang đo vành đai chính, theo đường kính."
    - id: THO-3
      severity: S3
      claim: "Cấu trúc này đã được quan sát từ thời Voyager và vẫn tồn tại — một hiện tượng chưa có ở bất kỳ hành tinh nào khác."
      problem: >
        Một siêu ngữ ("chưa có ở bất kỳ hành tinh nào khác") không kèm mốc thời gian
        và không kèm lịch rà lại — đúng thứ quy tắc 5 cấm. Mệnh đề vẫn đúng tính tới
        hôm nay, nhưng nó thuộc loại tự hết hạn.
        Cùng chỗ này còn một khoảng trống về tính cập nhật: NASA vừa công bố (nghiên
        cứu tháng 9/2026, dữ liệu từ 2023) một sóng khí quyển MƯỜI cạnh quanh cực NAM
        Sao Thổ. Không mâu thuẫn với câu của bài — vẫn cùng một hành tinh — nhưng
        đoạn văn hiện tại dựng lên hình ảnh một cấu trúc lục giác đơn độc, trong khi
        bức tranh mới là hai cực đều có sóng tia đa giác.
      source_checked: "science.nasa.gov/saturn/facts — đọc 2026-09-12"
      resolution: "Thêm mốc as-of; nhắc tới phát hiện ở cực nam."
    - id: THO-4
      severity: S4
      claim: "kích thước từ hạt bụi tới nhà cao tầng"
      problem: >
        Nguồn nói "as big as a house" — nhà, không phải nhà cao tầng. Bài phóng lên
        một bậc, rồi lại bỏ mất vế mà nguồn có và mạnh hơn hẳn: "a few particles are
        as large as mountains". Vừa nâng chỗ không cần nâng, vừa bỏ chỗ đáng giữ.
      source_checked: "science.nasa.gov/saturn/facts — đọc 2026-09-12"
      resolution: "Trả lại đúng thang của nguồn."
    - id: THO-5
      severity: S4
      claim: "ở nhiều vùng chỉ dày chừng 10 mét"
      problem: >
        Nguồn giới hạn con số này vào VÀNH ĐAI CHÍNH ("in the main rings"); bài đổi
        thành "ở nhiều vùng", một phạm vi rộng hơn và mơ hồ hơn. Vành E thì dày hàng
        nghìn km, nên phạm vi mở rộng ấy không đúng.
      source_checked: "science.nasa.gov/saturn/facts — đọc 2026-09-12"
      resolution: "Giới hạn lại đúng như nguồn."
    - id: THO-6
      severity: S4
      claim: "Nếu có một đại dương đủ lớn, Sao Thổ sẽ nổi."
      problem: >
        NASA nói y như vậy nên không phải lỗi nguồn, nhưng là đơn giản hoá có mất
        mát: đây là một phép so sánh MẬT ĐỘ TRUNG BÌNH, không phải một dự đoán về
        lực đẩy Archimedes — Sao Thổ không phải một khối rắn và sẽ không giữ được
        hình dạng trong tình huống ấy. Theo quy tắc 4, khi đơn giản hoá có mất mát
        thì phải nói là nó có mất mát.
      source_checked: "science.nasa.gov/saturn/facts — đọc 2026-09-12"
      resolution: "Giữ phép ví, thêm nửa câu nói rõ nó chỉ là cách đọc con số mật độ."
    - id: THO-7
      severity: S3
      claim: "(cả bài)"
      problem: >
        Một nguồn duy nhất là Planetary Fact Sheet, và nó chống lưng được đúng một
        con số trong bài: mật độ 0,687 g/cm3. Toàn bộ phần vành đai, tuổi vành đai
        100-400 triệu năm, mưa vành đai, Enceladus, Titan, Dragonfly, lục giác cực
        bắc đều không có trong nguồn nào gắn với bài.
      source_checked: "đối chiếu từng claim với nội dung đã tải"
      resolution: "Chạy lại bước 1-2 pipeline trước khi đặt factCheck = PASSED."

