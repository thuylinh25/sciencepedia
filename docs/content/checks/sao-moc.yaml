      resolution: "Sửa summary, summaryEn và seoDescription cho khớp thân bài và khớp nguồn."
    - id: MOC-2
      severity: S2
      claim: "tạo ra từ trường mạnh nhất trong các hành tinh, gấp khoảng 20.000 lần Trái Đất"
      problem: >
        Con số gắn vào sai đại lượng. NASA viết "Jupiter's enormous magnetic field is
        16 to 54 times as powerful as that of the Earth" — tức ĐỘ MẠNH TỪ TRƯỜNG hơn
        Trái Đất vài chục lần. Con số khoảng 20.000 là tỉ số MÔ-MEN LƯỠNG CỰC, một
        đại lượng khác, và nó bị viết ra dưới dạng "từ trường ... gấp khoảng 20.000
        lần", tức người đọc hiểu thành cường độ. Lệch ba bậc độ lớn so với chính cơ
        quan mà bài dựa vào.
        Cùng mẫu với "con số đúng gắn vào kết luận sai" đã ghi ở đợt 2026-09-11: phép
        kiểm số học không bắt được vì 20.000 là một con số có thật, chỉ là của đại
        lượng khác.
      source_checked: "science.nasa.gov/jupiter/jupiter-facts — đọc 2026-09-12"
      resolution: "Nói rõ đang so đại lượng nào, hoặc bỏ con số và giữ mệnh đề so sánh bậc nhất."
    - id: MOC-3
      severity: S3
      claim: "Gió ở rìa đạt khoảng 430 km/h."
      problem: >
        Không nguồn nào gắn với bài phát biểu con số này. Trang NASA có một con số
        gần gần — 539 km/h — nhưng đó là gió ĐỚI XÍCH ĐẠO của cả hành tinh, không
        phải gió rìa Vết Đỏ Lớn. Ai đối chiếu nhanh sẽ tưởng đã tìm thấy nguồn.
        Theo quy tắc 6, số không nguồn thì gỡ chứ không làm mềm.
      source_checked: "science.nasa.gov/jupiter/jupiter-facts + abstract GRL — đọc 2026-09-12; không trang nào có 430 km/h"
      resolution: "Gỡ con số, hoặc gắn nguồn đo tốc độ gió rìa GRS kèm năm đo."
    - id: MOC-4
      severity: S3
      claim: "từ khoảng 40.000 km chiều ngang vào cuối thế kỷ 19 xuống còn khoảng 14.000 km hiện nay"
      problem: >
        Hai vấn đề. Một, chữ "hiện nay" là claim date-bound không có ngày — Vết Đỏ
        Lớn đang co lại, nên con số này hết hạn theo thời gian và không ai biết nó
        được đo năm nào. Hai, cả hai con số đều chưa được neo vào nguồn đọc được:
        abstract của bài báo xác nhận xu hướng co lại ("as it has shrunk") nhưng
        không nêu số, và toàn văn thì không tải được (403).
      source_checked: "Crossref abstract 10.1029/2024GL108993 — đọc 2026-09-12; Wiley 403"
      resolution: "Thêm năm đo cho mỗi con số, hoặc rút về mệnh đề định tính cho tới khi đọc được toàn văn."
    - id: MOC-5
      severity: S3
      claim: "Bốn vệ tinh Galilei được Galileo Galilei phát hiện năm 1610 — quan sát đã trực tiếp bác bỏ mô hình địa tâm"
      problem: >
        Nâng mức của một mệnh đề lịch sử khoa học. Bốn vệ tinh bác bỏ mệnh đề "mọi
        thiên thể quay quanh Trái Đất", nhưng KHÔNG bác bỏ mô hình địa tâm nói chung:
        hệ Tycho — Trái Đất đứng yên, các hành tinh quay quanh Mặt Trời, Mặt Trời
        quay quanh Trái Đất — dung nạp được quan sát này mà không cần sửa gì.
        Kho còn có sẵn câu trả lời đúng ở chỗ khác: trang NASA về Sao Kim, đã tải
        trong chính lượt này, viết rằng chính CÁC PHA CỦA SAO KIM do Galileo quan sát
        mới "provided the key scientific proof for the Copernican heliocentric nature
        of the solar system".
      source_checked: "science.nasa.gov/venus/venus-facts và science.nasa.gov/jupiter/jupiter-facts — đọc 2026-09-12; trang Jupiter không gán vai trò bác bỏ nào cho bốn vệ tinh"
      resolution: "Phát biểu đúng điều quan sát ấy bác bỏ."
    - id: MOC-6
      severity: S3
      claim: "Vai trò \"tấm khiên bảo vệ Trái Đất\"" (trong titleEn và title)
      problem: >
        Thân bài xử lý mệnh đề này rất đúng mực: gọi nó là thứ "thường được nhắc
        tới", rồi nói mô phỏng gần đây cho thấy bức tranh phức tạp hơn, vừa chặn vừa
        đẩy vào trong. Nhưng TIÊU ĐỀ thì bỏ hết phần dè dặt đó: "tấm khiên của hệ",
        và bản tiếng Anh còn mạnh hơn — "the gas giant that shields the system", một
        mệnh đề khẳng định.
        Tiêu đề không mang được mệnh đề dè dặt, đúng như phán quyết về ước lượng điểm
        trong tiêu đề đã ghi. Ở đây hậu quả là tiêu đề khẳng định điều thân bài vừa
        hạ xuống mức chưa chắc.
      source_checked: "đọc lại content và contentEn, 2026-09-12"
      resolution: "Đổi tiêu đề sang một đặc điểm không tranh cãi, hoặc đặt vai trò tấm khiên ở dạng câu hỏi."
    - id: MOC-7
      severity: S4
      claim: "giới thiên văn xem đây là hai xoáy khác nhau"
      problem: >
        Bài báo viết PS "is UNLIKELY to correspond to" GRS — một kết luận có xác
        suất. Bài nâng thành lập trường của cả giới thiên văn. Chênh lệch nhỏ, nhưng
        đúng loại mà lượt 2026-09-05 vừa sửa, nên đáng ghi để không trôi tiếp.
      source_checked: "abstract nguyên văn qua Crossref — đọc 2026-09-12"
      resolution: "Trả lại mức của bài báo."
    - id: MOC-8
      severity: S4
      claim: "**Ganymede** — vệ tinh lớn nhất hệ, lớn hơn cả Sao Thuỷ"
      problem: >
        Khớp nguyên văn NASA nên không phải lỗi nguồn, nhưng là một đơn giản hoá có
        mất mát: Ganymede lớn hơn Sao Thuỷ về ĐƯỜNG KÍNH và nhỏ hơn một nửa về KHỐI
        LƯỢNG. Người đọc rút ra "Ganymede to hơn Sao Thuỷ" là rút ra một mô hình sai.
      source_checked: "science.nasa.gov/jupiter/jupiter-facts — đọc 2026-09-12"
      resolution: "Nói rõ so theo đường kính."
    - id: MOC-9
      severity: S3
      claim: "(vấn đề cấp kho, không nằm trong câu chữ nào)"
      problem: >
        Kho đang có HAI bài Sao Mộc cùng ở trạng thái PUBLISHED:
