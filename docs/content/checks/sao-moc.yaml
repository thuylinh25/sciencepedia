        Nằm ở summary, summaryEn và seoDescription — tức ở thẻ bài, ở kết quả tìm
        kiếm, ở mọi chỗ trích dẫn bài này, chứ không ở thân bài.
        Lượt đính chính 2026-09-05 đã sửa đúng chỗ này trong cột content: "được
        theo dõi liên tục từ khoảng năm 1831", kèm giải thích Vết Vĩnh cửu của Cassini
