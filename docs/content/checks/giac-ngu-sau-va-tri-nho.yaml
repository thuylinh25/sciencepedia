    beta-amyloid", không nêu loài, không nêu tranh cãi, quy việc mô tả hệ
    glymphatic cho năm 2013.
    Mới: nêu rõ phép đo thực hiện trên CHUỘT; giữ nguyên mệnh đề dè dặt "có thể"
    của chính bài báo; nêu rõ kết quả đang bị tranh cãi; trả việc mô tả hệ
    glymphatic về năm 2012.
    Căn cứ: Xie et al., Science 2013, 10.1126/science.1241224 — abstract nguyên
    văn "in live mice ... a 60% increase in the interstitial space" và "the
    restorative function of sleep MAY BE a consequence". Iliff et al., Sci Transl
    Med 2012, 10.1126/scitranslmed.3003748 mới là bài mô tả hệ glymphatic. Miao,
    Luo et al., Nature Neuroscience 2024, 27:1046-1050, 10.1038/s41593-024-01638-y
    — "Brain clearance is reduced during sleep and anesthesia".
    Kèm theo: thêm mục có tiêu đề "Khi nào vệ sinh giấc ngủ là không đủ".

