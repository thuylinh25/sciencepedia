  replacement_text:

    R1:
      replaces: "toàn bộ mục '## Dọn dẹp chất thải', cả hai đoạn"
      text: |
        ## Dọn dẹp chất thải

        Năm 2012, nhóm của Maiken Nedergaard mô tả **hệ glymphatic** — một đường
        dẫn dịch chạy dọc theo thành mạch máu, qua đó dịch não tuỷ trao đổi với
        dịch gian bào và cuốn theo các sản phẩm chuyển hoá.

        Năm 2013, cũng nhóm này báo cáo rằng ở **chuột**, khi con vật ngủ tự
        nhiên hoặc bị gây mê, khoảng gian bào trong não giãn ra khoảng 60% và
        beta-amyloid — protein tích tụ trong bệnh Alzheimer — được dọn đi nhanh
        gấp đôi so với lúc thức. Chính bài báo ấy chỉ viết rằng chức năng phục
        hồi của giấc ngủ **có thể** là hệ quả của việc thải chất thải mạnh hơn.

        Hai giới hạn cần nói rõ. Thứ nhất, đây là phép đo trên chuột; chưa có
        phép đo tương đương trên người. Thứ hai, kết quả này **đang bị tranh
        cãi**: năm 2024, một nhóm khác dùng cách đo khác — tiêm chất đánh dấu
        thẳng vào mô não thay vì vào dịch não tuỷ — và báo cáo điều ngược lại,
        rằng não thải chất *chậm đi* khi ngủ và khi gây mê. Nhóm của Nedergaard
        đã phản bác phương pháp đó. Tranh luận chưa ngã ngũ.

        Vì vậy, "ngủ đủ để rửa trôi protein Alzheimer" hiện là một giả thuyết
        đang được kiểm chứng, không phải một cơ chế đã xác lập ở người. Thiếu ngủ
        mạn tính có tương quan với nguy cơ thoái hoá thần kinh trong các nghiên
        cứu quan sát, nhưng chiều nhân quả vẫn chưa rõ — bản thân thoái hoá thần
        kinh cũng phá giấc ngủ.

    R2:
      inserts: "mục mới, đặt NGAY TRƯỚC dòng miễn trừ y tế ở cuối bài"
      mandatory: true
      note: >
        Câu về chống chỉ định y tế phải là nguyên văn của editor. Người khác diễn
        đạt lại thì nó không còn là câu đã qua gate.
      text: |
        ## Khi nào vệ sinh giấc ngủ là không đủ

        Những gợi ý ở trên dành cho người ngủ kém vì thói quen. Chúng không thay
        thế việc khám bệnh, và có những dấu hiệu cần đi khám thay vì tự điều
        chỉnh:

        - **Ngáy to kèm những quãng ngừng thở, hoặc người ngủ cùng chứng kiến bạn
          ngừng thở khi ngủ.** Đây là dấu hiệu của ngưng thở khi ngủ do tắc nghẽn
          — bệnh này cần chẩn đoán bằng đo đa ký giấc ngủ, và không một biện pháp
          vệ sinh giấc ngủ nào chữa được nó.
        - **Buồn ngủ nhiều ban ngày dù đã nằm trên giường đủ 7 giờ trở lên**, đặc
          biệt nếu bạn từng ngủ gật khi lái xe.
        - **Mất ngủ kéo dài trên ba tháng, từ ba đêm mỗi tuần trở lên.** Ở mức
          này, điều trị hàng đầu là liệu pháp nhận thức hành vi cho mất ngủ
          (CBT-I), và nó cần người hướng dẫn chứ không phải một danh sách mẹo.
        - **Cảm giác bứt rứt ở chân về đêm buộc bạn phải cử động mới dễ chịu.**
        - **Mất ngủ đi kèm khí sắc trầm, mất hứng thú kéo dài, hoặc ý nghĩ về cái
          chết.** Rối loạn giấc ngủ và trầm cảm thường đi cùng nhau và cần được xử
          lý cùng nhau.

        Không tự dùng thuốc ngủ hay melatonin kéo dài khi chưa có chỉ định: chúng
        làm dịu triệu chứng của những tình trạng trên và vì thế làm chậm chẩn đoán.

    R3:
      replaces: >-
        "Cắt ngắn giấc ngủ hai tiếng cuối không làm mất 'một phần đều' của mọi
        giai đoạn — nó cắt gần như trọn phần REM."
      text: |
        Cắt ngắn giấc ngủ hai tiếng cuối không làm mất một phần đều của mọi giai
        đoạn: các đợt REM dài nhất nằm ở những chu kỳ cuối, nên phần bị mất
        nghiêng hẳn về REM thay vì chia theo đúng tỉ lệ thời lượng ở bảng trên.

