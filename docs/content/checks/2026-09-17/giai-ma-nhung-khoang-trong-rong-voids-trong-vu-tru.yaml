openQuestions:
  - "Nhiệt độ động học của khí trong void khác nhiệt độ CMB bao nhiêu? Lượt này không mở được nguồn bậc 1 (công cụ tìm kiếm lỗi), nên chưa viết được thay thế; cần nguồn trước khi bài nói gì về 'nhiệt độ của void'."
  - "Con số 330 triệu năm ánh sáng cho Boötes Void phổ biến trên nguồn đại chúng nhưng chưa đối chiếu được với bài gốc 1981/1987 (ADS chặn truy cập tự động). Cần người mở toàn văn."
  - "Bài xuất bản 2026-09-08 với 0 nguồn, nghĩa là nó đã lọt qua gate chính xác. Cần gỡ xuống ngay và điều tra đường xuất bản nào cho phép bài 0 nguồn ở trạng thái PUBLISHED."
