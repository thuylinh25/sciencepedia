openQuestions:
  - "Vai trò giấc ngủ trong thanh thải chất thải của não đang có kết quả trái ngược (Xie 2013 và Miao 2024, đều trên chuột). Biên tập cần quyết giữ mục này dưới dạng “tranh cãi đang mở” hay cắt hẳn khỏi bài phổ thông."
  - "Hai trang NHLBI không hiển thị năm xuất bản trong lượt kiểm này; khi gắn citation cần ghi accessedAt thay cho năm."
  - "Bài đang ở trạng thái PUBLISHED dù brief ghi PENDING. Cần người quyết có gỡ xuống trong lúc sửa (S2 về glymphatic) hay giữ nguyên chờ bản sửa."
