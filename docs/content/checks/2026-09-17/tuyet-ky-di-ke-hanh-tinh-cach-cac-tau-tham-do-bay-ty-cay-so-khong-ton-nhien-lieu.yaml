openQuestions:
  - "Slug bài này (“tuyet-ky-di-ke-hanh-tinh-cach-cac-tau-tham-do-bay-ty-cay-so-khong-ton-nhien-lieu”) mô tả chủ đề trợ giúp hấp dẫn, trong khi nội dung là “vì sao không bay vuông góc khỏi Hoàng Đạo”. Bài song sinh “tuyet-ky-di-ke-hanh-tinh-cach-tau-vu-tru-bay-hang-ty-kilomet-ma-khong-ton-them-nhien-lieu” (cùng ngày xuất bản 16/09/2026) mới đúng chủ đề slug. Hai bài KHÔNG trùng lặp toàn văn nhưng chồng lấn: cùng khung “xa lộ Hoàng Đạo”, cùng cụm “máy gia tốc miễn phí”, cùng lập luận tiết kiệm năng lượng khi bay dọc Hoàng Đạo. Cần người quyết: đổi slug + redirect cho bài này và cắt phần chồng lấn, hay gộp thành một bài."
