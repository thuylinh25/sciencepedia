openQuestions:
  - "Kiểm song trùng với “tuyet-ky-di-ke-hanh-tinh-cach-cac-tau-tham-do-bay-ty-cay-so-khong-ton-nhien-lieu”: không trùng toàn văn (bài kia bàn vì sao không bay vuông góc khỏi Hoàng Đạo), nhưng hai slug gần như trùng, xuất bản cùng ngày 16/09/2026, và chồng lấn ở khung “xa lộ Hoàng Đạo”, cụm “máy gia tốc miễn phí”, lập luận tiết kiệm năng lượng. Slug của bài kia sai chủ đề. Cần người quyết: giữ slug này cho chủ đề trợ giúp hấp dẫn, đổi slug + redirect cho bài kia và cắt phần chồng lấn, hay gộp hai bài."
  - "Bài 0 nguồn nhưng hồ sơ ghi status PUBLISHED, với lỗi quy kết Voyager đang hiển thị công khai — cần đính chính công khai theo chính sách, không sửa lặng lẽ."
