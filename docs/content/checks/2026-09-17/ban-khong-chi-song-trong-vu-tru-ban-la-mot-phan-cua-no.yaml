openQuestions:
  - "Số thiên hà trong vũ trụ quan sát được là một con số đang tranh luận: ước lượng 2 nghìn tỷ của Conselice 2016 (ngoại suy các thiên hà quá mờ) so với các phép đo ánh sáng nền quang học cho con số thấp hơn. Biên tập không phân xử. Bài phải nêu con số kèm năm và kèm một câu nói rõ là chưa thống nhất."
  - "Dấu vết sự sống sớm nhất (~3,7 tỷ năm, stromatolite Isua) còn bị phản bác là cấu trúc địa chất phi sinh học. Nếu lượt sửa muốn đưa mốc sự sống vào bài, phải nêu cả phản biện, hoặc lùi về mốc ~3,5 tỷ năm vững hơn ở Tây Úc. Chưa mở kiểm tại nguồn trong lượt này."
  - "Bài xếp category 'Vũ trụ' còn bài cùng lô xếp 'Vũ trụ học'. Cần category-manager gộp lại — hai bài này chồng lấn nội dung đáng kể (bụi sao, tuổi vũ trụ, giãn nở) và nên được knowledge-architect rà trùng lặp trước khi tái xuất bản."
