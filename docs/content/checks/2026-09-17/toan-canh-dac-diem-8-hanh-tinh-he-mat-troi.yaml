openQuestions:
  - "Dòng “Biên tập lại từ bài… Bản quyền nội dung gốc thuộc về VACA”: bài là tác phẩm phái sinh từ một nguồn nay không truy cập được — cần người quyết có giữ nội dung phái sinh và dòng ghi công này, hay viết lại độc lập từ nguồn bậc 1–2."
  - "Cột vệ tinh gộp ba tiêu chí đếm khác nhau của NASA (IAU công nhận / confirmed / known). Có chuẩn hoá về một tiêu chí duy nhất không?"
