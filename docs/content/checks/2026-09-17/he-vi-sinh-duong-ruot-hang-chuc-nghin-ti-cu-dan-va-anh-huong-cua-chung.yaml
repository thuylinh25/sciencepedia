openQuestions:
  - "Chồng lấn nội dung: bài này, 'ruot-he-vi-sinh-vat-va-quyen-luc-cua-bo-nao-thu-hai' và 'nhin-an-gian-doan-...' cùng trình bày trục ruột–não, danh sách hormone đói/no và lời khuyên ăn uống (rau, chất xơ, thực phẩm lên men). Cần knowledge-architect quyết định bài nào giữ phần nào (đề xuất: bài này là bài gốc về hệ vi sinh; bài 'bộ não thứ hai' chỉ giữ ENS + dây phế vị; bài nhịn ăn chỉ giữ IF), hoặc gộp lại."
  - "Bài đang ở trạng thái PUBLISHED dù chưa qua gate chính xác. Có hạ xuống chờ sửa hay giữ online kèm ghi chú đính chính công khai (quy tắc 9) không? Cần người quyết."
