openQuestions:
  - "Hồ sơ ghi status PUBLISHED dù nguồn duy nhất thiếu url/doi/accessedAt — gate xuất bản đã cho qua thế nào? Cần kiểm lại scripts/publish.ts."
  - "Trang Pogge không ghi năm cập nhật; trường year để trống, người sửa bài điền nếu tìm được."
