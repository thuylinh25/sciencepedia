openQuestions:
  - Nguồn gốc Phobos và Deimos (bị bắt giữ vs bồi tụ từ đĩa mảnh vỡ) là tranh cãi thật. Bài đang trình bày đúng mực — giữ nguyên, chỉ cần nguồn tier 1 cho bằng chứng quang phổ và quỹ đạo. Lưu ý trang NASA Moons (2024) nghiêng về giả thuyết bắt giữ, khác giọng với JAXA.
  - Sao Hoả cổ "ấm và ẩm" hay "lạnh và băng giá với các đợt tan chảy" — tranh luận mở, bài không được chọn phe.
  - Độ cao Olympus Mons nên dùng thước đo nào cho toàn kho (21,9 km trên mốc chuẩn vs hơn 40 km từ chân tới đỉnh của NASA)? Cần một quyết định chung để bài 8 hành tinh và bài này không lệch nhau.
  - Nước của Sao Hoả mất đi đâu — thoát vào không gian, đóng băng dưới đất, hay bị giữ trong khoáng vật vỏ — tỉ lệ vẫn là câu hỏi nghiên cứu.
