openQuestions:
  - "Bài có nên nêu cả việc Mặt Trăng và các hành tinh còn đi qua những chòm sao ngoài 13 chòm này (vì quỹ đạo nghiêng so với Hoàng Đạo)? Mở rộng phạm vi thì cần nguồn riêng; nên để người quyết."
