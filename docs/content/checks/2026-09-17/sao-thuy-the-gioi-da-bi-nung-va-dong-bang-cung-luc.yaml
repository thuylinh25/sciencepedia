openQuestions:
  - Nguồn gốc lõi kim loại chiếm 85% bán kính vẫn chưa ngã ngũ (va chạm khổng lồ vs phân tách trong tinh vân vs nhiều va chạm xói mòn). Bài không được chọn phe — cần người quyết cách trình bày, đề xuất là nêu cả ba và ghi rõ chưa có đồng thuận.
  - Có nên giữ tuyên bố về băng nước ở cực ở mức "nhiều khả năng" (theo giọng của NASA Science) hay mức "đã xác lập" (theo giọng của Lawrence et al. 2013)? Hai nguồn tier 1–2 khác giọng nhau; editor cần chốt một chuẩn.
