openQuestions:
  - "Hai nguồn MHRA/FDA dùng chữ “first”. Người biên tập cần quyết có thêm “tính đến 2023” hay coi đây là mốc lịch sử không cần hẹn ngày kiểm lại."
  - "Nguồn bậc 1–2 cho vụ He Jiankui và cho khung pháp lý chỉnh sửa dòng mầm chưa được mở trong lượt này — content-research cần tìm."
