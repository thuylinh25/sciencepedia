openQuestions:
  - "Bài đang PUBLISHED với 0 nguồn. Nội dung không sai nên đề xuất bổ sung nguồn tại chỗ và ghi chú cập nhật công khai, không cần gỡ — cần người xác nhận."
  - "Các trang giáo dục NOAA không hiển thị năm xuất bản trong phần trích được — người gắn nguồn ghi accessedAt thay cho năm."
