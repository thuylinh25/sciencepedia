openQuestions:
  - "Bài đang ở trạng thái PUBLISHED dù chưa qua gate chính xác. Gỡ xuống ngay, hay sửa tại chỗ kèm ghi chú đính chính công khai (quy tắc 9) cho hai lỗi S2?"
  - "Căng thẳng Hubble chưa ngã ngũ. Ngoài Planck và SH0ES còn các phép đo khác chưa được kiểm trong lượt này; cần người quyết bài nêu bao nhiêu phép đo, miễn không chọn bên."
  - "Tuổi 13,797 tỷ năm phụ thuộc vào ΛCDM và H0. Có cần ghi chú điều này ngay dưới tiêu đề '13,8 tỉ năm' không?"
  - "Điều phối viên nói domain thienvanvietnam.org đã chết, nhưng lượt kiểm ngày 17/09/2026 thấy trang vẫn trả HTTP 200 với đúng tiêu đề. Cần kiểm lại trước khi đánh dấu link hỏng; kết luận hạ tier không đổi dù link sống hay chết."
