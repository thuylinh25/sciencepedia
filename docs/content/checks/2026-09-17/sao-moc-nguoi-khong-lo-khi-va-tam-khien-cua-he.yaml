openQuestions:
  - "Sao Mộc làm GIẢM hay TĂNG tốc độ va chạm lên Trái Đất? Horner & Jones (2008) cho thấy với tiểu hành tinh nó có thể làm tăng; kết quả phụ thuộc quần thể thiên thể và giả định mô phỏng. Đây là tranh cãi khoa học — bài chỉ nên trình bày hai phía, không kết luận. Cần người quyết tiêu đề có giữ chữ 'tấm khiên' không."
  - "NASA Jupiter Facts vẫn ghi Vết Đỏ Lớn 'observed for more than 300 years', mâu thuẫn Sánchez-Lavega 2024. Cần chốt chính sách: khi outreach bậc 2 lạc hậu so với bài peer-review, ưu tiên bậc 1 và nêu rõ."
  - "Không cần đối chiếu IAU MPC / JPL SSD: bài không nêu số vệ tinh. Nếu bổ sung: KHÔNG dùng số 95 của Fact Sheet (02/10/2024) hay NASA Jupiter Facts — đã lạc hậu; scripts/apply-corrections-2026-09-13.ts ghi 115 theo NASA tháng 8/2026 (lượt này chưa mở lại nguồn đó). Phải đối chiếu IAU MPC / JPL SSD tại thời điểm viết và kèm mốc ngày."
