openQuestions:
  - "Kết quả tìm kiếm cho thấy có các bài phân tích lại thiết kế và thống kê của Carlson (1985) và đi tới kết luận khác, nhưng những bài tôi thấy đăng ở kênh ủng hộ chiêm tinh, không phải nguồn bậc 1–2, và tôi chưa mở kiểm. Có nên nêu rằng nghiên cứu này từng bị phản biện? Nếu có, cần tìm phản biện hoặc phúc đáp đã qua bình duyệt. Người biên tập không tự phân xử tranh cãi này."
