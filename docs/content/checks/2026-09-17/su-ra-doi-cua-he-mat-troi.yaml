openQuestions:
  - "C-11 được đánh S2 dựa trên lập luận vật lý (di cư hành tinh không làm Mặt Trời mất động lượng góc) nhưng chưa mở được nguồn review bậc 1 nói thẳng điều này trong lượt này. Cần người duyệt xác nhận bằng một bài review về bài toán động lượng góc trước khi đóng."
  - "Các bài báo đỡ tuổi CAI (Connelly 2012) chỉ truy cập được qua bản ghi tìm kiếm (ADS/PubMed chặn). Có chấp nhận DOI 10.1126/science.1226919 làm nguồn khi chưa ai mở toàn văn không?"
