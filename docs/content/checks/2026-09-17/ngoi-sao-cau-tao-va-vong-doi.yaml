openQuestions:
  - "Kho có nên chuẩn hóa một quy ước ghi thành phần hóa học (theo khối lượng hay theo số nguyên tử) cho mọi bài về sao? Hiện hai cách cho số rất khác nhau (71% so với 91% hydro)."
