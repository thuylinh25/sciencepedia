openQuestions:
  - "Chồng lấn với 'he-vi-sinh-duong-ruot-...' (SCFA/butyrate, đa dạng) và 'ruot-he-vi-sinh-vat-...' (hormone đói/no). Đề xuất bài này chỉ giữ phạm vi IF × hệ vi sinh; knowledge-architect quyết định."
  - "Bài sức khoẻ đang PUBLISHED với 0 nguồn và có lời khuyên chống chỉ định không dẫn hướng dẫn nào. Khuyến nghị gỡ xuống cho tới khi viết lại; cần người quyết."
  - "Mục chống chỉ định cần một người có chuyên môn y khoa duyệt sau khi gắn nguồn — science-editor kiểm nguồn nhưng không thay được phán quyết lâm sàng."
