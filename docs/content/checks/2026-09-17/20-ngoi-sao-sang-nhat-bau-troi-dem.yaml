openQuestions:
  - "Bảng nên xếp theo cấp sao gộp (gần với cảm nhận mắt thường, vì mắt không tách được A/B) hay theo từng sao mang tên IAU? Người quyết cần chọn trước khi sửa, vì hai cách cho thứ hạng khác nhau."
  - "Khoảng cách nên theo Hipparcos (bản rút gọn 2007) hay Gaia DR3? Với sao rất sáng như Rigel, Deneb, Betelgeuse, trắc lượng Gaia có thể kém tin cậy; cần một quy ước chung cho toàn kho."
