openQuestions:
  - "Tuổi vành đai Sao Thổ vẫn tranh luận: nghiên cứu trọng trường (Iess 2019) và bụi vi thiên thạch (Kempf 2023) cho 'trẻ'; tìm kiếm cho thấy có bài Icarus 2026 'Saturn's rings age, I: Reconsideration of the exposure age' (ScienceDirect trả 403, CHƯA mở được nên chưa dùng). Cần người mở bài đó trước khi bài viết khẳng định vành đai 'trẻ'."
  - "Lục giác cực bắc có còn quan sát được sau khi Cassini kết thúc (2017) không, và có 'duy nhất' không — cần nguồn quan sát mới."
  - "Không cần đối chiếu IAU MPC / JPL SSD: bài không nêu số vệ tinh. Nếu bổ sung: KHÔNG dùng số 274 'as of March 2025' của NASA Saturn Facts bản đã mở — scripts/apply-corrections-2026-09-13.ts ghi 293 theo NASA tháng 8/2026 (lượt này chưa mở lại nguồn đó). Phải đối chiếu IAU MPC / JPL SSD tại thời điểm viết và kèm mốc ngày."
