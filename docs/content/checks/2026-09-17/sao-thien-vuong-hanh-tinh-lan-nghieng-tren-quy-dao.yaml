openQuestions:
  - "NASA có hai con số nhiệt độ tối thiểu: Fact Sheet 53 K (-220°C, ở 0,1 bar) và Uranus Facts 49 K (-224,2°C). Cần chốt dùng số nào và ghi rõ điều kiện đo."
  - "Không cần đối chiếu IAU MPC / JPL SSD: bài không nêu số vệ tinh. Nếu bổ sung: KHÔNG dùng số 28 của Fact Sheet / NASA Uranus Facts bản đã mở — scripts/apply-corrections-2026-09-13.ts ghi 29 theo NASA tháng 8/2026 (lượt này chưa mở lại nguồn đó). Phải đối chiếu IAU MPC / JPL SSD và kèm mốc ngày."
