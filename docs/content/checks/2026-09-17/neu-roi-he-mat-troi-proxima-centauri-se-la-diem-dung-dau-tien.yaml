openQuestions:
  - "Proxima c có còn nằm trong danh mục NASA Exoplanet Archive không? Hai tín hiệu trong lượt này mâu thuẫn nhau; cần mở trực tiếp Archive."
  - "Tiêu đề “điểm dừng đầu tiên” mang hàm ý dừng lại, trong khi dự án thật duy nhất được nêu là bay ngang. Cần người quyết có đổi tiêu đề không (ảnh hưởng slug/SEO)."
