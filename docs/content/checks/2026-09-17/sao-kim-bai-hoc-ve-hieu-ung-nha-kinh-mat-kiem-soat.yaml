openQuestions:
  - Sao Kim từng có đại dương nước lỏng hay chưa bao giờ có? NASA Science (cập nhật 09/2026) vẫn viết "Venus' vanished ocean", còn Constantinou et al. 2024 (Nature Astronomy) kết luận phần bên trong quá khô để từng có đại dương. Tranh cãi thật — bài không được chọn phe; editor cần quyết cách trình bày cả hai.
  - Nguyên nhân Sao Kim quay ngược (va chạm lớn, thuỷ triều khí quyển, hay lật trục) là câu hỏi mở; nếu giữ câu này phải có nguồn tổng quan tier 1.
  - Số nhiệt độ/áp suất chuẩn nào dùng toàn kho — NSSDC (464°C, 92 bar) hay NASA Science 2026 (467°C, 93 lần)? Cần một quyết định chung để các bài hành tinh không lệch nhau.
