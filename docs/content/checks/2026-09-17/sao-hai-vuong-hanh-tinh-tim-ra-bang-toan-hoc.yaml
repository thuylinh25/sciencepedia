openQuestions:
  - "Quyền ưu tiên dự đoán Sao Hải Vương: đồng thuận thế kỷ 19 chia công Le Verrier–Adams; các tài liệu 'Neptune papers' được tìm lại cuối thập niên 1990 khiến một số sử gia (vd. Kollerstrom) cho rằng Adams được ghi công nhiều hơn mức xứng đáng. Bài KHÔNG nên phân xử; cần người quyết cách trình bày và tìm nguồn sử học peer-review (Sky & Telescope và bài peer-review về Neptune papers trả 403, chưa mở được)."
  - "Số phận Triton (vỡ thành vành đai hay va vào Sao Hải Vương) phụ thuộc mô hình thuỷ triều; cần mở Chyba et al. 1989 trước khi giữ bất kỳ câu nào về tương lai Triton."
  - "Không cần đối chiếu IAU MPC / JPL SSD: bài không nêu số vệ tinh. Lưu ý Fact Sheet ghi 16 (cập nhật 03/10/2024) — nếu bổ sung phải đối chiếu MPC và kèm mốc ngày."
