openQuestions:
  - "Tegmark coi Cấp I là 'không gây tranh cãi'. Có trình bày Cấp I khác các cấp còn lại không, hay giữ mọi cấp ở dạng giả thuyết có điều kiện? Cần người quyết, có nguồn cho cả hai phía."
  - "Có tìm kiếm va chạm bong bóng nào sau 2011 (dữ liệu Planck) không? Lượt này chưa kiểm; lượt sửa phải kiểm rồi mới được viết 'cho tới nay'."
  - "Bài đang PUBLISHED với một nguồn nghiệp dư duy nhất. Gỡ xuống hay sửa tại chỗ kèm ghi chú đính chính?"
