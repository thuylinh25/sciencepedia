openQuestions:
  - "Chồng lấn: mục 'Hệ vi sinh vật đường ruột', danh sách hormone đói/no và mục 'lập trình lại hệ vi sinh' trùng với bài 'he-vi-sinh-duong-ruot-...' và bài 'nhin-an-gian-doan-...'. Đề xuất bài này chỉ giữ phạm vi ENS + dây phế vị + serotonin ngoại vi; knowledge-architect quyết định."
  - "Bài đang PUBLISHED với 0 nguồn và claim nhân quả trên người. Gỡ xuống hay giữ kèm ghi chú đính chính công khai trong lúc viết lại? Cần người quyết (quy tắc 9: không sửa lặng lẽ)."
