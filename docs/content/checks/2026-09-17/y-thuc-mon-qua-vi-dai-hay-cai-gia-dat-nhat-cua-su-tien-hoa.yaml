openQuestions:
  - "Bài này có nên tồn tại dưới dạng mục từ bách khoa không? Sau khi cắt hết các câu không kiểm được, phần còn lại gần như không còn nội dung. Đề xuất: hoặc chuyển sang chuyên mục tuỳ bút có nhãn rõ ràng và có ký tên tác giả, hoặc viết lại hoàn toàn thành mục từ 'Tự nhận thức' bám vào tài liệu thực nghiệm. Cần content-curator và knowledge-architect quyết trước khi giao lại lượt viết."
  - "Ý thức và tự nhận thức là vùng chưa có đồng thuận (vấn đề khó của ý thức, các lý thuyết cạnh tranh). Biên tập không phân xử. Nếu vẫn giữ chủ đề, phải chốt trước: bài trình bày theo khung lý thuyết nào và nói rõ tên khung đó ngay trong bài."
  - "Nghiên cứu tử vong học so sánh trả 403 khi mở trực tiếp trong lượt này. Cần mở lại và trích đúng câu chữ trước khi dùng làm nguồn."
