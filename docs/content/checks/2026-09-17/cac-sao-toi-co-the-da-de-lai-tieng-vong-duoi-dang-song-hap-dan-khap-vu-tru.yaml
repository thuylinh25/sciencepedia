openQuestions:
  - "Bài đang PUBLISHED với 0 nguồn. Cần xác định vì sao gate publish (scripts/publish.ts) không chặn một bài không có nguồn."
  - "arXiv:2511.08578 là tiền ấn phẩm: cần quyết định có chấp nhận làm nguồn cho khoảng khối lượng hay chờ bản bình duyệt."
  - "Lỗ đen thời kỳ đầu do JWST phát hiện có thật sự «quá nặng» hay chỉ do thiên lệch quan sát vẫn đang tranh luận. Editor không phân xử."
