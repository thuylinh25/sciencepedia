openQuestions:
  - "Có thể bài “A guide to adaptive immune memory” (Nature Reviews Immunology 2024) là thứ generator định trích nhưng nhớ sai tên và năm. Không được tự thay — cần người mở và đối chiếu từng claim trước khi dùng."
  - "Bài đang PUBLISHED với một citation bịa. Theo chính sách đính chính hiển thị, cần người quyết gỡ bài ngay hay gắn ghi chú đính chính trong lúc chờ viết lại."
