openQuestions:
  - "Bài nên nói 'thiên hà xa nhất' (kỷ lục, đổi liên tục, phải kiểm lại định kỳ) hay chỉ nói khoảng thời gian (khoảng 300 triệu năm sau Big Bang) kèm mốc năm? Cách thứ hai bền hơn; người quyết chọn."
