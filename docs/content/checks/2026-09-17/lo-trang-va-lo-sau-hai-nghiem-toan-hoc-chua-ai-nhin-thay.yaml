openQuestions:
  - "Điều phối viên báo domain thienvanvietnam.org đã chết, nhưng trong lượt này cả hai URL VACA trả HTTP 200 kèm nội dung bài thật (17/09/2026). Có thể lỗi do mạng/vùng; cần người kiểm lại. Dù thế nào, kết luận về tier vẫn không đổi."
  - "Mục «Vì sao nhà vật lý vẫn nghiên cứu» (liên hệ thông tin lượng tử, hấp dẫn lượng tử) được viết dè dặt nhưng không có nguồn. Cần quyết định giữ kèm nguồn tổng quan hay cắt."
