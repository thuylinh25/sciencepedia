openQuestions:
  - "Thời điểm dynamo Sao Hoả ngừng hoạt động còn tranh luận (4,1–4,0 tỉ năm theo từ tính bồn va chạm; ~3,9 tỉ năm theo Steele et al. 2023). Bài không nên chọn phe; cần người quyết cách diễn đạt."
  - "Vai trò bảo vệ khí quyển của từ trường hành tinh vẫn đang tranh luận. Bài phải giữ đúng mức “đang tranh luận” ở mọi đoạn, không chỉ trong khung trích dẫn."
