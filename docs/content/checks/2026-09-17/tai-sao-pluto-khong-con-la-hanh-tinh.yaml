openQuestions:
  - "Bài là bản biên tập lại từ một trang VACA nay không truy cập được và ghi “Bản quyền nội dung gốc thuộc về VACA” — cần người quyết có giữ bản phái sinh này hay viết lại độc lập từ nguồn bậc 1–2."
  - "Hộp khuyên dùng “Pluto” thay “Sao Diêm Vương” là quy ước biên tập, không phải phát hiện khoa học — cần xác nhận đây là quy ước chính thức của SciencePedia (và nhất quán với các bài khác) trước khi giữ."
