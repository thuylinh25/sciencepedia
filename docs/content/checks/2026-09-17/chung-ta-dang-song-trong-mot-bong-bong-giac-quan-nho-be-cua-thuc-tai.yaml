openQuestions:
  - "Bài có được phép giữ khung 'não dựng mô hình thực tại' làm khung chủ đạo không? Đây là tranh luận còn mở giữa hiện thực luận gián tiếp / xử lý tiên đoán và các lập trường hiện thực trực tiếp. Nếu giữ, phải nêu tên khung và nói rõ là một khung lý thuyết. Biên tập không tự phân xử."
  - "Hai ví dụ hạ âm voi và định vị bằng tiếng vang: giữ kèm nguồn, hay cắt để rút ngắn bài? Cần người quyết vì đây là đánh đổi độ dài, không phải đánh đổi độ chính xác."
  - "Bài xếp category 'Sinh học' nhưng nửa nội dung là vật lý phổ điện từ và nhận thức luận. Cần knowledge-architect xác nhận vị trí taxonomy trước khi tái xuất bản."
