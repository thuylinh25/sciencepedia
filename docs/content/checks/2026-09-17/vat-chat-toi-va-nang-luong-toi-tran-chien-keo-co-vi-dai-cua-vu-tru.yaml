openQuestions:
  - "Bài đang PUBLISHED với một nguồn nghiệp dư duy nhất. Gỡ xuống cho tới khi viết lại, hay giữ và gắn nhãn đính chính?"
  - "Căng thẳng Hubble chưa ngã ngũ; cần người quyết phạm vi trình bày (bao nhiêu phép đo) với điều kiện không chọn bên."
  - "Có nhắc giả thuyết hấp dẫn sửa đổi (thay cho vật chất tối) không, và ở mức nào để không tạo cân bằng giả? Cần nguồn bậc 1 trước khi quyết."
  - "Điều phối viên nói domain thienvanvietnam.org đã chết, nhưng ngày 17/09/2026 URL vẫn trả HTTP 200 với đúng tiêu đề. Cần kiểm lại; kết luận hạ tier không đổi."
