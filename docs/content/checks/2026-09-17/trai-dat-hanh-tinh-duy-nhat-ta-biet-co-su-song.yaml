openQuestions:
  - Sao Kim từng có đại dương hay không — NASA Science và Constantinou et al. 2024 trái ngược nhau. Editor quyết cách trình bày thống nhất cho cả bài Trái Đất và bài Sao Kim.
  - Mức độ Mặt Trăng cần thiết cho sự ổn định khí hậu (Laskar 1993 vs Lissauer 2012) — bài chỉ nên nêu tranh luận, không kết luận.
  - Từ trường có thật sự bảo vệ khí quyển hay không (Gunell et al. 2018 thách thức quan điểm phổ biến) — cần chốt giọng trình bày cho cả bài Trái Đất và bài Sao Hoả, vì hai bài đang dùng cùng một khẳng định.
  - Số liệu nước ngọt 2,5% của USGS chưa đọc được toàn văn ở lượt này (trang chặn truy cập tự động) — cần người mở trang xác nhận trước khi dẫn.
