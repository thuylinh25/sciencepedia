openQuestions:
  - "Chọn giá trị nào cho tốc độ quay quanh Ngân Hà: 230 km/s (NASA, phổ thông, nhất quán với chu kỳ 230 triệu năm mà bài đang dùng) hay 240 ± 8 km/s (Reid 2014, đo lường hiện hành)? Hai con số kéo theo hai chu kỳ khác nhau. Cần chốt một và dùng nhất quán toàn kho, không để mỗi bài một số."
  - "Mốc giải Nobel Vật lý 2011 cho phát hiện giãn nở tăng tốc chưa mở kiểm được (nobelprize.org trả HTTP 403 trong lượt này). Phải kiểm lại tại nguồn trước khi đưa vào bài."
  - "Cần nguồn bậc 1-2 cho hai đoạn vật lý vi mô (nhiệt độ - động năng, năng lượng điểm không). Chưa kiểm được trong lượt này; nếu lượt sau vẫn không có nguồn thì cắt cả hai đoạn theo quy tắc 'nghi ngờ thì cắt'."
