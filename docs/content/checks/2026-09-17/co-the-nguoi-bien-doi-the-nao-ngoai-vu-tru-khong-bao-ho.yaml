openQuestions:
  - "Năm của sự cố buồng chân không: trang NASA Imagine ghi 1965; các nguồn phổ thông thấy qua tìm kiếm (chưa mở, không phải bậc 1–2) ghi 14/12/1966 và tên Jim LeBlanc. Cần tìm hồ sơ gốc của NASA JSC trước khi ghi năm hoặc tên người."
  - "Hai nguồn NASA khác nhau về máu: SP-3006 nói hơi nước vẫn hình thành trong máu tĩnh mạch, trang Imagine nói máu không sôi chừng nào huyết áp trên 47 mmHg. Không tự phân xử — bài nên nêu cả hai: động mạch được huyết áp giữ lúc đầu, tĩnh mạch thì không."
  - "Các bài khác (giac-ngu-sau…, crispr…) có link “Đọc thêm” tới slug dieu-gi-se-xay-ra-neu-con-nguoi-ra-ngoai-vu-tru-ma-khong-co-bo-do-vu-tru, khác slug bài này. Có thể là bài trùng chủ đề hoặc link chết — content-curator cần kiểm."
  - "Bài 0 nguồn đang PUBLISHED, vượt qua gate xuất bản. Cần backend-architect/content-curator kiểm vì sao scripts/publish.ts cho qua, và người quyết gỡ bài trong lúc chờ sửa."
