openQuestions:
  - "Số phận Ngân Hà–Andromeda là tranh luận mở (Sawala 2025 ~50% và Wu 2026 90%). Editor không phân xử; bài phải trình bày cả hai kết quả."
  - "Chưa kiểm được ở nguồn bậc 1–2 việc Mây Magellan Lớn nên xếp là thiên hà không định hình hay xoắn ốc Magellan; cần kiểm trước khi giữ làm ví dụ."
  - "Điều phối viên báo thienvanvietnam.org đã chết, nhưng trong lượt này URL trả HTTP 200. Cần người kiểm lại."
