openQuestions:
  - "Quyền sử dụng: bài ghi 'Biên tập lại từ bài ... Bản quyền nội dung gốc thuộc về VACA'. Có giấy phép tái sử dụng/phái sinh không? Nếu viết lại hoàn toàn từ nguồn peer-review thì dòng ghi công này có còn đúng không? Cần người quyết."
  - "Tỉ lệ loài biển biến mất: 81% (Stanley 2016, rarefaction) và 90–96% (Raup; vẫn được Chen & Benton 2012 dùng) phản ánh khác biệt phương pháp. Science-editor không phân xử — bài nên trình bày cả hai."
  - "Bài đang PUBLISHED với con số không có nguồn đỡ. Đăng đính chính công khai cho các con số đổi (quy tắc 9) hay gỡ xuống trong lúc dựng lại? Cần người quyết."
