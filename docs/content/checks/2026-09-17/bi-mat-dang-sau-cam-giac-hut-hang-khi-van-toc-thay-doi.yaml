openQuestions:
  - "Trong tiếng Việt, “hụt hẫng” thường gợi cảm giác rơi khi thang máy/tàu lượn đi xuống (giảm trọng lượng biểu kiến, gia tốc theo phương thẳng đứng), nhưng bài chỉ bàn xe tăng/giảm tốc theo phương ngang. Cần quyết phạm vi bài: đổi tên cho khớp nội dung hay bổ sung phần gia tốc thẳng đứng."
