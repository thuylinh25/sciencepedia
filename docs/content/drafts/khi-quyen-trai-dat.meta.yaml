cut_candidates:
  - where: 'Mục "Áp suất là trọng lượng của cột khí bên trên"'
    what: "Câu suất giảm nhiệt 6,49 °C/km."
    why_safe: >
      N7 nói rõ con số này vào bài với vai trò ĐỐI CHIẾU chéo giữa s4 và s7,
      và "bài không nêu ví dụ 27 °C này". Nó không đỡ mệnh đề nào khác trong
      bài. Cắt nó không đụng vào N5 (áp suất một nửa) vốn là ý chính của mục.
  - where: 'Mục "Không khí gồm những gì"'
    what: "Câu đối chiếu 427,04 ppm của tháng 5/2025."
    why_safe: >
      N4 cho phép dùng nhưng không bắt buộc, và cảnh báo phải kèm mệnh đề
      "không phải tốc độ tăng hằng năm" — tức nó tốn thêm chữ để dùng cho
      đúng. Cắt cả cặp thì rẻ hơn giữ.
    caution: "Cắt xong PHẢI còn: 428,73 ppm + 'tháng 5/2026' + mệnh đề sơ bộ (ràng buộc 2)."
  - where: "Toàn bài"
    what: "Câu chuyển ý và đoạn nhắc lại."
    why_safe: >
      docs/content-rules.md cho phép cắt bốn loại: đoạn khai triển, ví dụ phụ,
      câu chuyển ý, đoạn nhắc lại. Đây là loại rẻ nhất, cắt trước.
  - id: DO_NOT_CUT
    items:
      - "4 link nội bộ (V5) — cắt là tụt xuống dưới ngưỡng 3."
      - "Chữ 'khô' ở bộ thành phần (ràng buộc 9)."
      - "Mệnh đề 'sơ bộ' của NOAA và mốc 'tháng 5/2026' (ràng buộc 2)."
      - "Chữ 'đề xuất' của McDowell và chữ 'quy ước' của mốc 100 km (ràng buộc 7)."
      - "Mệnh đề 'các mốc trên là trung bình, thấp hơn ở cực, cao hơn ở xích đạo' (ràng buộc 4)."
      - "Mệnh đề 'số tính ra từ mô hình' kèm cả tử lẫn mẫu 50,6/101,4 kPa (ràng buộc 8)."

