# HAI BLOCKER. B1 chặn bước 4. B2 chặn bước 11 — và B2 phải sửa TRƯỚC B1.
# ─────────────────────────────────────────────────────────────────────────────
blockers:
  - id: B1
    blocks: "bước 4 (science-editor)"
    severity: hard
    statement: >
      Tiến trình `content-curator` lượt này không được cấp tool Task/Agent,
      nên không gọi được agent `science-editor` thật.
    how_to_reverify: >
      Trong phiên nghi ngờ, chạy ToolSearch với "select:Task,Agent" — lượt này
      trả "No matching deferred tools found" — và ToolSearch với từ khoá
      "spawn subagent delegate task run agent", lượt này trả về TaskStop,
      SendMessage, RemoteTrigger, EnterWorktree, CronCreate, Monitor,
      PushNotification: KHÔNG có tool nào spawn được agent. `ListAgents` xác
      nhận thêm: phiên chính là `sciencepedia-09`, còn tiến trình này chỉ là
      một subagent đang chạy trong nó.
    why_not_worked_around: >
      Ba lối vòng đều bị loại, ghi ra để lượt sau khỏi thử lại:
      (a) TỰ CHẤM THAY — bị cấm, và tiền lệ nói thẳng vì sao: trong
          cau-truc-ben-trong-trai-dat, hai lượt `content-curator` tự chấm đều
          ghi "đạt", rồi agent `science-editor` THẬT bắt được 2 lỗi S2 mà cả
          hai đều bỏ lọt. Một ô tự điền không phải bằng chứng yếu — nó là
          thông tin SAI, vì lượt sau sẽ tin nó mà không kiểm lại.
      (b) SKILL THAY AGENT — không có skill `science-editor`; nó là AGENT
          (quyền phủ quyết), không phải skill. Danh sách skill khả dụng lượt
          này không chứa nó.
      (c) NHỜ PHIÊN KHÁC — `ListAgents` không thấy phiên nào khác ngoài phiên
          chính, và phiên chính đang chờ chính tool call này trả về, nên
          SendMessage tới nó chỉ xếp hàng chứ không quay lại kịp lượt này.
    resolution: "Chạy lại ở phiên `main` (có tool Task). Đã gửi handoff sang đó."

  - id: B2
    blocks: "bước 11 (publish:check) — nhưng phải sửa ở bước 3"
    severity: hard
    statement: "Bản nháp dài 769 từ văn xuôi; gate cho phép 400–600."
    how_to_reverify: >
      scripts/check-publish.ts: MIN_MINUTES=2 (dòng 45), MAX_MINUTES=3 (46),
      WORDS_PER_MINUTE=200 (52) → MIN_WORDS=400, MAX_WORDS=600 (67–68).
      countWords = `markdown.trim().split(/\s+/).length` (153–155).
      prose() chỉ cắt phần đuôi xuất xứ sau một dòng `\n---`; bản nháp KHÔNG
      có đuôi đó (kiểm: `md.lastIndexOf('\n---')` → -1), nên prose() trả về
      NGUYÊN bản nháp và số đếm là 769. Thừa 169 từ.
    not_exempt_because: >
      `lengthExempt` (dòng 349–352) chỉ đúng khi status === 'PUBLISHED' VÀ
      publishedAt < LENGTH_RULE_FROM. Bài chưa có hàng nào (V1), nên không
      thể miễn. Chú thích trong chính script nói rõ: "Bản nháp không được
      miễn: nó sắp publish, tức sắp thành bài mới."
    why_it_must_be_fixed_BEFORE_step_4: >
      Đây là điểm đáng giá nhất của lượt này. Cám dỗ tự nhiên là chạy bước 4
      trước rồi rút gọn sau, vì rút gọn "chỉ là hình thức". Tiền lệ
      dien-tich-va-dong-dien nói ngược lại: lượt rút bài từ 1.016 xuống 588 từ
      TỰ SINH RA một lỗi S2 (bản nén viết hai dây song song "HÚT NHAU" — một
      mệnh đề về chiều lực mà nguồn không nói), và bước 4 mới bắt được.
      Kết luận đã ghi ở đó: "Mọi lượt rút gọn phải đi qua gate accuracy lần
      nữa." Nếu chạy bước 4 trên bản 769 từ rồi rút xuống 600, chữ ký approve
      của editor sẽ nằm trên một văn bản KHÔNG còn tồn tại.
    resolution: >
      Rút xuống ≤600 từ TRƯỚC, bằng cách XOÁ câu chứ không viết lại (giữ
      nguyên chữ của bước 3 ở những câu còn lại), rồi mới gọi science-editor
      MỘT lần trên bản cuối.

