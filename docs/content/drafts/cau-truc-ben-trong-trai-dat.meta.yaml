# BƯỚC 6 — seo-optimizer (chốt 2026-09-06, lượt chạy tiếp nối)
# ─────────────────────────────────────────────────────────────────────────────
# Canonical, hreflang, JSON-LD (ScholarlyArticle + BreadcrumbList + about.sameAs)
# đều do src/lib/seo.ts sinh RA TỪ hàng CSDL — không có gì để viết tay ở đây.
# Việc của bước này là chốt đúng những trường nuôi chúng, và kiểm 10 mục.
seo:
  title: "Cấu trúc bên trong Trái Đất"
  title_en: "Inside the Earth: Crust, Mantle and Core"
  seo_title: "Cấu trúc bên trong Trái Đất: vỏ, manti và lõi"        # 45 ký tự, ≤60
  seo_description: >-
    Vỏ, manti, lõi ngoài lỏng, lõi trong đặc — dựng lại từ sóng địa chấn, vì lỗ
    khoan Kola sâu 12 km vẫn chưa xuyên nổi ranh giới vỏ–manti. Số liệu USGS và NASA.
  seo_description_len: 157                                          # trong băng 140–160
  # KHÔNG được thêm "6.371 km" hay "bán kính trung bình" vào description: câu
  # đó bị xoá khỏi thân bài ở vòng 1 bước 4 vì là trùng hợp làm tròn, không
  # phải sự kiện có nguồn (xem claim_map). Description không được nói điều
  # thân bài không còn nói.
  seo_keywords: >-
    cấu trúc bên trong Trái Đất, các lớp của Trái Đất, vỏ Trái Đất, manti,
    lõi ngoài, lõi trong, mặt Moho, sóng địa chấn, vùng bóng sóng S, geodynamo,
    lỗ khoan Kola
  canonical: "https://<site>/vi/articles/cau-truc-ben-trong-trai-dat"

  # Chốt biên tập của bước này, để lượt sau không "sửa lại cho kêu":
  wording_guard: >
    Metadata KHÔNG được nói "bốn lớp" trống trơn (lỗi E2) và KHÔNG được nói
    "lỗ khoan sâu nhất" (lỗi E3 — không nguồn nào trong bảng phát biểu so sánh
    nhất). Hai cụm đó đã bị bước 4 gạch khỏi thân bài; để chúng lẻn vào
    description là làm hỏng đúng cái vừa sửa, ở chỗ hiển thị nhiều hơn cả bài.
    Quy tắc 6 của skill: không viết lại một claim để lấy từ khoá.

  # 10 mục kiểm của seo-optimizer, mode B
  checks:
    title_unique: pass          # rà 47 bài PUBLISHED trong CSDL — không trùng title cũng không trùng seoTitle
    description_unique: pass    # không bài nào dùng câu này; và nó không lặp lại tiêu đề
    canonical: pass             # tự trỏ, tuyệt đối, đúng locale — buildMetadata() sinh
    url: pass                   # /vi/articles/cau-truc-ben-trong-trai-dat — thường, gạch nối, cố định
    json_ld: pass               # ScholarlyArticle + BreadcrumbList; about.sameAs = Q1664027 nhờ entityId đã gắn ở bước 5
    headings: pass              # thân bài chỉ có h2 (4 mục), h1 do trang sinh từ title — không nhảy cấp
    internal_links: pass        # 4 ra (cần ≥3, mat-troi rơi khi cắt phép ví Mặt Trời ở vòng 1), 1 vào từ `trai-dat` (cần ≥1) — xem link_resolution
    hreflang: pass              # vi/en + x-default, đối xứng; cần contentEn, xem bước 9
    sitemap: pass               # sitemap dựng từ bài PUBLISHED, lastmod = updatedAt
    server_rendered: pass       # revalidate = 300 (ISR), Server Component, thân bài nằm trong HTML đầu tiên

  # Kiểm bằng Prisma ngày 2026-09-06, KHÔNG suy đoán: cả 5 slug đích đều tồn
  # tại và đều PUBLISHED, nên không link nào rơi vào bản nháp.
  link_resolution:
    song-buoc-song-tan-so-bien-do: PUBLISHED
    trai-dat: PUBLISHED
    dien-tich-va-dong-dien: PUBLISHED
    tu-truong-va-luc-hap-dan: PUBLISHED

  cannibalization: >
    Không. Bài gần nhất là `trai-dat` (hành tinh, entity Q2) và
    `song-buoc-song-tan-so-bien-do` (tính chất của sóng, dùng vùng bóng địa
    chấn làm MINH HOẠ). Bài này dùng vùng bóng làm BẰNG CHỨNG về cấu trúc —
    khác ý định tìm kiếm, khác entity (Q1664027). Xem editor_pass.cross_article_check.

