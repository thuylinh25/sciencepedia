uncertainty_report:
  - "Không phát biểu định luật bảo toàn điện tích — không có nguồn bậc 1–2 trong pack (theo yêu cầu của bước 2)."
  - "Không nói tới tốc độ trôi của electron trong dây dẫn — không có nguồn bậc 1–2 (theo yêu cầu của bước 2)."
  - "Không dùng câu 'picoampere ... 100 million times per second' của NIST vì tự nó không nhất quán về số (xem S4 ở bước 2)."
  - "Con số 120 V / 15 A đã được gắn nhãn 'theo chuẩn Mỹ' trong bài; điện dân dụng Việt Nam là 220 V."
  - "Con số sét dùng bản NWS ('điển hình ~30.000 A'), không trộn với ví dụ '100.000 A trở lên' của NIST."
  - "Hodgkin & Huxley 1952 chỉ được dùng ở mức tiêu đề (bản PMC là ảnh quét); chi tiết Na⁺/K⁺ quy về NCBI Bookshelf."
  - "Điện tích của quark (bội phân số của e) bị BỎ khỏi bài: không lấy được trang PDG hay CERN nào phát biểu con số ±2/3, ±1/3 trong lượt nghiên cứu này. Để dành cho bài về hạt cơ bản."

